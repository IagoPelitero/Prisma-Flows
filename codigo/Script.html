<script>
/* =====================================================================
   PRISMA FLOWS — interface
   Estado em memória + render por template string + eventos delegados.
   Toda escrita passa por uma fila (uma por vez, na ordem em que você fez)
   e a tela já muda antes do servidor responder.
   ===================================================================== */
(function () {
  'use strict';

  /* ------------------------------------------------------------------
     Constantes e utilitários
     ------------------------------------------------------------------ */
  var MESES = ['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez'];
  var CORES_QUADRO = ['#6E4BD8', '#3B5BDB', '#1785BD', '#1F9467', '#C49000', '#DD6519', '#D23B3B', '#56607A'];
  var CORES_ETIQUETA = ['#2F9E44', '#E0A100', '#E8590C', '#D63939', '#7048E8', '#1C6ED4', '#0B8A8A', '#C2255C', '#5C677D'];
  var CORES_AVATAR = ['#5B4BC4', '#2F5BD3', '#16729F', '#1E7A58', '#7D6200', '#B04E16', '#B23A48', '#56607A'];
  var ROTULOS_CONFIG = {
    NOME_SISTEMA: 'Nome do sistema',
    SUBTITULO: 'Subtítulo',
    ACESSO_LIVRE: 'Acesso livre',
    PERFIL_PADRAO: 'Perfil de quem entra pelo acesso livre',
    LISTAS_PADRAO: 'Listas de todo quadro novo',
    ETIQUETAS_PADRAO: 'Etiquetas de todo quadro novo',
    ATUALIZAR_SEGUNDOS: 'Conferir mudanças a cada (segundos)',
    FERIADOS: 'Feriados (rotinas e grade da Equipe)',
    HOME_DIAS_PADRAO: 'Dias de home por semana (padrão)',
    MIN_PRESENCIAIS_DIA: 'Mínimo de pessoas presenciais por dia'
  };

  var I = {
    logo: '<svg class="marca-logo" viewBox="0 0 28 24" aria-hidden="true"><path d="M1.5 13.2 9.6 12" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" fill="none"/><path d="M13.5 3 21.5 19.5H5.5Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" fill="none"/><path d="M18 10.8 26.5 7" style="stroke:var(--e1)" stroke-width="1.7" stroke-linecap="round"/><path d="M18.6 12.4 26.5 11.6" style="stroke:var(--e3)" stroke-width="1.7" stroke-linecap="round"/><path d="M19.2 14 26.5 16.2" style="stroke:var(--e5)" stroke-width="1.7" stroke-linecap="round"/><path d="M19.8 15.6 26.5 20.6" style="stroke:var(--e7)" stroke-width="1.7" stroke-linecap="round"/></svg>',
    calendario: '<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>',
    check: '<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="17" rx="3"/><path d="m8 12.5 2.8 2.8L16.5 9.5"/></svg>',
    ok: '<svg class="ic ok-ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="m8 12.4 2.7 2.7L16.2 9.6"/></svg>',
    comentario: '<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 12.5a7.5 7.5 0 0 1-11 6.6L4 20.5l1.5-4.6A7.5 7.5 0 1 1 20.5 12.5Z"/></svg>',
    texto: '<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 11h16M4 16h10"/></svg>',
    fechar: '<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>',
    mais: '<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>',
    pontos: '<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="5.5" cy="12" r="1.2" fill="currentColor"/><circle cx="12" cy="12" r="1.2" fill="currentColor"/><circle cx="18.5" cy="12" r="1.2" fill="currentColor"/></svg>',
    atualizar: '<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.4-5.7M20 4v5h-5"/></svg>',
    tema: '<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 3.5v17a8.5 8.5 0 0 0 0-17Z" fill="currentColor"/></svg>',
    busca: '<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/></svg>',
    etiqueta: '<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 12.2V4.5a1 1 0 0 1 1-1h7.7l8.3 8.3-8.7 8.7Z"/><circle cx="8" cy="8" r="1.4"/></svg>',
    caixa: '<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="5" rx="1.5"/><path d="M5 9v9.5A1.5 1.5 0 0 0 6.5 20h11a1.5 1.5 0 0 0 1.5-1.5V9M10 13h4"/></svg>',
    ajustes: '<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>',
    funil: '<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16l-6.2 7.6V19l-3.6-1.8v-4.6Z"/></svg>',
    pessoas: '<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.2"/><path d="M3.5 19.5a5.5 5.5 0 0 1 11 0M15.6 5a3.2 3.2 0 0 1 0 6.1M17.6 19.5a5.6 5.6 0 0 0-2.4-4.6"/></svg>',
    caixaEntrada: '<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 13.5 6.4 5.5h11.2l2.4 8v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1Z"/><path d="M4 13.5h4.8l1.2 2.2h4l1.2-2.2H20"/></svg>',
    escala: '<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 11a7.5 7.5 0 0 1 13-4.6M19.5 4v4h-4M19.5 13a7.5 7.5 0 0 1-13 4.6M4.5 20v-4h4"/><circle cx="12" cy="11.2" r="1.9"/><path d="M8.8 15.6a3.4 3.4 0 0 1 6.4 0"/></svg>',
    seta: '<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6"/></svg>',
    teclado: '<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="2.5" y="6" width="19" height="12" rx="2.2"/><path d="M6.5 10h.01M10 10h.01M14 10h.01M17.5 10h.01M6.5 14h.01M17.5 14h.01M9.5 14h5"/></svg>',
    mover: '<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M13.5 4.5h6v6M19.5 4.5 11 13M10 5H6a1.5 1.5 0 0 0-1.5 1.5V18A1.5 1.5 0 0 0 6 19.5h11.5A1.5 1.5 0 0 0 19 18v-4"/></svg>',
    rotina: '<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.4-5.7M20 4v5h-5"/><path d="M12 8v4.2l2.6 1.6"/></svg>',
    equipe: '<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/><circle cx="12" cy="13.6" r="1.6"/><path d="M9.2 18a2.9 2.9 0 0 1 5.6 0"/></svg>',
    almoco: '<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3v8M4.5 3v4.5A2.5 2.5 0 0 0 7 10a2.5 2.5 0 0 0 2.5-2.5V3M7 10v11M17 21V3c-2.2 1.2-3.5 3.6-3.5 6.5 0 2 .9 3.4 3.5 3.5"/></svg>',
    casa: '<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 11 12 4l8.5 7M5.5 9.5V20h13V9.5M10 20v-5.5h4V20"/></svg>',
    carrossel: '<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="m17 2.5 3.5 3.5L17 9.5M3.5 11V9.5A3.5 3.5 0 0 1 7 6h13.5M7 21.5 3.5 18 7 14.5M20.5 13v1.5A3.5 3.5 0 0 1 17 18H3.5"/></svg>',
    lapis: '<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4L19 9a2.1 2.1 0 0 0-4-4L4 16v4ZM13.5 6.5l4 4"/></svg>',
    copiar: '<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="8.5" y="8.5" width="11" height="11" rx="2"/><path d="M15.5 8.5V6.5A2 2 0 0 0 13.5 4.5h-7a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h2"/></svg>',
    lixo: '<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>'
  };

  function $(sel, el) { return (el || document).querySelector(sel); }
  function $$(sel, el) { return Array.prototype.slice.call((el || document).querySelectorAll(sel)); }
  function esc(s) {
    return String(s === null || s === undefined ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  function norm(s) {
    return String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().trim();
  }
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function hojeIso() { var d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function somaDias(iso, n) {
    var p = iso.split('-').map(Number);
    var d = new Date(p[0], p[1] - 1, p[2] + n);
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  }
  function dataCurta(iso) {
    if (!iso) return '';
    var p = iso.slice(0, 10).split('-').map(Number);
    var s = p[2] + ' ' + MESES[p[1] - 1];
    return p[0] === new Date().getFullYear() ? s : s + ' ' + p[0];
  }
  function dataHora(isoDT) {
    if (!isoDT) return '';
    var dia = isoDT.slice(0, 10);
    var hora = isoDT.slice(11, 16);
    var h = hojeIso();
    if (dia === h) return 'hoje, ' + hora;
    if (dia === somaDias(h, -1)) return 'ontem, ' + hora;
    return dataCurta(dia) + ', ' + hora;
  }
  function agoraIso() {
    var d = new Date();
    return hojeIso() + 'T' + pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds());
  }
  function iniciais(nome) {
    var p = String(nome || '?').trim().split(/\s+/);
    return ((p[0] || '?').charAt(0) + (p.length > 1 ? p[p.length - 1].charAt(0) : '')).toUpperCase();
  }
  function hash(s) { var h = 0; s = String(s || ''); for (var i = 0; i < s.length; i++) { h = ((h << 5) - h + s.charCodeAt(i)) | 0; } return Math.abs(h); }
  function avatar(nome, pequeno) {
    return '<span class="avatar' + (pequeno ? ' p' : '') + '" style="--av:' + CORES_AVATAR[hash(norm(nome)) % CORES_AVATAR.length] + '" title="' + esc(nome) + '" aria-hidden="true">' + esc(iniciais(nome)) + '</span>';
  }
  function textoSobre(hex) {
    var m = /^#?([0-9a-f]{6})$/i.exec(hex || '');
    if (!m) return '#fff';
    var n = parseInt(m[1], 16);
    var c = [(n >> 16) & 255, (n >> 8) & 255, n & 255].map(function (v) { v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); });
    var L = 0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2];
    return L > 0.36 ? '#161B26' : '#FFFFFF';
  }
  function etiquetaHtml(e, grande) {
    return '<span class="etq' + (e.nome ? '' : ' sem-nome') + '" style="--etq:' + esc(e.cor) + ';--etq-txt:' + textoSobre(e.cor) + '"' + (grande ? '' : ' title="' + esc(e.nome) + '"') + '>' + esc(e.nome) + '</span>';
  }
  function primeiroNome(n) { return String(n || '').split(/\s+/)[0]; }
  function corEspectro(i) { return 'var(--e' + ((i % 7) + 1) + ')'; }
  function plural(n, um, varios) { return n + ' ' + (n === 1 ? um : varios); }
  function msgErro(e) {
    var m = (e && e.message) ? e.message : String(e || 'Erro desconhecido');
    return m.replace(/^(Exception|Error|ScriptError|Erro):\s*/i, '');
  }
  function lerPref(k) { try { return window.localStorage.getItem('prisma.' + k); } catch (err) { return null; } }
  function gravarPref(k, v) { try { window.localStorage.setItem('prisma.' + k, v); } catch (err) { /* sem storage */ } }

  /* ------------------------------------------------------------------
     Estado
     ------------------------------------------------------------------ */
  var S = {
    usuario: null, config: {}, usuarios: [], quadros: [], prioridades: ['Baixa', 'Média', 'Alta', 'Urgente'], perfis: ['ADM', 'Membro', 'Leitor'],
    view: 'carregando',
    quadro: null,
    versao: '',
    desatualizado: false,
    filtros: { texto: '', responsavel: '', etiqueta: '', prazo: '', meus: false },
    filtrosAbertos: false,
    novoEm: null, rascunhoNovo: '', criandoLista: false, editandoLista: null,
    cartaoAberto: null, detalhe: null, rascunho: { comentario: '', item: '' }, editandoItem: null,
    admin: null,
    meus: null,
    minhasEscalas: [],
    resumoEquipe: null,
    rotinas: null,
    equipe: null,
    escalaModal: null,
    arrastando: false
  };

  /* ------------------------------------------------------------------
     Servidor: leitura direta, escrita em fila
     ------------------------------------------------------------------ */
  function api(nome) {
    var args = Array.prototype.slice.call(arguments, 1);
    return new Promise(function (ok, falha) {
      var r = google.script.run.withSuccessHandler(ok).withFailureHandler(falha);
      r[nome].apply(r, args);
    });
  }

  var fila = Promise.resolve();
  var pendentes = 0;
  var timerStatus = null;
  function escrever(nome) {
    var args = arguments;
    pendentes++;
    atualizarStatus();
    var p = fila.then(function () { return api.apply(null, args); });
    fila = p.catch(function () {}).then(function () {
      pendentes--;
      atualizarStatus();
      if (!pendentes && S.desatualizado) setTimeout(verificar, 50);
    });
    return p.then(function (r) { aplicarVersao(r); return r; });
  }
  function aplicarVersao(r) {
    if (!r || !r.versao || S.view !== 'quadro' || !S.quadro) return;
    if (r.versaoAnterior !== S.versao) S.desatualizado = true;
    S.versao = r.versao;
  }
  function atualizarStatus() {
    var el = $('#status-salvo');
    if (!el) return;
    clearTimeout(timerStatus);
    if (pendentes > 0) {
      el.textContent = 'Salvando…';
      el.className = 'status salvando';
      el.style.opacity = '1';
    } else {
      el.textContent = 'Salvo';
      el.className = 'status';
      timerStatus = setTimeout(function () { el.style.opacity = '0'; }, 2200);
    }
  }
  function falhou(e) {
    aviso(msgErro(e), { erro: true });
    if (S.view === 'quadro' && S.quadro) recarregarQuadro(true);
  }

  /* ------------------------------------------------------------------
     Avisos, menus, modais
     ------------------------------------------------------------------ */
  function aviso(texto, op) {
    op = op || {};
    var raiz = $('#avisos');
    var el = document.createElement('div');
    el.className = 'aviso' + (op.erro ? ' erro' : '');
    el.innerHTML = '<span>' + esc(texto) + '</span>' + (op.acao ? '<button type="button">' + esc(op.acao.rotulo) + '</button>' : '');
    if (op.acao) {
      el.querySelector('button').addEventListener('click', function () { el.remove(); op.acao.fn(); });
    }
    raiz.appendChild(el);
    while (raiz.children.length > 3) raiz.removeChild(raiz.firstChild);
    setTimeout(function () { el.remove(); }, op.erro ? 7000 : (op.acao ? 6500 : 3200));
  }

  var menuAberto = null;
  function abrirMenu(ancora, itens) {
    fecharMenu();
    var raiz = $('#menu-raiz');
    var el = document.createElement('div');
    el.className = 'menu';
    el.setAttribute('role', 'menu');
    el.innerHTML = itens.map(function (it, i) {
      return '<button type="button" role="menuitem" data-i="' + i + '" class="' + (it.perigo ? 'perigo' : '') + '">' + (it.icone || '') + esc(it.rotulo) + '</button>';
    }).join('');
    raiz.appendChild(el);
    var r = ancora.getBoundingClientRect();
    var w = el.offsetWidth;
    var h = el.offsetHeight;
    var left = Math.min(r.right - w, window.innerWidth - w - 8);
    var top = r.bottom + 6;
    if (top + h > window.innerHeight - 8) top = Math.max(8, r.top - h - 6);
    el.style.left = Math.max(8, left) + 'px';
    el.style.top = top + 'px';
    el.addEventListener('click', function (ev) {
      var b = ev.target.closest('button[data-i]');
      if (!b) return;
      var it = itens[+b.getAttribute('data-i')];
      fecharMenu();
      it.fn();
    });
    menuAberto = { el: el, ancora: ancora };
    var primeiro = el.querySelector('button');
    if (primeiro) primeiro.focus();
  }
  function fecharMenu() {
    if (!menuAberto) return;
    menuAberto.el.remove();
    menuAberto = null;
  }

  var modalAtual = null;
  function abrirModal(html, op) {
    op = op || {};
    var raiz = $('#modal-raiz');
    var anterior = document.activeElement;
    raiz.innerHTML = '<div class="modal-fundo" data-modal-fundo><div class="modal' + (op.largo ? ' largo' : '') + (op.extra ? ' extra' : '') + '" role="dialog" aria-modal="true" aria-labelledby="modal-titulo">' + html + '</div></div>';
    modalAtual = { anterior: anterior, aoFechar: op.aoFechar };
    var foco = raiz.querySelector('[autofocus]') || raiz.querySelector('input, textarea, select, button');
    if (foco && !op.semFoco) setTimeout(function () { foco.focus(); }, 30);
    return raiz.querySelector('.modal');
  }
  function fecharModal() {
    if (!modalAtual) return;
    var m = modalAtual;
    modalAtual = null;
    $('#modal-raiz').innerHTML = '';
    if (m.aoFechar) m.aoFechar();
    if (m.anterior && document.contains(m.anterior)) { try { m.anterior.focus(); } catch (err) { /* ok */ } }
  }

  function pedirTexto(op) {
    return new Promise(function (resolver) {
      var html = '<form data-form="pedir">' +
        '<div class="modal-cabeca"><h2 id="modal-titulo">' + esc(op.titulo) + '</h2>' + (op.texto ? '<p>' + esc(op.texto) + '</p>' : '') + '</div>' +
        '<div class="modal-corpo"><div class="campo"><label for="pedir-valor">' + esc(op.rotulo) + '</label>' +
        '<input id="pedir-valor" type="' + (op.tipo || 'text') + '" value="' + esc(op.valor || '') + '" ' + (op.tipo === 'number' ? 'min="0" step="1"' : 'maxlength="120"') + ' autofocus>' +
        (op.ajuda ? '<span class="ajuda">' + esc(op.ajuda) + '</span>' : '') + '</div></div>' +
        '<div class="modal-rodape"><div class="direita"><button type="button" class="btn sutil" data-acao="fechar-modal">Cancelar</button>' +
        '<button type="submit" class="btn primario">' + esc(op.confirmar || 'Salvar') + '</button></div></div></form>';
      var respondido = false;
      var m = abrirModal(html, { aoFechar: function () { if (!respondido) resolver(null); } });
      var campo = m.querySelector('#pedir-valor');
      setTimeout(function () { campo.select(); }, 40);
      m.querySelector('form').addEventListener('submit', function (ev) {
        ev.preventDefault();
        respondido = true;
        var v = campo.value;
        fecharModal();
        resolver(v);
      });
    });
  }

  /* ------------------------------------------------------------------
     Tema
     ------------------------------------------------------------------ */
  function aplicarTema(t) {
    if (t === 'claro' || t === 'escuro') document.documentElement.setAttribute('data-tema', t);
    else document.documentElement.removeAttribute('data-tema');
  }
  function alternarTema() {
    var atual = document.documentElement.getAttribute('data-tema');
    var escuroAgora = atual ? atual === 'escuro' : window.matchMedia('(prefers-color-scheme: dark)').matches;
    var novo = escuroAgora ? 'claro' : 'escuro';
    aplicarTema(novo);
    gravarPref('tema', novo);
  }

  /* ------------------------------------------------------------------
     Início
     ------------------------------------------------------------------ */
  function iniciarApp() {
    aplicarTema(lerPref('tema'));
    api('iniciar').then(function (r) {
      if (r && r.erro) { renderBloqueio(r); return; }
      S.usuario = r.usuario;
      S.config = r.config || {};
      S.usuarios = r.usuarios || [];
      S.quadros = r.quadros || [];
      S.minhasEscalas = r.minhasEscalas || [];
      S.resumoEquipe = r.equipe || null;
      if (r.prioridades) S.prioridades = r.prioridades;
      if (r.perfis) S.perfis = r.perfis;
      document.title = S.config.nomeSistema || 'Prisma Flows';
      var inicial = (window.PRISMA_INICIAL && window.PRISMA_INICIAL.quadro) || '';
      if (inicial && S.quadros.some(function (q) { return q.id === inicial; })) {
        abrirQuadro(inicial);
      } else {
        S.view = 'inicio';
        render();
      }
      iniciarVerificacao();
    }).catch(function (e) {
      $('#app').innerHTML = '<div class="bloqueio"><div class="bloqueio-cartao"><h1>Não foi possível abrir o sistema</h1><p>' + esc(msgErro(e)) + '</p><button class="btn primario" type="button" onclick="location.reload()">Tentar de novo</button></div></div>';
    });
  }

  function renderBloqueio(r) {
    var semEmail = r.erro === 'SEM_EMAIL';
    $('#app').innerHTML =
      '<div class="bloqueio"><div class="bloqueio-cartao">' + I.logo +
      '<h1>' + (semEmail ? 'Entre com sua conta Google' : 'Seu acesso ainda não foi liberado') + '</h1>' +
      '<p>' + esc(r.mensagem) + '</p>' +
      (r.email ? '<p>E-mail usado: <span class="chip">' + esc(r.email) + '</span></p>' : '') +
      '<div><button class="btn" type="button" onclick="location.reload()">Tentar de novo</button></div>' +
      '</div></div>';
  }

  /* ------------------------------------------------------------------
     Render principal
     ------------------------------------------------------------------ */
  function render() {
    fecharMenu();
    var corpo = '';
    if (S.view === 'inicio') corpo = htmlInicio();
    else if (S.view === 'quadro') corpo = S.quadro ? htmlQuadro() : htmlCarregando('Abrindo o quadro');
    else if (S.view === 'admin') corpo = htmlAdmin();
    else if (S.view === 'meus') corpo = htmlMeus();
    else if (S.view === 'rotinas') corpo = htmlRotinas();
    else if (S.view === 'equipe') corpo = htmlEquipe();
    $('#app').innerHTML = htmlTopo() + '<main id="conteudo">' + corpo + '</main>';
    if (S.view === 'quadro' && S.quadro) renderListas();
    if (S.view === 'admin') renderAdminCorpo();
    if (S.view === 'meus' && S.meus) renderMeusCorpo();
    if (S.view === 'rotinas' && S.rotinas) renderRotinasCorpo();
    if (S.view === 'equipe' && S.equipe) renderEquipeCorpo();
    atualizarStatusInicial();
  }

  function atualizarStatusInicial() {
    var el = $('#status-salvo');
    if (el && pendentes > 0) { el.textContent = 'Salvando…'; el.className = 'status salvando'; }
  }

  function htmlCarregando(texto) {
    return '<div class="carregando-area" role="status"><div class="feixe-carregando" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div><p>' + esc(texto) + '</p></div>';
  }

  function htmlTopo() {
    var u = S.usuario;
    var trilha = '';
    if (S.view === 'quadro' && S.quadro) trilha = '<nav class="trilha" aria-label="Você está em"><span aria-hidden="true">/</span><span>' + esc(S.quadro.quadro.nome) + '</span></nav>';
    if (S.view === 'admin') trilha = '<nav class="trilha" aria-label="Você está em"><span aria-hidden="true">/</span><span>Administração</span></nav>';
    if (S.view === 'meus') trilha = '<nav class="trilha" aria-label="Você está em"><span aria-hidden="true">/</span><span>Meus cartões</span></nav>';
    if (S.view === 'rotinas') trilha = '<nav class="trilha" aria-label="Você está em"><span aria-hidden="true">/</span><span>Rotinas</span></nav>';
    if (S.view === 'equipe') trilha = '<nav class="trilha" aria-label="Você está em"><span aria-hidden="true">/</span><span>Equipe</span></nav>';
    var pendEq = u && u.perfil === 'ADM' && S.resumoEquipe ? S.resumoEquipe.pendentes : 0;
    return '<header class="topo' + (S.view === 'quadro' ? ' topo-quadro' : '') + '">' +
      '<button type="button" class="marca" data-acao="ir-inicio" title="Voltar para os quadros">' + I.logo +
      '<span class="marca-nome">' + esc(S.config.nomeSistema || 'Prisma Flows') + '</span>' +
      (S.config.subtitulo ? '<span class="marca-sub">' + esc(S.config.subtitulo) + '</span>' : '') + '</button>' +
      trilha +
      '<div class="topo-dir">' +
      '<span id="status-salvo" class="status" aria-live="polite"></span>' +
      (S.view === 'quadro' ? '<button type="button" class="icone-btn" data-acao="atualizar" title="Buscar mudanças agora" aria-label="Atualizar quadro">' + I.atualizar + '</button>' : '') +
      (u ? '<button type="button" class="btn sutil btn-topo' + (S.view === 'meus' ? ' ativo' : '') + '" data-acao="ir-meus" title="Seus cartões em aberto em todos os quadros" aria-label="Meus cartões"' + (S.view === 'meus' ? ' aria-current="page"' : '') + '>' + I.caixaEntrada + '<span class="txt-btn">Meus cartões</span></button>' : '') +
      (u ? '<button type="button" class="btn sutil btn-topo' + (S.view === 'rotinas' ? ' ativo' : '') + '" data-acao="ir-rotinas" title="Tarefas que se repetem todo dia, semana ou mês" aria-label="Rotinas"' + (S.view === 'rotinas' ? ' aria-current="page"' : '') + '>' + I.rotina + '<span class="txt-btn">Rotinas</span></button>' : '') +
      (u ? '<button type="button" class="btn sutil btn-topo' + (S.view === 'equipe' ? ' ativo' : '') + '" data-acao="ir-equipe" title="Home e presencial, férias e banco de horas" aria-label="Equipe' + (pendEq ? ', ' + plural(pendEq, 'pedido esperando resposta', 'pedidos esperando resposta') : '') + '"' + (S.view === 'equipe' ? ' aria-current="page"' : '') + '>' + I.equipe + '<span class="txt-btn">Equipe</span>' + (pendEq ? '<span class="selo" aria-hidden="true">' + pendEq + '</span>' : '') + '</button>' : '') +
      '<button type="button" class="icone-btn" data-acao="tema" title="Alternar tema claro e escuro" aria-label="Alternar tema">' + I.tema + '</button>' +
      (u && u.perfil === 'ADM' ? '<button type="button" class="icone-btn" data-acao="ir-admin" title="Pessoas e configurações" aria-label="Administração">' + I.pessoas + '</button>' : '') +
      (u ? '<span class="eu" title="' + esc(u.email) + '">' + avatar(u.nome) + '<span><span class="eu-nome">' + esc(primeiroNome(u.nome)) + '</span> <span class="eu-perfil">' + esc(u.perfil) + '</span></span></span>' : '') +
      '</div></header>';
  }

  /* ------------------------------------------------------------------
     Tela inicial (lista de quadros)
     ------------------------------------------------------------------ */
  function htmlInicio() {
    var u = S.usuario;
    var podeCriar = u.perfil !== 'Leitor';
    var totalVencidos = S.quadros.reduce(function (s, q) { return s + q.vencidos; }, 0);
    var totalMeus = S.quadros.reduce(function (s, q) { return s + q.meus; }, 0);
    var sub = 'Olá, ' + esc(primeiroNome(u.nome)) + '.';
    if (totalMeus) sub += ' Você é responsável por <button type="button" class="link-texto" data-acao="ir-meus">' + plural(totalMeus, 'cartão em aberto', 'cartões em aberto') + '</button>.';
    if (totalVencidos) sub += ' ' + plural(totalVencidos, 'cartão está vencido', 'cartões estão vencidos') + ' nos seus quadros.';

    var tiles = S.quadros.map(function (q) {
      var feixe = q.total
        ? q.listas.map(function (l, i) { return l.total ? '<span style="--n:' + l.total + ';--c:' + corEspectro(i) + '" title="' + esc(l.nome) + ': ' + l.total + '"></span>' : ''; }).join('')
        : '';
      return '<button type="button" class="tile" data-acao="abrir-quadro" data-id="' + esc(q.id) + '">' +
        '<span class="tile-topo"><span class="tile-cor" style="--cor:' + esc(q.cor) + '"></span><span class="tile-nome">' + esc(q.nome) + '</span>' +
        (q.visibilidade === 'Privado' ? '<span class="chip">Privado</span>' : '') + '</span>' +
        (q.descricao ? '<span class="tile-desc">' + esc(q.descricao) + '</span>' : '') +
        '<span class="feixe" aria-hidden="true">' + feixe + '</span>' +
        '<span class="tile-numeros"><span><b>' + q.total + '</b> ' + (q.total === 1 ? 'cartão' : 'cartões') + '</span>' +
        (q.vencidos ? '<span class="alerta"><b>' + q.vencidos + '</b> ' + (q.vencidos === 1 ? 'vencido' : 'vencidos') + '</span>' : '') +
        (q.meus ? '<span><b>' + q.meus + '</b> com você</span>' : '') + '</span>' +
        '</button>';
    }).join('');

    var corpo;
    if (!S.quadros.length) {
      corpo = '<div class="vazio"><h2>Nenhum quadro por aqui ainda</h2>' +
        '<p>' + (podeCriar ? 'Crie o primeiro quadro para organizar as demandas da equipe em listas e cartões.' : 'Assim que alguém incluir você em um quadro, ele aparece aqui.') + '</p>' +
        (podeCriar ? '<button type="button" class="btn primario" data-acao="novo-quadro">' + I.mais + 'Criar quadro</button>' : '') + '</div>';
    } else {
      corpo = '<div class="grade-quadros">' + tiles +
        (podeCriar ? '<button type="button" class="tile tile-novo" data-acao="novo-quadro"><strong>Novo quadro</strong><span>Começa com as listas e etiquetas padrão da Config.</span></button>' : '') +
        '</div>';
    }
    return '<section class="inicio"><header class="inicio-cabeca"><div><h1>Quadros</h1><p class="sub">' + sub + '</p></div>' +
      (podeCriar && S.quadros.length ? '<button type="button" class="btn primario" data-acao="novo-quadro">' + I.mais + 'Novo quadro</button>' : '') +
      '</header>' + htmlMinhaSemana() + corpo +
      (podeCriar ? '<div class="rodape-inicio"><button type="button" class="btn sutil" data-acao="quadros-arquivados">' + I.caixa + 'Quadros arquivados</button></div>' : '') +
      '</section>';
  }

  function recarregarInicio() {
    return api('iniciar').then(function (r) {
      if (r.erro) { renderBloqueio(r); return; }
      S.usuario = r.usuario; S.config = r.config || S.config; S.usuarios = r.usuarios || []; S.quadros = r.quadros || [];
      S.minhasEscalas = r.minhasEscalas || [];
      S.resumoEquipe = r.equipe || null;
      if (S.view === 'inicio') render();
    }).catch(falhou);
  }

  function irInicio() {
    fecharGaveta();
    S.view = 'inicio';
    S.quadro = null;
    S.versao = '';
    render();
    recarregarInicio();
  }

  /* ------------------------------------------------------------------
     Meus cartões (todos os quadros)
     ------------------------------------------------------------------ */
  function abrirMeus() {
    fecharGaveta();
    S.view = 'meus';
    S.quadro = null;
    S.versao = '';
    S.meus = null;
    render();
    api('meusCartoes').then(function (r) {
      if (S.view !== 'meus') return;
      S.meus = r.cartoes || [];
      S.minhasEscalas = r.minhasEscalas || S.minhasEscalas;
      var ms = $('#minha-semana');
      if (ms) ms.outerHTML = htmlMinhaSemana();
      renderMeusCorpo();
    }).catch(function (e) {
      if (S.view !== 'meus') return;
      var el = $('#meus-corpo');
      if (el) el.innerHTML = '<p class="texto-suave">' + esc(msgErro(e)) + '</p>';
    });
  }

  function htmlMeus() {
    return '<section class="meus"><header class="inicio-cabeca"><div><h1>Meus cartões</h1>' +
      '<p class="sub">Cartões em aberto em que você é responsável, em todos os quadros que você vê.</p></div></header>' + htmlMinhaSemana() +
      '<div id="meus-corpo">' + htmlCarregando('Buscando seus cartões') + '</div></section>';
  }

  function grupoDoPrazo(prazo) {
    if (!prazo) return 'sem';
    var h = hojeIso();
    if (prazo < h) return 'atrasados';
    if (prazo === h) return 'hoje';
    if (prazo <= somaDias(h, 7)) return 'semana';
    return 'depois';
  }

  function renderMeusCorpo() {
    var el = $('#meus-corpo');
    if (!el || !S.meus) return;
    if (!S.meus.length) {
      el.innerHTML = '<div class="vazio"><h2>Nada em aberto com você</h2><p>Quando alguém colocar você como responsável num cartão, de qualquer quadro, ele aparece aqui.</p></div>';
      return;
    }
    var grupos = [['atrasados', 'Atrasados'], ['hoje', 'Vencem hoje'], ['semana', 'Próximos 7 dias'], ['depois', 'Mais adiante'], ['sem', 'Sem prazo']];
    el.innerHTML = grupos.map(function (g) {
      var itens = S.meus.filter(function (c) { return grupoDoPrazo(c.prazo) === g[0]; });
      if (!itens.length) return '';
      return '<section class="grupo-meus grupo-' + g[0] + '"><h2>' + g[1] + ' <span class="conta">' + itens.length + '</span></h2>' +
        '<ul class="linhas-cartao">' + itens.map(htmlLinhaMeu).join('') + '</ul></section>';
    }).join('');
  }

  function htmlLinhaMeu(c) {
    var est = estadoPrazo(c);
    var etqs = (c.etiquetasInfo || []).map(function (e) { return etiquetaHtml(e); }).join('');
    return '<li><button type="button" class="linha-cartao" data-acao="abrir-meu" data-quadro="' + esc(c.quadroId) + '" data-id="' + esc(c.id) + '" style="--espectro:' + corEspectro(Math.max(0, c.listaPosicao)) + '">' +
      '<span class="lc-texto"><span class="lc-titulo">' + esc(c.titulo) + '</span>' +
      '<span class="lc-onde"><span class="tile-cor" style="--cor:' + esc(c.quadroCor) + '"></span>' + esc(c.quadroNome) +
      '<span class="lc-lista">' + esc(c.listaNome) + '</span></span></span>' +
      '<span class="lc-sinais">' + (etqs ? '<span class="cartao-etiquetas">' + etqs + '</span>' : '') +
      (c.prioridade === 'Alta' || c.prioridade === 'Urgente' ? '<span class="prio prio-' + norm(c.prioridade) + '">' + esc(c.prioridade) + '</span>' : '') +
      (c.prazo ? '<span class="sinal prazo ' + est + '">' + I.calendario + esc(rotuloPrazo(c)) + '</span>' : '') +
      '</span></button></li>';
  }

  /* ------------------------------------------------------------------
     Quadro
     ------------------------------------------------------------------ */
  function abrirQuadro(id, cartaoId) {
    fecharGaveta();
    S.view = 'quadro';
    S.quadro = null;
    S.filtros = { texto: '', responsavel: '', etiqueta: '', prazo: '', meus: false };
    S.novoEm = null; S.criandoLista = false; S.editandoLista = null; S.desatualizado = false;
    gravarPref('ultimoQuadro', id);
    render();
    api('obterQuadro', id).then(function (r) {
      if (S.view !== 'quadro') return;
      S.quadro = r;
      S.versao = r.versao;
      render();
      if (cartaoId) {
        if (cartao(cartaoId)) abrirCartao(cartaoId);
        else aviso('Esse cartão não está mais neste quadro.');
      }
    }).catch(function (e) {
      aviso(msgErro(e), { erro: true });
      irInicio();
    });
  }

  function recarregarQuadro(silencioso) {
    if (!S.quadro) return Promise.resolve();
    var id = S.quadro.quadro.id;
    return api('obterQuadro', id).then(function (r) {
      if (S.view !== 'quadro' || !S.quadro || S.quadro.quadro.id !== id) return;
      S.quadro = r;
      S.versao = r.versao;
      S.desatualizado = false;
      var cab = $('#quadro-topo');
      if (cab) cab.outerHTML = htmlCabecalhoQuadro();
      var trilha = $('.trilha span:last-child');
      if (trilha) trilha.textContent = r.quadro.nome;
      renderListas();
      if (S.cartaoAberto) {
        if (!cartao(S.cartaoAberto)) { fecharGaveta(); aviso('Este cartão foi arquivado ou removido do quadro.'); }
        else atualizarGavetaPorFora();
      }
      if (!silencioso) aviso('Quadro atualizado.');
    }).catch(function (e) {
      if (!silencioso) aviso(msgErro(e), { erro: true });
    });
  }

  function cartao(id) {
    if (!S.quadro) return null;
    for (var i = 0; i < S.quadro.cartoes.length; i++) if (S.quadro.cartoes[i].id === id) return S.quadro.cartoes[i];
    return null;
  }
  function lista(id) {
    if (!S.quadro) return null;
    return S.quadro.listas.filter(function (l) { return l.id === id; })[0] || null;
  }
  function indiceLista(id) {
    if (!S.quadro) return 0;
    for (var i = 0; i < S.quadro.listas.length; i++) if (S.quadro.listas[i].id === id) return i;
    return 0;
  }
  function etiquetaPorId(id) {
    return S.quadro.etiquetas.filter(function (e) { return e.id === id; })[0] || null;
  }
  function cartoesDaLista(listaId) {
    return S.quadro.cartoes.filter(function (c) { return c.listaId === listaId; }).sort(function (a, b) { return a.ordem - b.ordem; });
  }
  function ehMeu(c) {
    var eu = norm(S.usuario.nome);
    return c.responsaveis.some(function (n) { return norm(n) === eu; });
  }
  function estadoPrazo(c) {
    if (!c.prazo) return '';
    if (c.concluido) return 'feito';
    var h = hojeIso();
    if (c.prazo < h) return 'vencido';
    if (c.prazo === h) return 'hoje';
    if (c.prazo <= somaDias(h, 2)) return 'breve';
    return '';
  }
  function rotuloPrazo(c) {
    var est = estadoPrazo(c);
    var h = hojeIso();
    if (est === 'hoje') return 'Hoje';
    if (c.prazo === somaDias(h, 1)) return 'Amanhã';
    return dataCurta(c.prazo);
  }

  function filtrosAtivos() {
    var f = S.filtros;
    return !!(f.texto || f.responsavel || f.etiqueta || f.prazo || f.meus);
  }
  function passaFiltro(c) {
    var f = S.filtros;
    if (f.texto) {
      var alvo = norm(c.titulo + ' ' + c.descricao + ' ' + c.id + ' ' + c.responsaveis.join(' ') + ' ' +
        Object.keys(c.extras || {}).map(function (k) { return c.extras[k]; }).join(' ') + ' ' +
        c.etiquetas.map(function (id) { var e = etiquetaPorId(id); return e ? e.nome : ''; }).join(' '));
      if (alvo.indexOf(norm(f.texto)) === -1) return false;
    }
    if (f.responsavel === '__ninguem') { if (c.responsaveis.length) return false; }
    else if (f.responsavel && !c.responsaveis.some(function (n) { return norm(n) === norm(f.responsavel); })) return false;
    if (f.etiqueta && c.etiquetas.indexOf(f.etiqueta) === -1) return false;
    if (f.meus && !ehMeu(c)) return false;
    var h = hojeIso();
    switch (f.prazo) {
      case 'vencidos': return !!c.prazo && c.prazo < h && !c.concluido;
      case 'hoje': return c.prazo === h;
      case 'semana': return !!c.prazo && c.prazo >= h && c.prazo <= somaDias(h, 7);
      case 'sem': return !c.prazo;
      case 'abertos': return !c.concluido;
      case 'concluidos': return c.concluido;
      default: return true;
    }
  }

  function htmlCabecalhoQuadro() {
    var Q = S.quadro;
    var q = Q.quadro;
    return '<div id="quadro-topo"><header class="quadro-cabeca">' +
      '<div class="quadro-titulo"><span class="tile-cor" style="--cor:' + esc(q.cor) + '"></span><h1 class="quadro-nome">' + esc(q.nome) + '</h1>' +
      (q.visibilidade === 'Privado' ? '<span class="chip" title="Só o dono, os convidados e ADMs veem">Privado</span>' : '') +
      (Q.podeEditar ? '' : '<span class="chip">Só leitura</span>') +
      (Q.escala && Q.escala.minha ? '<span class="chip chip-frente" title="Sua frente na escala desta semana">Sua frente: ' + esc(Q.escala.minha.frente) + ', ' + Q.escala.minha.posicao + 'º na ordem</span>' : '') + '</div>' +
      '<div class="quadro-acoes">' +
      (Q.podeEditar ? '<button type="button" class="btn sutil" data-acao="etiquetas" aria-label="Etiquetas">' + I.etiqueta + '<span class="txt-btn">Etiquetas</span></button>' : '') +
      '<button type="button" class="btn sutil" data-acao="arquivados" aria-label="Arquivados">' + I.caixa + '<span class="txt-btn">Arquivados</span></button>' +
      (Q.escala && (Q.escala.ligada || Q.escala.podeAdministrar) ? '<button type="button" class="btn sutil" data-acao="escala" aria-label="Escala da semana">' + I.escala + '<span class="txt-btn">Escala</span></button>' : '') +
      '<button type="button" class="btn sutil" data-acao="dia-almoco" aria-label="Escala de almoço">' + I.almoco + '<span class="txt-btn">Almoço</span></button>' +
      '<button type="button" class="btn sutil" data-acao="dia-home" aria-label="Escala de home office">' + I.casa + '<span class="txt-btn">Home</span></button>' +
      '<button type="button" class="btn sutil so-desktop" data-acao="atalhos" aria-label="Atalhos do teclado" title="Atalhos do teclado (?)">' + I.teclado + '<span class="txt-btn">Atalhos</span></button>' +
      (Q.podeAdministrar ? '<button type="button" class="btn sutil" data-acao="configurar-quadro" aria-label="Configurar quadro">' + I.ajustes + '<span class="txt-btn">Configurar</span></button>' : '') +
      '</div></header>' +
      (q.descricao ? '<p class="quadro-desc">' + esc(q.descricao) + '</p>' : '') + '</div>';
  }

  function htmlFiltros() {
    var f = S.filtros;
    var nomes = {};
    S.usuarios.forEach(function (u) { nomes[norm(u.nome)] = u.nome; });
    S.quadro.cartoes.forEach(function (c) { c.responsaveis.forEach(function (n) { if (!nomes[norm(n)]) nomes[norm(n)] = n; }); });
    var listaNomes = Object.keys(nomes).map(function (k) { return nomes[k]; }).sort(function (a, b) { return a.localeCompare(b, 'pt-BR'); });
    var nAtivos = (f.responsavel ? 1 : 0) + (f.etiqueta ? 1 : 0) + (f.prazo ? 1 : 0) + (f.meus ? 1 : 0);
    return '<div class="filtros' + (S.filtrosAbertos ? ' aberto' : '') + '" role="search">' +
      '<label class="busca">' + I.busca + '<span class="so-leitor">Buscar cartões</span><input type="search" id="filtro-texto" placeholder="Buscar cartões" value="' + esc(f.texto) + '"></label>' +
      '<button type="button" class="btn alternar-filtros" data-acao="alternar-filtros" aria-expanded="' + (S.filtrosAbertos ? 'true' : 'false') + '">' + I.funil + 'Filtros' + (nAtivos ? ' (' + nAtivos + ')' : '') + '</button>' +
      '<div class="filtros-mais">' +
      '<label><span class="so-leitor">Responsável</span><select id="filtro-responsavel">' +
      '<option value="">Todos os responsáveis</option><option value="__ninguem"' + (f.responsavel === '__ninguem' ? ' selected' : '') + '>Sem responsável</option>' +
      listaNomes.map(function (n) { return '<option value="' + esc(n) + '"' + (norm(n) === norm(f.responsavel) && f.responsavel !== '__ninguem' ? ' selected' : '') + '>' + esc(n) + '</option>'; }).join('') +
      '</select></label>' +
      '<label><span class="so-leitor">Etiqueta</span><select id="filtro-etiqueta"><option value="">Todas as etiquetas</option>' +
      S.quadro.etiquetas.map(function (e) { return '<option value="' + esc(e.id) + '"' + (f.etiqueta === e.id ? ' selected' : '') + '>' + esc(e.nome || 'Sem nome') + '</option>'; }).join('') +
      '</select></label>' +
      '<label><span class="so-leitor">Prazo e situação</span><select id="filtro-prazo">' +
      [['', 'Qualquer prazo'], ['vencidos', 'Vencidos'], ['hoje', 'Vencem hoje'], ['semana', 'Próximos 7 dias'], ['sem', 'Sem prazo'], ['abertos', 'Em aberto'], ['concluidos', 'Concluídos']]
        .map(function (o) { return '<option value="' + o[0] + '"' + (f.prazo === o[0] ? ' selected' : '') + '>' + o[1] + '</option>'; }).join('') +
      '</select></label>' +
      '<label class="alternar"><input type="checkbox" id="filtro-meus"' + (f.meus ? ' checked' : '') + '>Só os meus</label>' +
      '</div>' +
      '<span id="filtro-resumo" class="resumo"></span>' +
      '<span id="novidades"></span>' +
      '</div>';
  }

  function atualizarBotaoFiltros() {
    var b = $('.alternar-filtros');
    if (!b) return;
    var f = S.filtros;
    var n = (f.responsavel ? 1 : 0) + (f.etiqueta ? 1 : 0) + (f.prazo ? 1 : 0) + (f.meus ? 1 : 0);
    b.innerHTML = I.funil + 'Filtros' + (n ? ' (' + n + ')' : '');
  }

  function redesenharFiltros() {
    var f = $('.filtros');
    if (f) f.outerHTML = htmlFiltros();
    renderListas();
  }

  function htmlQuadro() {
    return '<section class="quadro' + (S.quadro.podeEditar ? ' editavel' : '') + '">' +
      htmlCabecalhoQuadro() + htmlFiltros() +
      '<div class="quadro-listas" id="listas"></div></section>';
  }

  function htmlCartao(c) {
    var etqs = c.etiquetas.map(etiquetaPorId).filter(Boolean);
    var sinais = [];
    if (c.prazo) {
      var est = estadoPrazo(c);
      sinais.push('<span class="sinal prazo ' + est + '" title="Prazo: ' + esc(dataCurta(c.prazo)) + (est === 'vencido' ? ' (vencido)' : '') + '">' + I.calendario + esc(rotuloPrazo(c)) + '</span>');
    }
    if (c.prioridade === 'Alta' || c.prioridade === 'Urgente') {
      sinais.push('<span class="prio prio-' + norm(c.prioridade) + '">' + esc(c.prioridade) + '</span>');
    }
    if (c.descricao) sinais.push('<span class="sinal" title="Tem descrição">' + I.texto + '<span class="so-leitor">Tem descrição</span></span>');
    if (c.checklist && c.checklist.total) {
      var completo = c.checklist.feitos === c.checklist.total;
      sinais.push('<span class="sinal' + (completo ? ' check-ok' : '') + '" title="Checklist">' + I.check + c.checklist.feitos + '/' + c.checklist.total + '</span>');
    }
    if (c.comentarios) sinais.push('<span class="sinal" title="Comentários">' + I.comentario + c.comentarios + '</span>');
    if (c.carrossel) sinais.push('<span class="sinal carrossel" title="Carrossel: ' + esc(plural(c.carrossel.total, 'pessoa', 'pessoas')) + '. Na vez: ' + esc(c.carrossel.vez) + '">' + I.carrossel + '<span>Vez: <b>' + esc(primeiroNome(c.carrossel.vez)) + '</b> · ' + c.carrossel.total + '</span></span>');
    if (c.rotina) sinais.push('<span class="sinal" title="Criado por uma rotina">' + I.rotina + '<span class="so-leitor">Cartão de rotina</span></span>');
    var pessoas = c.responsaveis.length ? '<span class="avatares">' + c.responsaveis.slice(0, 4).map(function (n) { return avatar(n, true); }).join('') + '</span>' : '';
    return '<article class="cartao' + (c.concluido ? ' concluido' : '') + (c.pendente ? ' pendente' : '') + '" data-id="' + esc(c.id) + '" data-acao="abrir-cartao" tabindex="0">' +
      (etqs.length ? '<div class="cartao-etiquetas">' + etqs.map(function (e) { return etiquetaHtml(e); }).join('') + '</div>' : '') +
      '<h3 class="cartao-titulo">' + (c.concluido ? I.ok : '') + '<span>' + esc(c.titulo) + '</span></h3>' +
      (sinais.length || pessoas ? '<div class="cartao-rodape"><div class="sinais">' + sinais.join('') + '</div>' + pessoas + '</div>' : '') +
      '</article>';
  }

  function htmlLista(l, i) {
    if (l.tipo === 'Rotativa' || l.tipo === 'Recorrente') return htmlListaRodizio(l, i);
    var Q = S.quadro;
    var todos = cartoesDaLista(l.id);
    var visiveis = todos.filter(passaFiltro);
    var excedeu = l.limite && todos.length > l.limite;
    var nome = S.editandoLista === l.id
      ? '<input class="lista-nome-input" id="lista-nome-' + esc(l.id) + '" data-lista-nome="' + esc(l.id) + '" value="' + esc(l.nome) + '" maxlength="80" aria-label="Nome da lista">'
      : (Q.podeEditar
        ? '<h2 class="lista-nome editavel-nome" role="button" tabindex="0" data-acao="renomear-lista" data-id="' + esc(l.id) + '" title="Clique para renomear, arraste para mover">' + esc(l.nome) + '</h2>'
        : '<h2 class="lista-nome">' + esc(l.nome) + '</h2>');
    var conta = '<span class="lista-conta' + (excedeu ? ' excedeu' : '') + '" title="' + (l.limite ? 'Limite de ' + l.limite + ' cartões' : 'Cartões na lista') + '">' +
      (filtrosAtivos() ? visiveis.length + ' de ' : '') + todos.length + (l.limite ? ' / ' + l.limite : '') + '</span>';
    var pe = '';
    if (Q.podeEditar) {
      if (S.novoEm === l.id) {
        pe = '<form class="form-novo" data-form="novo-cartao" data-lista="' + esc(l.id) + '">' +
          '<textarea id="novo-cartao-texto" placeholder="O que precisa ser feito?" maxlength="500" aria-label="Título do novo cartão">' + esc(S.rascunhoNovo) + '</textarea>' +
          '<div class="linha"><button type="submit" class="btn primario pequeno">Adicionar cartão</button>' +
          '<button type="button" class="icone-btn" data-acao="cancelar-novo" aria-label="Cancelar">' + I.fechar + '</button></div></form>';
      } else {
        pe = '<button type="button" class="lista-adicionar" data-acao="novo-cartao" data-id="' + esc(l.id) + '">' + I.mais + 'Adicionar cartão</button>';
      }
    }
    var vaziaDica = (!visiveis.length && !Q.podeEditar) ? '<p class="lista-vazia-dica">Nenhum cartão</p>' :
      (!visiveis.length && filtrosAtivos() && todos.length ? '<p class="lista-vazia-dica">Nenhum cartão com esses filtros</p>' : '');
    return '<section class="lista" data-id="' + esc(l.id) + '" style="--espectro:' + corEspectro(i) + '" aria-label="Lista ' + esc(l.nome) + '">' +
      '<header class="lista-cabeca">' + nome + conta +
      (Q.podeEditar ? '<button type="button" class="icone-btn" data-acao="menu-lista" data-id="' + esc(l.id) + '" aria-label="Opções da lista ' + esc(l.nome) + '">' + I.pontos + '</button>' : '') +
      '</header>' + htmlVezDaLista(l) + vaziaDica +
      '<div class="lista-cartoes" data-lista="' + esc(l.id) + '">' + visiveis.map(htmlCartao).join('') + '</div>' +
      (pe ? '<div class="lista-pe">' + pe + '</div>' : '') +
      '</section>';
  }

  function renderListas() {
    var cont = $('#listas');
    if (!cont || !S.quadro) return;
    var Q = S.quadro;
    var scrollX = cont.scrollLeft;
    var scrollY = {};
    $$('.lista-cartoes', cont).forEach(function (el) { scrollY[el.getAttribute('data-lista')] = el.scrollTop; });
    var focoId = document.activeElement && document.activeElement.id;

    var html = Q.listas.map(htmlLista).join('');
    if (Q.podeEditar) {
      html += '<div class="lista-nova">' + (S.criandoLista
        ? '<form class="form-novo" data-form="nova-lista"><input type="text" id="nova-lista-nome" placeholder="Nome da lista" maxlength="80" aria-label="Nome da nova lista">' +
          '<select id="nova-lista-tipo" aria-label="Tipo da lista"><option value="Normal">Lista normal (cartões)</option><option value="Rotativa">Rotatividade semanal</option><option value="Recorrente">Recorrente (fila com Atendi)</option></select>' +
          '<div class="linha"><button type="submit" class="btn primario pequeno">Criar lista</button><button type="button" class="icone-btn" data-acao="cancelar-lista" aria-label="Cancelar">' + I.fechar + '</button></div></form>'
        : '<button type="button" class="lista-adicionar" data-acao="nova-lista">' + I.mais + 'Adicionar lista</button>') + '</div>';
    }
    if (!Q.listas.length && !Q.podeEditar) html = '<p class="texto-suave">Este quadro ainda não tem listas.</p>';
    cont.innerHTML = html;
    cont.scrollLeft = scrollX;
    $$('.lista-cartoes', cont).forEach(function (el) { var y = scrollY[el.getAttribute('data-lista')]; if (y) el.scrollTop = y; });

    var resumo = $('#filtro-resumo');
    if (resumo) {
      var vis = Q.cartoes.filter(passaFiltro).length;
      resumo.innerHTML = filtrosAtivos()
        ? esc(vis + ' de ' + plural(Q.cartoes.length, 'cartão', 'cartões')) + ' <button type="button" class="btn sutil pequeno" data-acao="limpar-filtros">Limpar filtros</button>'
        : '';
    }
    var nov = $('#novidades');
    if (nov) nov.innerHTML = S.desatualizado && !pendentes ? '<span class="novidades">Alguém mexeu no quadro <button type="button" class="btn sutil pequeno" data-acao="atualizar">Atualizar</button></span>' : '';

    if (focoId) {
      var el = document.getElementById(focoId);
      if (el && el !== document.activeElement) {
        el.focus();
        if (el.tagName === 'TEXTAREA' || el.tagName === 'INPUT') { try { var n = el.value.length; el.setSelectionRange(n, n); } catch (err) { /* ok */ } }
      }
    }
    if (S.novoEm && !focoId) { var ta = $('#novo-cartao-texto'); if (ta) ta.focus(); }
  }

  /* ---------- Ações do quadro ---------- */
  function listaNormal(l) { return !l.tipo || l.tipo === 'Normal'; }

  function maiorOrdem(listaId) {
    return cartoesDaLista(listaId).reduce(function (m, c) { return Math.max(m, c.ordem); }, 0);
  }

  function criarCartaoRapido(listaId, titulo) {
    titulo = String(titulo || '').trim();
    if (!titulo) return;
    var tmp = {
      id: 'tmp-' + Date.now() + '-' + Math.floor(Math.random() * 1e6), listaId: listaId, titulo: titulo, descricao: '', responsaveis: [], prazo: '',
      prioridade: '', etiquetas: [], ordem: maiorOrdem(listaId) + 1000, concluido: false, comentarios: 0, checklist: { feitos: 0, total: 0 }, extras: {}, pendente: true
    };
    S.quadro.cartoes.push(tmp);
    S.rascunhoNovo = '';
    renderListas();
    var cont = $('.lista-cartoes[data-lista="' + listaId + '"]');
    if (cont) cont.scrollTop = cont.scrollHeight;
    avisarLimite(listaId);
    escrever('criarCartao', listaId, titulo).then(function (r) {
      var antigo = tmp.id;
      Object.keys(r.cartao).forEach(function (k) { tmp[k] = r.cartao[k]; });
      tmp.pendente = false;
      if (r.escala && S.quadro) {
        S.quadro.escala = r.escala;
        renderListas();
        aviso('Cartão distribuído para ' + r.distribuidoPara + ', que estava na vez.');
      } else {
        var el = $('.cartao[data-id="' + antigo + '"]');
        if (el) { el.outerHTML = htmlCartao(tmp); }
      }
    }).catch(function (e) {
      S.quadro.cartoes = S.quadro.cartoes.filter(function (c) { return c !== tmp; });
      renderListas();
      falhou(e);
    });
  }

  function avisarLimite(listaId) {
    var l = lista(listaId);
    if (!l || !l.limite) return;
    var n = cartoesDaLista(listaId).length;
    if (n > l.limite) aviso(l.nome + ' passou do limite de ' + l.limite + ' cartões (' + n + ' agora).');
  }

  function criarListaNova(nome, tipo) {
    nome = String(nome || '').trim();
    if (!nome) return;
    escrever('criarLista', S.quadro.quadro.id, nome, tipo || 'Normal').then(function (r) {
      S.quadro.listas.push(r.lista);
      if (r.lista.tipo === 'Rotativa') (S.quadro.rotativas = S.quadro.rotativas || {})[r.lista.id] = [];
      if (r.lista.tipo === 'Recorrente') (S.quadro.recorrentes = S.quadro.recorrentes || {})[r.lista.id] = [];
      renderListas();
      var cont = $('#listas');
      if (cont) cont.scrollLeft = cont.scrollWidth;
      var inp = $('#nova-lista-nome');
      if (inp) inp.focus();
    }).catch(falhou);
  }

  function salvarNomeLista(id, nome) {
    var l = lista(id);
    S.editandoLista = null;
    nome = String(nome || '').trim();
    if (!l || !nome || nome === l.nome) { renderListas(); return; }
    var antigo = l.nome;
    l.nome = nome;
    renderListas();
    escrever('atualizarLista', id, { nome: nome }).catch(function (e) { l.nome = antigo; falhou(e); });
  }

  function menuLista(botao, id) {
    var l = lista(id);
    if (!l) return;
    if (l.tipo === 'Rotativa' || l.tipo === 'Recorrente') {
      abrirMenu(botao, [
        { rotulo: 'Renomear lista', fn: function () { S.editandoLista = id; renderListas(); var inp = $('#lista-nome-' + id); if (inp) { inp.focus(); inp.select(); } } },
        { rotulo: 'Arquivar lista', perigo: true, fn: function () { arquivarLista(id); } }
      ]);
      return;
    }
    abrirMenu(botao, [
      { rotulo: 'Renomear lista', fn: function () { S.editandoLista = id; renderListas(); var inp = $('#lista-nome-' + id); if (inp) { inp.focus(); inp.select(); } } },
      { rotulo: l.limite ? 'Mudar limite de cartões (' + l.limite + ')' : 'Definir limite de cartões', fn: function () {
        pedirTexto({ titulo: 'Limite de cartões', texto: 'A contagem da lista fica vermelha quando passar desse número. Deixe vazio para não ter limite.', rotulo: 'Máximo de cartões em ' + l.nome, tipo: 'number', valor: l.limite || '', confirmar: 'Salvar limite' })
          .then(function (v) {
            if (v === null) return;
            var n = parseInt(v, 10);
            var antes = l.limite;
            l.limite = n > 0 ? n : 0;
            renderListas();
            escrever('atualizarLista', id, { limite: l.limite || '' }).catch(function (e) { l.limite = antes; falhou(e); });
          });
      } },
      { rotulo: 'Adicionar cartão', fn: function () { S.novoEm = id; S.rascunhoNovo = ''; renderListas(); } },
      { rotulo: 'Arquivar lista', perigo: true, fn: function () { arquivarLista(id); } }
    ]);
  }

  function arquivarLista(id) {
    var l = lista(id);
    var idx = S.quadro.listas.indexOf(l);
    S.quadro.listas.splice(idx, 1);
    renderListas();
    escrever('arquivarLista', id, true).then(function () {
      aviso('Lista "' + l.nome + '" arquivada.', { acao: { rotulo: 'Desfazer', fn: function () {
        escrever('arquivarLista', id, false).then(function () { return recarregarQuadro(true); }).catch(falhou);
      } } });
    }).catch(falhou);
  }

  /* ------------------------------------------------------------------
     Gaveta do cartão
     ------------------------------------------------------------------ */
  function abrirCartao(id) {
    var c = cartao(id);
    if (!c || c.pendente) return;
    S.cartaoAberto = id;
    S.detalhe = null;
    S.rascunho = { comentario: '', item: '' };
    S.editandoItem = null;
    S.carrosselAberto = false;
    renderGaveta();
    carregarDetalhe(id);
  }

  function carregarDetalhe(id) {
    api('obterDetalheCartao', id).then(function (d) {
      if (S.cartaoAberto !== id) return;
      S.detalhe = d;
      renderSecaoCarrossel();
      renderSecaoComentarios();
      renderSecaoAtividade();
    }).catch(function (e) {
      if (S.cartaoAberto !== id) return;
      S.detalhe = { comentarios: [], atividade: [], erro: msgErro(e) };
      renderSecaoCarrossel();
      renderSecaoComentarios();
    });
  }

  function fecharGaveta() {
    if (!S.cartaoAberto) return;
    var tit = $('#g-titulo');
    var desc = $('#g-descricao');
    if (tit) salvarTitulo(tit.value);
    if (desc) salvarDescricao(desc.value);
    $$('[data-extra]').forEach(function (inp) { salvarExtra(inp.getAttribute('data-extra'), inp.value); });
    var id = S.cartaoAberto;
    S.cartaoAberto = null;
    S.detalhe = null;
    $('#gaveta-raiz').innerHTML = '';
    var el = $('.cartao[data-id="' + id + '"]');
    if (el) { try { el.focus({ preventScroll: true }); } catch (err) { /* ok */ } }
    if (S.desatualizado && !pendentes) verificar();
  }

  function renderGaveta() {
    var c = cartao(S.cartaoAberto);
    if (!c) { fecharGaveta(); return; }
    var Q = S.quadro;
    var ed = Q.podeEditar;
    var idx = indiceLista(c.listaId);
    var html =
      '<div class="gaveta-fundo" data-acao="fechar-gaveta"></div>' +
      '<aside class="gaveta" role="dialog" aria-modal="true" aria-labelledby="g-titulo" style="--espectro:' + corEspectro(idx) + '">' +
      '<header class="gaveta-topo"><div class="gaveta-linha1">' +
      '<label class="gaveta-onde">na lista <select id="g-lista"' + (ed ? '' : ' disabled') + '>' +
      Q.listas.filter(listaNormal).map(function (l) { return '<option value="' + esc(l.id) + '"' + (l.id === c.listaId ? ' selected' : '') + '>' + esc(l.nome) + '</option>'; }).join('') +
      '</select></label><span class="id-chip">' + esc(c.id) + '</span>' +
      '<button type="button" class="icone-btn" data-acao="fechar-gaveta" aria-label="Fechar cartão">' + I.fechar + '</button></div>' +
      '<textarea id="g-titulo" class="gaveta-titulo" rows="1" maxlength="500" aria-label="Título do cartão"' + (ed ? '' : ' readonly') + '>' + esc(c.titulo) + '</textarea>' +
      '</header>' +
      '<div class="gaveta-corpo">' +
      '<section id="g-props"></section>' +
      '<section><h3>Descrição</h3>' +
      (ed ? '<textarea id="g-descricao" class="descricao-area" placeholder="Detalhes, combinados, links, números de protocolo…" maxlength="20000">' + esc(c.descricao) + '</textarea><div class="salvo-dica" id="g-desc-dica"></div>'
        : '<p class="texto-suave" style="white-space:pre-wrap">' + (c.descricao ? esc(c.descricao) : 'Sem descrição.') + '</p>') +
      '</section>' +
      '<section id="g-checklist"></section>' +
      '<section id="g-carrossel"></section>' +
      (Q.camposExtras && Q.camposExtras.length ? '<section id="g-extras"></section>' : '') +
      '<section id="g-comentarios"></section>' +
      '<section id="g-atividade"></section>' +
      '</div>' +
      '<footer class="gaveta-pe" id="g-pe"></footer>' +
      '</aside>';
    $('#gaveta-raiz').innerHTML = html;
    ajustarAlturaTitulo();
    renderSecaoProps();
    renderSecaoChecklist();
    renderSecaoCarrossel();
    renderSecaoExtras();
    renderSecaoComentarios();
    renderSecaoAtividade();
    renderPeGaveta();
    var fechar = $('.gaveta .gaveta-linha1 .icone-btn');
    if (fechar) fechar.focus();
  }

  function ajustarAlturaTitulo() {
    var t = $('#g-titulo');
    if (!t) return;
    t.style.height = 'auto';
    t.style.height = t.scrollHeight + 'px';
  }

  /** Chamado quando o quadro recarrega com a gaveta aberta: atualiza sem atropelar o que está sendo digitado. */
  function atualizarGavetaPorFora() {
    var c = cartao(S.cartaoAberto);
    if (!c) return;
    var ativo = document.activeElement;
    var t = $('#g-titulo');
    if (t && ativo !== t) { t.value = c.titulo; ajustarAlturaTitulo(); }
    var d = $('#g-descricao');
    if (d && ativo !== d && d.getAttribute('data-sujo') !== '1') d.value = c.descricao;
    var gl = $('#g-lista');
    if (gl) gl.value = c.listaId;
    var g = $('.gaveta');
    if (g) g.style.setProperty('--espectro', corEspectro(indiceLista(c.listaId)));
    renderSecaoProps();
    if (!S.editandoItem) renderSecaoChecklist();
    renderPeGaveta();
    carregarDetalhe(c.id);
  }

  function renderSecaoProps() {
    var el = $('#g-props');
    var c = cartao(S.cartaoAberto);
    if (!el || !c) return;
    var Q = S.quadro;
    var ed = Q.podeEditar;
    var disponiveis = S.usuarios.filter(function (u) { return !c.responsaveis.some(function (n) { return norm(n) === norm(u.nome); }); });
    var pessoas = c.responsaveis.map(function (n) {
      return '<span class="pessoa">' + avatar(n, true) + esc(n) +
        (ed ? '<button type="button" data-acao="remover-resp" data-nome="' + esc(n) + '" aria-label="Tirar ' + esc(n) + '">' + I.fechar + '</button>' : '') + '</span>';
    }).join('');
    var est = estadoPrazo(c);
    var estTxt = { vencido: 'Vencido', hoje: 'Vence hoje', breve: 'Vence em breve', feito: 'Concluído no prazo' }[est] || '';
    if (est === 'feito' && c.concluidoEm && c.prazo && c.concluidoEm.slice(0, 10) > c.prazo) estTxt = 'Concluído com atraso';
    var prios = [''].concat(S.prioridades);
    var html = '<dl class="props">' +
      '<dt>Responsáveis</dt><dd>' + (pessoas || (ed ? '' : '<span class="texto-suave">Ninguém</span>')) +
      (ed ? '<label><span class="so-leitor">Adicionar responsável</span><select id="g-add-resp"><option value="">' + (c.responsaveis.length ? 'Adicionar…' : 'Escolher responsável') + '</option>' +
        disponiveis.map(function (u) { return '<option value="' + esc(u.nome) + '">' + esc(u.nome) + '</option>'; }).join('') + '</select></label>' : '') + '</dd>' +
      '<dt><label for="g-prazo">Prazo</label></dt><dd>' +

  function renderPeGaveta() {

    if (c.atualizadoEm && c.atualizadoEm !== c.criadoEm) meta.push('Última alteração' + (c.atualizadoPor ? ' de ' + esc(c.atualizadoPor) : '') + ', ' + esc(dataHora(c.atualizadoEm)));
