    'carrossel-iniciar': function () { S.carrosselAberto = true; renderSecaoCarrossel(); var i = $('#car-pessoa'); if (i) i.focus(); },
    'carrossel-atendi': function (el) { carrosselAtendi(el.getAttribute('data-id')); },
    'carrossel-na-vez': function (el) { carrosselNaVez(el.getAttribute('data-id')); },
    'carrossel-editar': function (el) { carrosselEditar(el.getAttribute('data-id')); },
    'carrossel-remover': function (el) { carrosselRemover(el.getAttribute('data-id')); },
    'carrossel-equipe': function () { carrosselEquipe(); },
    'remover-resp': function (el) {
      var c = cartao(S.cartaoAberto);
      var nome = el.getAttribute('data-nome');
      salvarCartao(c.id, { responsaveis: c.responsaveis.filter(function (n) { return n !== nome; }) }, { props: true });
    },
    'limpar-prazo': function () { salvarCartao(S.cartaoAberto, { prazo: '' }, { props: true }); },
    'prioridade': function (el) {
      var c = cartao(S.cartaoAberto);
      var v = el.getAttribute('data-valor');
      if (c.prioridade === v) return;
      salvarCartao(c.id, { prioridade: v }, { props: true });
    },
    'alternar-etiqueta': function (el) {
      var c = cartao(S.cartaoAberto);
      var id = el.getAttribute('data-id');
      var nova = c.etiquetas.indexOf(id) === -1 ? c.etiquetas.concat([id]) : c.etiquetas.filter(function (x) { return x !== id; });
      salvarCartao(c.id, { etiquetas: nova }, { props: true });
    },
    'editar-item': function (el) { S.editandoItem = el.getAttribute('data-id'); renderSecaoChecklist(); var i = $('#item-edicao'); if (i) { i.focus(); i.select(); } },
    'remover-item': function (el) { removerItem(el.getAttribute('data-id')); },
    'remover-comentario': function (el) { removerComentario(el.getAttribute('data-id')); },
    'ir-meus': function () { abrirMeus(); },
    'abrir-meu': function (el) { abrirQuadro(el.getAttribute('data-quadro'), el.getAttribute('data-id')); },
    'mover-quadro': function () { modalMoverQuadro(); },
    'atalhos': function () { modalAtalhos(); },
    'escala': function () { abrirModalEscala(); },
    'ir-rotinas': function () { abrirRotinas(); },
    'nova-rotina': function () { modalRotina(null); },
    'editar-rotina': function (el) { modalRotina(el.getAttribute('data-id')); },
    'gerar-rotina': function (el) { gerarRotinaHoje(el.getAttribute('data-id')); },
    'alternar-rotina': function (el) { alternarRotinaTela(el.getAttribute('data-id'), el.getAttribute('data-ativa') === '1'); },
    'ativar-gatilho': function () { mudarGatilho(true); },
    'desativar-gatilho': function () { mudarGatilho(false); },
    'ir-equipe': function (el) { abrirEquipe(el.getAttribute('data-aba') || 'semana'); },
    'eq-aba': function (el) {
      var E = S.equipe;
      if (!E) return;
      E.aba = el.getAttribute('data-valor');
      renderEquipeCorpo();
      if (E.aba === 'semana') carregarEquipeSemana(E.semana);
      else if (E.aba === 'banco') carregarBanco(E.alvo);
      else if (E.aba === 'ausencias') carregarAusenciasEquipe();
    },
    'eq-semana': function (el) { irParaSemana(el.getAttribute('data-valor')); },
    'eq-celula': function (el) { alternarCelula(el); },
    'eq-copiar': function () { copiarSemanaAnterior(); },
    'eq-lancar': function () { modalHoras(); },
    'eq-extrato': function (el) { carregarBanco(el.getAttribute('data-email')); },
    'eq-aprovar': function (el) { decidirPedido(el.getAttribute('data-id'), true, ''); },
    'eq-recusar': function (el) {
      var id = el.getAttribute('data-id');
      pedirTexto({ titulo: 'Recusar o pedido', texto: 'A pessoa vai ver o motivo no extrato dela.', rotulo: 'Motivo da recusa', confirmar: 'Recusar' }).then(function (v) {
        if (v === null) return;
        if (!String(v).trim()) { aviso('Explique em uma frase o motivo da recusa.', { erro: true }); return; }
        decidirPedido(id, false, v);
      });
    },
    'eq-cancelar': function (el) { cancelarLancamento(el.getAttribute('data-id'), el.getAttribute('data-status')); },
    'eq-aus-remover': function (el) { removerAusenciaEquipe(el.getAttribute('data-id')); }
  };

  var alvoApertado = null;
  document.addEventListener('pointerdown', function (ev) { alvoApertado = ev.target; }, true);

  document.addEventListener('click', function (ev) {
    if (Date.now() < ignorarCliqueAte && ev.target.closest('#listas')) { ev.preventDefault(); ev.stopPropagation(); return; }
    if (menuAberto && !menuAberto.el.contains(ev.target) && !menuAberto.ancora.contains(ev.target)) fecharMenu();
    if (modalAtual && ev.target.hasAttribute && ev.target.hasAttribute('data-modal-fundo')) { if (alvoApertado === ev.target) fecharModal(); return; }
    var el = ev.target.closest('[data-acao]');
    if (el && el.classList.contains('gaveta-fundo') && alvoApertado !== el) return;
    if (!el) {
      if (S.novoEm && !ev.target.closest('.form-novo') && !S.rascunhoNovo.trim()) { S.novoEm = null; renderListas(); }
      if (S.criandoLista && !ev.target.closest('.lista-nova')) { var inp = $('#nova-lista-nome'); if (!inp || !inp.value.trim()) { S.criandoLista = false; renderListas(); } }
      return;
    }
    var fn = ACOES[el.getAttribute('data-acao')];
    if (fn) { ev.preventDefault(); fn(el, ev); }
  });

  document.addEventListener('submit', function (ev) {
    var f = ev.target;
    var novo = f.getAttribute && f.getAttribute('data-nf');
    if (novo) { ev.preventDefault(); aoEnviarNovo(f, novo); return; }
    var tipo = f.getAttribute('data-form');
    if (!tipo || tipo === 'quadro' || tipo === 'pedir') return;
    ev.preventDefault();
    if (tipo === 'novo-cartao') { var ta = $('#novo-cartao-texto'); criarCartaoRapido(f.getAttribute('data-lista'), ta.value); }
    if (tipo === 'nova-lista') { var inp = $('#nova-lista-nome'); var tp = $('#nova-lista-tipo'); criarListaNova(inp.value, tp ? tp.value : 'Normal'); }
    if (tipo === 'rec-novo') { var lid = f.getAttribute('data-lista'); recAdicionar(lid, ($('#rec-pessoa-' + lid) || {}).value, ($('#rec-texto-' + lid) || {}).value); }
    if (tipo === 'novo-item') { adicionarItem($('#g-item-novo').value); }
    if (tipo === 'carrossel-novo') { carrosselAdicionar($('#car-pessoa').value, $('#car-texto').value); }
    if (tipo === 'comentar') { comentar($('#g-comentario').value); }
    if (tipo === 'nova-pessoa') {
      var dados = { email: $('#np-email').value.trim(), nome: $('#np-nome').value.trim(), perfil: $('#np-perfil').value, ativo: true };
      api('salvarUsuario', dados).then(function (r) { S.admin.usuarios = r.usuarios; S.usuarios = r.ativos; renderAdminCorpo(); aviso('Pessoa adicionada.'); })
        .catch(function (e) { aviso(msgErro(e), { erro: true }); });
    }
    if (tipo === 'config') {
      var pares = {};
      $$('[data-cfg]', f).forEach(function (i) { pares[i.getAttribute('data-cfg')] = i.value; });
      var b = f.querySelector('button[type="submit"]');
      b.disabled = true;
      api('salvarConfig', pares).then(function (r) {
        S.config = r.config;
        b.disabled = false;
        var topo = $('.topo');
        if (topo) topo.outerHTML = htmlTopo();
        document.title = S.config.nomeSistema;
        iniciarVerificacao();
        aviso('Configurações salvas.');
      }).catch(function (e) { b.disabled = false; aviso(msgErro(e), { erro: true }); });
    }
  });

  document.addEventListener('input', function (ev) {
    var t = ev.target;
    if (t.id === 'filtro-texto') { S.filtros.texto = t.value; renderListas(); return; }
    if (t.id === 'novo-cartao-texto') { S.rascunhoNovo = t.value; return; }
    if (t.hasAttribute && t.hasAttribute('data-rec-rascunho')) { S.rascunhoRec[t.getAttribute('data-rec-rascunho')] = t.value; return; }
    if (t.id === 'g-titulo') { ajustarAlturaTitulo(); return; }
    if (t.id === 'g-descricao') { t.setAttribute('data-sujo', '1'); var d = $('#g-desc-dica'); if (d) d.textContent = 'Salva quando você sair do campo.'; return; }
    if (t.id === 'g-comentario') { S.rascunho.comentario = t.value; return; }
    if (t.id === 'g-item-novo') { S.rascunho.item = t.value; return; }
  });

  document.addEventListener('change', function (ev) {
    var t = ev.target;
    if (t.hasAttribute && t.hasAttribute('data-nf-mudou')) { aoMudarNovo(t.getAttribute('data-nf-mudou'), t); return; }
    if (t.hasAttribute && t.hasAttribute('data-rot-troca')) { trocarRotativa(t.getAttribute('data-rot-troca'), t.getAttribute('data-semana'), t.value); return; }
    if (t.id === 'filtro-responsavel') { S.filtros.responsavel = t.value; atualizarBotaoFiltros(); renderListas(); return; }
    if (t.id === 'filtro-etiqueta') { S.filtros.etiqueta = t.value; atualizarBotaoFiltros(); renderListas(); return; }
    if (t.id === 'filtro-prazo') { S.filtros.prazo = t.value; atualizarBotaoFiltros(); renderListas(); return; }
    if (t.id === 'filtro-meus') { S.filtros.meus = t.checked; atualizarBotaoFiltros(); renderListas(); return; }
    if (t.id === 'g-lista') { moverPelaGaveta(t.value); return; }
    if (t.id === 'g-add-resp') {
      var c = cartao(S.cartaoAberto);
      if (t.value && c) salvarCartao(c.id, { responsaveis: c.responsaveis.concat([t.value]) }, { props: true });
      return;
    }
    if (t.id === 'g-prazo') {
      var c2 = cartao(S.cartaoAberto);
      if (c2 && /^\d{4}-\d{2}-\d{2}$/.test(t.value) && t.value !== c2.prazo) salvarCartao(c2.id, { prazo: t.value }, { props: true });
      return;
    }
    if (t.id === 'g-concluido') { salvarCartao(S.cartaoAberto, { concluido: t.checked }, { props: true }); return; }
    if (t.hasAttribute('data-item')) { marcarItem(t.getAttribute('data-item'), t.checked); return; }
    if (t.hasAttribute('data-extra')) { salvarExtra(t.getAttribute('data-extra'), t.value); return; }
    if (t.hasAttribute('data-adm')) {
      if (t.getAttribute('data-adm') === 'nome') return;
      salvarPessoa(t.closest('tr'));
    }
  });

  document.addEventListener('focusout', function (ev) {
    var t = ev.target;
    if (t.id === 'g-titulo') { salvarTitulo(t.value); return; }
    if (t.id === 'g-descricao') { salvarDescricao(t.value); return; }
    if (t.hasAttribute && t.hasAttribute('data-lista-nome')) { if (S.editandoLista === t.getAttribute('data-lista-nome')) salvarNomeLista(t.getAttribute('data-lista-nome'), t.value); return; }
    if (t.hasAttribute && t.hasAttribute('data-item-edicao')) { if (S.editandoItem === t.getAttribute('data-item-edicao')) salvarTextoItem(t.getAttribute('data-item-edicao'), t.value); return; }
    if (t.hasAttribute && t.getAttribute('data-adm') === 'nome') {
      var tr = t.closest('tr');
      var u = S.admin && S.admin.usuarios.filter(function (x) { return x.email === tr.getAttribute('data-email'); })[0];
      if (u && u.nome !== t.value.trim() && t.value.trim()) salvarPessoa(tr);
    }
  });

  document.addEventListener('keydown', function (ev) {
    var t = ev.target;
    if (ev.key !== 'Escape' && atalho(ev)) { ev.preventDefault(); return; }
    if (ev.key === 'Escape') {
      if (ARR && ARR.ativo) { limparOuvintes(); terminarArrasto(ARR, true); return; }
      if (menuAberto) { var a = menuAberto.ancora; fecharMenu(); if (a) a.focus(); return; }
      if (modalAtual) { fecharModal(); return; }
      if (S.editandoLista) { S.editandoLista = null; renderListas(); return; }
      if (S.editandoItem) { S.editandoItem = null; renderSecaoChecklist(); return; }
      if (t.id === 'novo-cartao-texto') { S.novoEm = null; S.rascunhoNovo = ''; renderListas(); return; }
      if (t.id === 'nova-lista-nome') { S.criandoLista = false; renderListas(); return; }
      if (S.cartaoAberto) { fecharGaveta(); return; }
    }
    if ((ev.key === 'Enter' || ev.key === ' ') && t.getAttribute && t.getAttribute('role') === 'button' && t.hasAttribute('data-acao')) { ev.preventDefault(); t.click(); return; }
    if (ev.key === 'Enter') {
      if (t.id === 'novo-cartao-texto' && !ev.shiftKey) { ev.preventDefault(); criarCartaoRapido(S.novoEm, t.value); return; }
      if (t.id === 'g-titulo') { ev.preventDefault(); t.blur(); return; }
      if (t.hasAttribute('data-lista-nome') || t.hasAttribute('data-item-edicao')) { ev.preventDefault(); t.blur(); return; }
      if (t.id === 'g-comentario' && (ev.ctrlKey || ev.metaKey)) { ev.preventDefault(); comentar(t.value); return; }
      if (t.classList && t.classList.contains('cartao')) { ev.preventDefault(); abrirCartao(t.getAttribute('data-id')); return; }
    }
    if (ev.key === 'Tab' && S.cartaoAberto && !modalAtual) {
      var g = $('.gaveta');
      if (g) {
        var focaveis = $$('button:not([disabled]), input:not([disabled]), select:not([disabled]), textarea:not([disabled]), summary, [tabindex="0"]', g);
        if (focaveis.length) {
          var primeiro = focaveis[0];
          var ultimo = focaveis[focaveis.length - 1];
          if (ev.shiftKey && document.activeElement === primeiro) { ev.preventDefault(); ultimo.focus(); }
          else if (!ev.shiftKey && document.activeElement === ultimo) { ev.preventDefault(); primeiro.focus(); }
        }
      }
    }
  });

  /* ------------------------------------------------------------------
     Conferir mudanças de outras pessoas
     ------------------------------------------------------------------ */
  var timerVerificar = null;
  var verificando = false;
  function iniciarVerificacao() {
    clearInterval(timerVerificar);
    timerVerificar = setInterval(verificar, Math.max(10, S.config.atualizarSegundos || 30) * 1000);
  }
  function digitando() {
    var a = document.activeElement;
    if (!a) return false;
    if (a.tagName === 'TEXTAREA') return true;
    return a.tagName === 'INPUT' && ['checkbox', 'radio', 'search', 'button', 'submit'].indexOf(a.type) === -1;
  }
  function verificar() {
    if (S.view !== 'quadro' || !S.quadro || document.hidden) return;
    if (pendentes > 0 || S.arrastando || verificando || modalAtual) return;
    verificando = true;
    var id = S.quadro.quadro.id;
    api('obterVersao', id).then(function (v) {
      verificando = false;
      if (!S.quadro || S.quadro.quadro.id !== id) return;
      if (v === S.versao && !S.desatualizado) return;
      if (digitando() || S.novoEm || S.editandoLista) {
        S.desatualizado = true;
        var nov = $('#novidades');
        if (nov) nov.innerHTML = '<span class="novidades">Alguém mexeu no quadro <button type="button" class="btn sutil pequeno" data-acao="atualizar">Atualizar</button></span>';
        return;
      }
      recarregarQuadro(true);
    }).catch(function () { verificando = false; });
  }
  document.addEventListener('visibilitychange', function () { if (!document.hidden) verificar(); });

  /* ------------------------------------------------------------------ */
  iniciarApp();
})();
</script>
