  function aoClicarEscala(ev) {
    var b = ev.target.closest('[data-esc]');
    if (!b || b.tagName === 'SELECT') return;
    var M = S.escalaModal;
    var tipo = b.getAttribute('data-esc');
    if (tipo === 'aba') { M.aba = b.getAttribute('data-valor'); renderModalEscala(); if (M.aba === 'semana' && M.dados.ligada && !M.dados.frentes) carregarEscala(M.qual); return; }
    if (tipo === 'semana') { carregarEscala(b.getAttribute('data-valor')); return; }
    if (tipo === 'vez') { definirVezTela(b.getAttribute('data-frente'), b.getAttribute('data-pessoa')); return; }
    if (tipo === 'subir' || tipo === 'descer') { ajustarEscalaTela(b.getAttribute('data-pessoa'), { direcao: tipo === 'subir' ? -1 : 1 }); return; }
    if (tipo === 'remover-ausencia') {
      b.disabled = true;
      escrever('removerAusencia', b.getAttribute('data-id')).then(function (r) { M.ausencias = r.ausencias; renderModalEscala(); atualizarEscalaDoQuadro(); }).catch(function (err) { b.disabled = false; aviso(msgErro(err), { erro: true }); });
    }
  }

  function aoMudarEscala(ev) {
    var t = ev.target;
    if (t.getAttribute('data-esc') === 'frente') { ajustarEscalaTela(t.getAttribute('data-pessoa'), { frenteId: t.value }); return; }
    if (t.hasAttribute('data-cfg-frente')) {
      var v = $('[data-cfg-vagas="' + t.getAttribute('data-cfg-frente') + '"]');
      if (v) { v.disabled = !t.checked; if (!t.checked) v.value = ''; }
    }
  }

  function aoEnviarEscala(ev) {
    var f = ev.target;
    var tipo = f.getAttribute('data-esc-form');
    if (!tipo) return;
    ev.preventDefault();
    ev.stopPropagation();
    var M = S.escalaModal;
    var botao = f.querySelector('button[type="submit"]');
    if (tipo === 'ausencia') {
      var dados = { pessoa: $('#au-pessoa').value, inicio: $('#au-inicio').value, fim: $('#au-fim').value, motivo: $('#au-motivo').value };
      if (!dados.pessoa) { $('#au-pessoa').focus(); return; }
      botao.disabled = true;
      escrever('salvarAusencia', dados).then(function (r) { M.ausencias = r.ausencias; renderModalEscala(); atualizarEscalaDoQuadro(); aviso('Ausência cadastrada.'); })
        .catch(function (err) { botao.disabled = false; aviso(msgErro(err), { erro: true }); });
    }
    if (tipo === 'config') {
      var cfg = {
        ativa: $('#cfg-esc-ativa').checked,
        frentes: $$('[data-cfg-frente]', f).filter(function (c) { return c.checked; }).map(function (c) {
          var id = c.getAttribute('data-cfg-frente');
          return { id: id, vagas: ($('[data-cfg-vagas="' + id + '"]') || {}).value || '' };
        }),
        equipe: $$('[data-cfg-pessoa]', f).filter(function (c) { return c.checked; }).map(function (c) { return c.getAttribute('data-cfg-pessoa'); })
      };
      if (cfg.ativa && (!cfg.frentes.length || !cfg.equipe.length)) { aviso('Marque pelo menos uma frente e uma pessoa.', { erro: true }); return; }
      botao.disabled = true;
      escrever('salvarConfigEscala', S.quadro.quadro.id, cfg).then(function (r) {
        M.dados = r.escala;
        M.aba = 'semana';
        M.qual = 'atual';
        aviso(cfg.ativa ? 'Escala salva. A semana já foi montada.' : 'Escala desligada.');
        renderModalEscala();
        recarregarQuadro(true);
      }).catch(function (err) { botao.disabled = false; aviso(msgErro(err), { erro: true }); });
    }
  }

  function ajustarEscalaTela(pessoa, mudanca) {
    var M = S.escalaModal;
    var qual = M.qual;
    $$('#escala-corpo button, #escala-corpo select').forEach(function (x) { x.disabled = true; });
    escrever('ajustarEscala', S.quadro.quadro.id, qual, pessoa, mudanca).then(function (r) {
      if (S.escalaModal !== M) return;
      M.dados = r.escala;
      if (qual === 'atual' && S.quadro) { S.quadro.escala = r.escala; renderListas(); }
      renderModalEscala();
    }).catch(function (err) { aviso(msgErro(err), { erro: true }); renderModalEscala(); });
  }

  function definirVezTela(frenteId, pessoa) {
    var M = S.escalaModal;
    $$('#escala-corpo button, #escala-corpo select').forEach(function (x) { x.disabled = true; });
    escrever('definirVezEscala', S.quadro.quadro.id, frenteId, pessoa).then(function (r) {
      if (S.quadro) { S.quadro.escala = r.escala; renderListas(); }
      if (S.escalaModal === M) { M.dados = r.escala; renderModalEscala(); }
      aviso(pessoa + ' está na vez.');
    }).catch(function (err) { aviso(msgErro(err), { erro: true }); if (S.escalaModal === M) renderModalEscala(); });
  }

  function atualizarEscalaDoQuadro() {
    if (!S.quadro) return;
    api('obterEscala', S.quadro.quadro.id, 'atual').then(function (d) {
      if (!S.quadro) return;
      S.quadro.escala = d;
      renderListas();
      var M = S.escalaModal;
      if (M && M.qual === 'atual') { M.dados = d; if (M.aba === 'semana') renderModalEscala(); }
    }).catch(function () {});
  }

  /* ------------------------------------------------------------------
     Escalas do quadro: almoço e home
     ------------------------------------------------------------------ */
  function abrirModalDia(aba) {
    if (!S.quadro) return;
    var M = S.dia = { aba: aba || 'almoco', dados: null, carregando: true, erro: '' };
    abrirModal('<div class="modal-cabeca"><h2 id="modal-titulo">Almoço e home</h2>' +
      '<p>Escala da semana em ' + esc(S.quadro.quadro.nome) + '. Quem edita o quadro ajusta aqui.</p></div>' +
      '<div class="abas-modal" role="tablist" id="dia-abas"></div>' +
      '<div class="modal-corpo" id="dia-corpo"></div>' +
      '<div class="modal-rodape"><div class="direita"><button type="button" class="btn primario" data-acao="fechar-modal">Fechar</button></div></div>',
      { largo: true, extra: true, semFoco: true, aoFechar: function () { S.dia = null; } });
    var m = $('#modal-raiz .modal');
    m.addEventListener('click', aoClicarDia);
    m.addEventListener('change', aoMudarDia);
    m.addEventListener('submit', aoEnviarDia);
    renderModalDia();
    carregarDia('');
  }

  function carregarDia(semana) {
    var M = S.dia;
    if (!M) return;
    M.carregando = true;
    M.erro = '';
    renderModalDia();
    api('obterEscalaDiaria', S.quadro.quadro.id, semana).then(function (d) {
      if (S.dia !== M) return;
      M.dados = d;
      M.carregando = false;
      renderModalDia();
    }).catch(function (e) {
      if (S.dia !== M) return;
      M.carregando = false;
      M.erro = msgErro(e);
      renderModalDia();
    });
  }

  function renderModalDia() {
    var M = S.dia;
    var abas = $('#dia-abas');
    var corpo = $('#dia-corpo');
    if (!M || !abas || !corpo) return;
    var d = M.dados;
    var itens = [['almoco', 'Almoço'], ['home', 'Home']];
    if (d && d.podeAdministrar) itens.push(['config', 'Configurar']);
    abas.innerHTML = itens.map(function (a) {
      return '<button type="button" role="tab" aria-selected="' + (M.aba === a[0]) + '" data-dia="aba" data-valor="' + a[0] + '">' + a[1] + '</button>';
    }).join('');
    var ativo = document.activeElement && document.activeElement.getAttribute ? document.activeElement.getAttribute('data-foco') : null;
    if (M.erro) corpo.innerHTML = '<p class="texto-suave">' + esc(M.erro) + '</p>';
    else if (!d) corpo.innerHTML = htmlCarregando('Montando a escala');
    else corpo.innerHTML = M.aba === 'config' ? htmlDiaConfig() : htmlDiaSemana();
    if (ativo) { var f = $('[data-foco="' + ativo + '"]'); if (f) f.focus(); }
  }

  function htmlDiaSemana() {
    var M = S.dia;
    var d = M.dados;
    var almoco = M.aba === 'almoco';
    var ehEstaSemana = d.semana === semanaDe(d.hoje);
    var barra = '<div class="eq-barra"><div class="eq-barra-esq"><div class="segmentado" role="group" aria-label="Semana">' +
      '<button type="button" data-dia="semana" data-valor="ant" aria-label="Semana anterior">‹ Anterior</button>' +
      '<button type="button" data-dia="semana" data-valor="hoje" aria-pressed="' + ehEstaSemana + '">Esta semana</button>' +
      '<button type="button" data-dia="semana" data-valor="prox" aria-label="Próxima semana">Próxima ›</button></div>' +
      '<span class="texto-suave">Segunda ' + dataBr(d.semana) + ' a sexta ' + dataBr(d.semanaFim) + '</span></div>' +
      (d.podeEditar ? '<button type="button" class="btn pequeno" data-dia="copiar" title="Repete nesta semana o que foi marcado na semana anterior">Copiar semana anterior</button>' : '') + '</div>';

    var cab = '<th class="col-nome" scope="col">Pessoa</th>' + (almoco ? '' : '<th scope="col">Home na semana</th>') + d.dias.map(function (dia) {
      var feriado = d.feriados[dia];
      var c = d.contagem[dia];
      var baixo = !feriado && !almoco && d.minPresenciais && c.presenciais < d.minPresenciais;
      var comAlmoco = Object.keys(c.porTurno).reduce(function (t, k) { return t + c.porTurno[k]; }, 0);
      return '<th scope="col" class="dia' + (dia === d.hoje ? ' hoje' : '') + '"><span class="dia-nome">' + DIAS_CURTOS[diaDaSemana(dia)] + ' ' + dataBr(dia) + '</span>' +
        (feriado ? '<span class="dia-conta">Feriado</span>'
          : (almoco ? '<span class="dia-conta">' + comAlmoco + ' de ' + (c.total - c.fora) + ' com turno</span>'
            : '<span class="dia-conta' + (baixo ? ' baixo' : '') + '">' + plural(c.presenciais, 'presencial', 'presenciais') + (baixo ? ' (mín. ' + d.minPresenciais + ')' : '') + '</span>' +
              '<span class="dia-conta">' + c.home + ' home' + (c.fora ? ' · ' + c.fora + ' fora' : '') + '</span>')) + '</th>';
    }).join('');

    var linhas = d.pessoas.map(function (p) {
      var celulas = d.dias.map(function (dia) {
        if (d.feriados[dia]) return '<td><span class="cel feriado">Feriado</span></td>';
        if (p.fora[dia]) return '<td><span class="cel fora">' + esc(p.fora[dia]) + '</span></td>';
        if (almoco) {
          var atual = p.almoco[dia] || '';
          var lotado = atual && d.almocoMax && (d.contagem[dia].porTurno[atual] || 0) > d.almocoMax;
          if (!d.podeEditar) return '<td><span class="cel ' + (atual ? 'home' : 'pres') + '">' + (atual ? esc(atual) : '—') + '</span></td>';
          var opcoes = d.turnos.slice();
          if (atual && opcoes.indexOf(atual) === -1) opcoes.push(atual);
          return '<td><select class="sel-almoco' + (lotado ? ' lotado' : '') + '" data-dia="almoco" data-nome="' + esc(p.nome) + '" data-data="' + dia + '" data-foco="al-' + esc(p.email) + '-' + dia + '"' +
            (lotado ? ' title="Mais de ' + d.almocoMax + ' pessoas neste horário"' : '') + ' aria-label="Almoço de ' + esc(p.nome) + ', ' + dataComDia(dia) + '">' +
            '<option value="">—</option>' + opcoes.map(function (t) { return '<option value="' + esc(t) + '"' + (t === atual ? ' selected' : '') + '>' + esc(t) + '</option>'; }).join('') + '</select></td>';
        }
        var home = p.home.indexOf(dia) !== -1;
        var rotulo = home ? 'Home' : 'Presencial';
        if (!d.podeEditar) return '<td><span class="cel ' + (home ? 'home' : 'pres') + '">' + rotulo + '</span></td>';
        return '<td><button type="button" class="cel ' + (home ? 'home' : 'pres') + '" data-dia="home" data-email="' + esc(p.email) + '" data-data="' + dia + '" data-tipo="' + (home ? 'Presencial' : 'Home') + '" data-foco="hm-' + esc(p.email) + '-' + dia + '" ' +
          'aria-label="' + esc(p.nome) + ', ' + dataComDia(dia) + ': ' + rotulo + '. Clique para marcar ' + (home ? 'presencial' : 'home') + '">' + rotulo + '</button></td>';
      }).join('');
      var estado = p.home.length > p.cota ? 'passou' : (p.home.length < p.cota ? 'falta' : '');
      var colCota = almoco ? '' : '<td><div class="cota"><span class="cota-n ' + estado + '" title="' + (estado === 'passou' ? 'Acima da cota' : (estado === 'falta' ? 'Abaixo da cota' : 'Na cota')) + '">' + p.home.length + '/' + p.cota + '</span></div></td>';
      return '<tr><th scope="row" class="col-nome"><span class="pessoa-cel">' + avatar(p.nome, true) + '<span>' + esc(p.nome) + (p.eu ? ' <span class="chip">você</span>' : '') + '</span></span></th>' + colCota + celulas + '</tr>';
    }).join('');

    var tabela = d.pessoas.length
      ? '<div class="grade-eq-caixa"><div class="rolagem-x"><table class="grade-eq"><thead><tr>' + cab + '</tr></thead><tbody>' + linhas + '</tbody></table></div></div>'
      : '<div class="vazio"><h2>Ninguém na equipe deste quadro</h2><p>Cadastre pessoas na Administração' + (d.podeAdministrar ? ' ou escolha a equipe na aba Configurar' : '') + '.</p></div>';
    return barra + tabela + htmlDiaHoje(d, almoco) +
      '<p class="ajuda eq-nota">' + (almoco
        ? (d.podeEditar ? 'Escolha o turno de cada pessoa em cada dia. ' : '') + 'Turnos: ' + esc(d.turnos.join(', ')) + (d.almocoMax ? '. Em vermelho: mais de ' + d.almocoMax + ' pessoas no mesmo horário' : '') + '.'
        : (d.podeEditar ? 'Clique numa célula para alternar entre presencial e home. ' : '') + 'O dia de home é da pessoa e vale em todos os quadros. Quem não tem marca vem presencial.') + '</p>';
  }

  function htmlDiaHoje(d, almoco) {
    if (d.dias.indexOf(d.hoje) === -1 || d.feriados[d.hoje]) return '';
    var ls = d.pessoas.filter(function (p) { return !p.fora[d.hoje]; });
    var corpo;
    if (almoco) {
      var porTurno = {};
      ls.forEach(function (p) { if (p.almoco[d.hoje]) (porTurno[p.almoco[d.hoje]] = porTurno[p.almoco[d.hoje]] || []).push(p.nome); });
      var chaves = Object.keys(porTurno).sort();
      var semTurno = ls.filter(function (p) { return !p.almoco[d.hoje]; }).map(function (p) { return p.nome; });
      corpo = chaves.map(function (t) { return '<span><b>' + esc(t) + '</b> ' + esc(juntar(porTurno[t].map(primeiroNome))) + '</span>'; }).join('') +
        (semTurno.length && chaves.length ? '<span class="texto-suave">Sem turno: ' + esc(juntar(semTurno.map(primeiroNome))) + '</span>' : '') +
        (!chaves.length ? '<span class="texto-suave">Ninguém tem turno marcado hoje.</span>' : '');
    } else {
      var casa = ls.filter(function (p) { return p.home.indexOf(d.hoje) !== -1; }).map(function (p) { return primeiroNome(p.nome); });
      corpo = '<span><b>Home</b> ' + (casa.length ? esc(juntar(casa)) : 'ninguém') + '</span><span><b>Presenciais</b> ' + (ls.length - casa.length) + '</span>';
    }
    return '<div class="dia-hoje"><span class="dia-hoje-rotulo">Hoje, ' + dataComDia(d.hoje) + '</span>' + corpo + '</div>';
  }

  function htmlDiaConfig() {
    var d = S.dia.dados;
    var marcados = (d.equipeNomes || []).map(norm);
    return '<form data-dia-form="config"><div class="campo"><span class="rotulo">Quem entra nas escalas deste quadro</span>' +
      '<span class="ajuda">Sem ninguém marcado, entram todas as pessoas que veem o quadro.</span>' +
      '<div class="lista-marcar">' + (d.candidatos || []).map(function (n) {
        return '<label><input type="checkbox" data-dia-pessoa="' + esc(n) + '"' + (marcados.indexOf(norm(n)) !== -1 ? ' checked' : '') + '>' + avatar(n, true) + esc(n) + '</label>';
      }).join('') + '</div></div>' +
      '<div class="campo"><label for="dia-turnos">Turnos de almoço</label><input id="dia-turnos" type="text" value="' + esc(d.turnosTexto || '') + '" placeholder="11:30; 12:00; 12:30; 13:00" maxlength="120">' +
      '<span class="ajuda">Horários separados por ponto e vírgula. Em branco usa 11:30, 12:00, 12:30 e 13:00.</span></div>' +
      '<div class="campo"><label for="dia-max">Máximo de pessoas por turno</label><input id="dia-max" type="number" min="1" max="99" step="1" value="' + (d.almocoMax || '') + '" placeholder="Sem limite">' +
      '<span class="ajuda">Passou do máximo, o horário fica em vermelho na grade. Não impede de marcar.</span></div>' +
      '<div class="modal-rodape sem-borda"><div class="direita"><button type="submit" class="btn primario">Salvar</button></div></div></form>';
  }

  function recontarDia(d) {
    d.dias.forEach(function (dia) { var c = d.contagem[dia]; c.home = 0; c.presenciais = 0; c.porTurno = {}; });
    d.pessoas.forEach(function (p) {
      d.dias.forEach(function (dia) {
        if (d.feriados[dia] || p.fora[dia]) return;
        var c = d.contagem[dia];
        if (p.home.indexOf(dia) !== -1) c.home++; else c.presenciais++;
        var t = p.almoco[dia];
        if (t) c.porTurno[t] = (c.porTurno[t] || 0) + 1;
      });
    });
  }

  /* A resposta do servidor só substitui a tela quando não há mais gravações na fila (senão a grade "pula"). */
  function aplicarDia(M, r) {
    setTimeout(function () {
      if (S.dia !== M || pendentes || !M.dados || r.dados.semana !== M.dados.semana) return;
      M.dados = r.dados;
      renderModalDia();
    }, 0);
  }
  function falhouDia(M, e) {
    aviso(msgErro(e), { erro: true });
    if (S.dia === M) carregarDia(M.dados ? M.dados.semana : '');
  }

  function aoClicarDia(ev) {
    var b = ev.target.closest('[data-dia]');
    var M = S.dia;
    if (!b || !M || b.tagName === 'SELECT') return;
    var tipo = b.getAttribute('data-dia');
    var d = M.dados;
    if (tipo === 'aba') { M.aba = b.getAttribute('data-valor'); renderModalDia(); return; }
    if (!d) return;
    if (tipo === 'semana') {
      var v = b.getAttribute('data-valor');
      carregarDia(v === 'ant' ? somaDias(d.semana, -7) : (v === 'prox' ? somaDias(d.semana, 7) : ''));
      return;
    }
    if (tipo === 'copiar') {
      var origem = somaDias(d.semana, -7);
      var almoco = M.aba === 'almoco';
      confirmarAcao({
        titulo: 'Copiar a semana anterior?',
        texto: (almoco ? 'Os turnos de almoço de ' : 'Os dias de home de ') + periodoSemana(origem) + ' serão repetidos em ' + periodoSemana(d.semana) + '. O que já está marcado nesta semana (só da equipe deste quadro) será substituído. Férias, folgas e feriados são respeitados.',
        confirmar: 'Copiar'
      }).then(function (ok) {
        if (!ok || S.dia !== M) return;
        escrever('copiarSemanaQuadro', S.quadro.quadro.id, almoco ? 'almoco' : 'home', origem, d.semana).then(function (r) {
          if (S.dia !== M) return;
          M.dados = r.dados;
          renderModalDia();
          aviso(plural(r.copiados, 'marcação copiada', 'marcações copiadas') + (r.ignorados ? ' (' + plural(r.ignorados, 'ignorada', 'ignoradas') + ' por ausência, feriado ou turno que não existe mais).' : '.'));
        }).catch(function (e) { falhouDia(M, e); });
      });
      return;
    }
    if (tipo === 'home') {
      var email = b.getAttribute('data-email');
      var dia = b.getAttribute('data-data');
      var virarHome = b.getAttribute('data-tipo') === 'Home';
      var p = d.pessoas.filter(function (x) { return x.email === email; })[0];
      if (!p || (p.home.indexOf(dia) !== -1) === virarHome) return;
      if (virarHome) p.home.push(dia); else p.home = p.home.filter(function (x) { return x !== dia; });
      recontarDia(d);
      renderModalDia();
      escrever('definirHomeQuadro', S.quadro.quadro.id, email, dia, virarHome ? 'Home' : 'Presencial')
        .then(function (r) { aplicarDia(M, r); }).catch(function (e) { falhouDia(M, e); });
    }
  }

  function aoMudarDia(ev) {
    var t = ev.target;
    var M = S.dia;
    if (!M || !M.dados || t.getAttribute('data-dia') !== 'almoco') return;
    var d = M.dados;
    var nome = t.getAttribute('data-nome');
    var dia = t.getAttribute('data-data');
    var p = d.pessoas.filter(function (x) { return x.nome === nome; })[0];
    if (!p) return;
    if (t.value) p.almoco[dia] = t.value; else delete p.almoco[dia];
    recontarDia(d);
    renderModalDia();
    escrever('definirAlmoco', S.quadro.quadro.id, nome, dia, t.value)
      .then(function (r) { aplicarDia(M, r); }).catch(function (e) { falhouDia(M, e); });
  }

  function aoEnviarDia(ev) {
    var f = ev.target;
    var M = S.dia;
    if (!M || f.getAttribute('data-dia-form') !== 'config') return;
    ev.preventDefault();
    ev.stopPropagation();
    var botao = f.querySelector('button[type="submit"]');
    botao.disabled = true;
    var dados = {
      equipe: $$('[data-dia-pessoa]', f).filter(function (c) { return c.checked; }).map(function (c) { return c.getAttribute('data-dia-pessoa'); }),
      turnos: $('#dia-turnos').value,
      max: $('#dia-max').value
    };
    escrever('salvarConfigDiaria', S.quadro.quadro.id, dados).then(function (r) {
      if (S.dia !== M) return;
      M.dados = r.dados;
      M.aba = 'almoco';
      renderModalDia();
      aviso('Escalas do quadro salvas.');
    }).catch(function (e) { botao.disabled = false; aviso(msgErro(e), { erro: true }); });
  }

  /* ------------------------------------------------------------------
     Datas e horas (usadas por Rotinas e Equipe)
     ------------------------------------------------------------------ */
  var DIAS_CURTOS = ['dom', 'seg', 'ter', 'qua', 'qui', 'sex', 'sáb'];
  function diaDaSemana(iso) { var p = iso.split('-').map(Number); return new Date(p[0], p[1] - 1, p[2]).getDay(); }
  function dataComDia(iso) { return iso ? DIAS_CURTOS[diaDaSemana(iso)] + ' ' + dataBr(iso) : ''; }
  function juntar(lista) { return lista.length < 2 ? lista.join('') : lista.slice(0, -1).join(', ') + ' e ' + lista[lista.length - 1]; }
  function quandoData(iso, hoje) {
    if (!iso) return '';
    if (iso === hoje) return 'hoje';
    if (iso === somaDias(hoje, 1)) return 'amanhã';
    if (iso === somaDias(hoje, -1)) return 'ontem';
    return dataComDia(iso);
  }
  function fmtHoras(min, comSinal) {
    var m = Math.abs(Math.round(min || 0));
    var t = Math.floor(m / 60) + 'h' + pad(m % 60);
    if (!comSinal || !min) return t;
    return (min > 0 ? '+' : '−') + t;
  }
  function classeSaldo(min) { return min > 0 ? 'pos' : (min < 0 ? 'neg' : 'zero'); }

  /* Janela de confirmação simples (devolve uma promessa de verdadeiro/falso). */
  function confirmarAcao(op) {
    return new Promise(function (resolver) {
      var html = '<form data-form="pedir">' +
        '<div class="modal-cabeca"><h2 id="modal-titulo">' + esc(op.titulo) + '</h2>' + (op.texto ? '<p>' + esc(op.texto) + '</p>' : '') + '</div>' +
        '<div class="modal-rodape"><div class="direita"><button type="button" class="btn sutil" data-acao="fechar-modal">Cancelar</button>' +
        '<button type="submit" class="btn primario" autofocus>' + esc(op.confirmar || 'Confirmar') + '</button></div></div></form>';
      var respondido = false;
      var m = abrirModal(html, { aoFechar: function () { if (!respondido) resolver(false); } });
      m.querySelector('form').addEventListener('submit', function (ev) {
        ev.preventDefault();
        respondido = true;
        fecharModal();
        resolver(true);
      });
    });
  }

  /* ------------------------------------------------------------------
     Rotinas
     ------------------------------------------------------------------ */
  function abrirRotinas() {
    fecharGaveta();
    S.view = 'rotinas';
    S.quadro = null;
    S.versao = '';
    S.rotinas = null;
    render();
    api('listarRotinas').then(function (r) {
      if (S.view !== 'rotinas') return;
      S.rotinas = r;
      renderRotinasCorpo();
    }).catch(function (e) {
      if (S.view !== 'rotinas') return;
      var el = $('#rotinas-corpo');
      if (el) el.innerHTML = '<p class="texto-suave">' + esc(msgErro(e)) + '</p>';
    });
  }

  function htmlRotinas() {
    return '<section class="pagina"><header class="inicio-cabeca"><div><h1>Rotinas</h1>' +
      '<p class="sub">Tarefas que se repetem todo dia, toda semana ou todo mês. No dia certo o Flows cria o cartão sozinho, na lista que você escolher.</p></div>' +
      '<button type="button" class="btn primario" data-acao="nova-rotina">' + I.mais + 'Nova rotina</button></header>' +
      '<div id="rotinas-corpo">' + htmlCarregando('Buscando as rotinas') + '</div></section>';
  }

  function quandoRotina(r) {
    if (r.frequencia === 'Diária') return 'Todo dia';
    if (r.frequencia === 'Dias úteis') return 'Todo dia útil';
    if (r.frequencia === 'Semanal') return 'Toda semana: ' + juntar((r.diasSemana || []).map(function (n) { return DIAS_CURTOS[n % 7]; }));
    if (r.frequencia === 'Mensal') return /^\d+$/.test(r.diaMes) ? 'Todo mês, dia ' + r.diaMes : 'Todo mês, ' + String(r.diaMes).toLowerCase();
    return r.frequencia || 'Sem frequência';
  }

  function htmlGatilho(R) {
    var g = R.gatilho || {};
    var ultima = g.ultimaExecucao ? 'Última rodada: ' + dataHora(g.ultimaExecucao) + (g.ultimoTotal ? ', ' + plural(g.ultimoTotal, 'cartão criado', 'cartões criados') : ', nenhum cartão novo') + '.' : 'Ainda não rodou.';
    if (g.instalado) {
      return '<div class="gatilho on"><span class="gatilho-ponto" aria-hidden="true"></span><div class="gatilho-txt"><b>Criação automática ligada</b>' +
        '<small>Todo dia por volta das ' + g.hora + 'h, mesmo que ninguém abra o sistema. ' + esc(ultima) + '</small></div>' +
        (R.podeGerirGatilho ? '<button type="button" class="btn pequeno" data-acao="desativar-gatilho">Desligar</button>' : '') + '</div>';
    }
    return '<div class="gatilho off"><span class="gatilho-ponto" aria-hidden="true"></span><div class="gatilho-txt"><b>Criação automática desligada</b>' +
      '<small>Sem ela, os cartões do dia nascem quando a primeira pessoa abre o Flows. ' + (R.podeGerirGatilho ? 'Ligue para criar às ' + g.hora + 'h todo dia, mesmo sem ninguém abrir. ' : 'Peça a um ADM para ligar. ') + esc(ultima) + '</small></div>' +
      (R.podeGerirGatilho ? '<button type="button" class="btn primario pequeno" data-acao="ativar-gatilho">Ligar criação diária</button>' : '') + '</div>';
  }

  function htmlRotina(r, hoje) {
    var resp = r.responsavelModo === 'Pessoa fixa' ? esc(r.responsavel) : (r.responsavelModo === 'Na vez' ? 'quem estiver na vez' : 'sem responsável');
    var linhas = '<span>Vai para <b>' + esc(r.quadroNome) + '</b> › ' + (r.listaNome ? esc(r.listaNome) : '<i>lista removida</i>') + '</span>' +
      '<span>Responsável: <b>' + resp + '</b>' + (r.prazoDias !== null ? ' · prazo ' + (r.prazoDias === 0 ? 'no mesmo dia' : r.prazoDias + (r.prazoDias === 1 ? ' dia depois' : ' dias depois')) : '') + '</span>';
    if (r.frequencia === 'Mensal' && /^\d+$/.test(r.diaMes) && r.seNaoUtil !== 'Manter o dia') linhas += '<span>Se cair em dia sem expediente: ' + esc(r.seNaoUtil.toLowerCase()) + '</span>';
    if (r.inicio || r.fim) linhas += '<span>Vale ' + (r.inicio ? 'a partir de ' + dataBr(r.inicio) : '') + (r.inicio && r.fim ? ' ' : '') + (r.fim ? 'até ' + dataBr(r.fim) : '') + '</span>';
    var datas = [];
    if (r.ativa) datas.push('Próximo cartão: <b>' + (r.proxima ? esc(quandoData(r.proxima, hoje)) : 'nenhuma data pela frente') + '</b>');
    if (r.ultimoCartaoData) {
      datas.push('Último cartão: ' + (r.ultimoCartaoId
        ? '<button type="button" class="link-texto" data-acao="abrir-meu" data-quadro="' + esc(r.quadroId) + '" data-id="' + esc(r.ultimoCartaoId) + '">' + esc(quandoData(r.ultimoCartaoData, hoje)) + '</button>'
        : esc(quandoData(r.ultimoCartaoData, hoje))));
    } else if (r.ativa) {
      datas.push('Nenhum cartão criado ainda');
    }
    var acoes = '';
    if (r.podeAdministrar) {
      acoes = '<div class="rotina-acoes"><button type="button" class="btn pequeno" data-acao="editar-rotina" data-id="' + esc(r.id) + '">Editar</button>' +
        (r.ativa ? '<button type="button" class="btn pequeno" data-acao="gerar-rotina" data-id="' + esc(r.id) + '" title="Cria agora o cartão de hoje, sem esperar">Criar cartão de hoje</button>' : '') +
        '<button type="button" class="btn sutil pequeno" data-acao="alternar-rotina" data-id="' + esc(r.id) + '" data-ativa="' + (r.ativa ? '0' : '1') + '">' + (r.ativa ? 'Pausar' : 'Retomar') + '</button></div>';
    }
    return '<li class="rotina' + (r.ativa ? '' : ' pausada') + '" style="--cor:' + esc(r.quadroCor) + '">' +
      '<div class="rotina-topo"><b class="rotina-nome">' + esc(r.nome) + '</b>' + (r.ativa ? '' : '<span class="chip">Pausada</span>') + '</div>' +
      '<div class="rotina-quando"><span class="chip chip-frente">' + I.rotina + esc(quandoRotina(r)) + '</span></div>' +
      '<div class="rotina-meta">' + linhas + '</div>' +
      (datas.length ? '<div class="rotina-datas">' + datas.join(' · ') + '</div>' : '') +
      (r.aviso ? '<p class="rotina-aviso">' + esc(r.aviso) + '</p>' : '') + acoes + '</li>';
  }

  function renderRotinasCorpo() {
    var el = $('#rotinas-corpo');
    var R = S.rotinas;
    if (!el || !R) return;
    var podeCriar = R.quadros.length > 0;
    var ativas = R.rotinas.filter(function (r) { return r.ativa; });
    var pausadas = R.rotinas.filter(function (r) { return !r.ativa; });
    var corpo = '';
    if (!R.rotinas.length) {
      corpo = '<div class="vazio"><h2>Nenhuma rotina ainda</h2>' +
        '<p>' + (podeCriar ? 'Crie uma rotina para tarefas que se repetem: “atualizar o painel de vendas” todo dia útil, “conferir as notas fiscais” toda sexta, “fechar o mês” no último dia útil.' : 'Quando o dono de um quadro criar rotinas, elas aparecem aqui.') + '</p>' +
        (podeCriar ? '<button type="button" class="btn primario" data-acao="nova-rotina">' + I.mais + 'Criar a primeira rotina</button>' : '') + '</div>';
    } else {
      corpo = '<ul class="rotinas">' + ativas.map(function (r) { return htmlRotina(r, R.hoje); }).join('') + '</ul>' +
        (pausadas.length ? '<h2 class="subtitulo">Pausadas <span class="conta">' + pausadas.length + '</span></h2><ul class="rotinas">' + pausadas.map(function (r) { return htmlRotina(r, R.hoje); }).join('') + '</ul>' : '');
    }
    el.innerHTML = htmlGatilho(R) + corpo;
  }

  function aplicarRotinas(dados) {
    S.rotinas = dados;
    if (S.view === 'rotinas') renderRotinasCorpo();
  }

  function modalRotina(id) {
    var R = S.rotinas;
    if (!R) { aviso('Ainda carregando as rotinas. Tente de novo em um instante.'); return; }
    if (!R.quadros.length) { aviso('Para criar rotinas você precisa ser dono de um quadro (ou ADM).', { erro: true }); return; }
    var r = id ? R.rotinas.filter(function (x) { return x.id === id; })[0] : null;
    if (id && !r) return;
    var pref = lerPref('ultimoQuadro');
    var qId = r ? r.quadroId : (R.quadros.some(function (q) { return q.id === pref; }) ? pref : R.quadros[0].id);
    var q = R.quadros.filter(function (x) { return x.id === qId; })[0] || R.quadros[0];
    var freq = r ? r.frequencia : 'Dias úteis';
    var dias = r ? r.diasSemana : [1];
    var diaMes = r && r.diaMes ? String(r.diaMes) : '1';
    var naoUtil = r ? r.seNaoUtil : 'Manter o dia';
    var modo = r ? r.responsavelModo : 'Ninguém';
    var pessoas = S.usuarios.filter(function (u) { return u.perfil !== 'Leitor'; });
    var especiais = ['Último dia', 'Primeiro dia útil', 'Último dia útil'];
    var opDias = [];
    for (var d = 1; d <= 31; d++) opDias.push(String(d));

    var html = '<form data-nf="rotina" data-id="' + esc(r ? r.id : '') + '">' +
      '<div class="modal-cabeca"><h2 id="modal-titulo">' + (r ? 'Editar rotina' : 'Nova rotina') + '</h2>' +
      '<p>O cartão nasce sozinho no dia certo. Se a rotina vence hoje, o cartão de hoje é criado assim que você salvar.</p></div>' +
      '<div class="modal-corpo">' +
      '<div class="campo"><label for="rt-nome">Título do cartão</label><input type="text" id="rt-nome" maxlength="200" required value="' + esc(r ? r.nome : '') + '" placeholder="Ex.: Atualizar painel de vendas — {mes}" autofocus>' +
      '<span class="ajuda">Escreva {data} para entrar a data do cartão e {mes} para o mês. Ex.: Fechamento de {mes}.</span></div>' +
      '<div class="linha-2"><div class="campo"><label for="rt-quadro">Quadro</label><select id="rt-quadro" data-nf-mudou="rt-quadro">' +
      R.quadros.map(function (x) { return '<option value="' + esc(x.id) + '"' + (x.id === q.id ? ' selected' : '') + '>' + esc(x.nome) + '</option>'; }).join('') + '</select></div>' +
      '<div class="campo"><label for="rt-lista">Lista onde o cartão nasce</label><select id="rt-lista">' + htmlOpcoesListas(q, r ? r.listaId : '') + '</select></div></div>' +

      '<div class="campo"><label for="rt-freq">Quando se repete</label><select id="rt-freq" data-nf-mudou="rt-freq">' +
      [['Diária', 'Todo dia (inclui fim de semana)'], ['Dias úteis', 'Todo dia útil (segunda a sexta, sem feriados)'], ['Semanal', 'Toda semana, nos dias que eu marcar'], ['Mensal', 'Todo mês']].map(function (o) {
        return '<option value="' + o[0] + '"' + (o[0] === freq ? ' selected' : '') + '>' + o[1] + '</option>';
      }).join('') + '</select></div>' +

      '<div class="campo" id="rt-semana-caixa"' + (freq === 'Semanal' ? '' : ' hidden') + '><span class="rotulo">Nos dias</span><div class="dias-semana">' +
      [1, 2, 3, 4, 5, 6, 7].map(function (n) {
        return '<label class="dia-op"><input type="checkbox" data-rt-dia value="' + n + '"' + (dias.indexOf(n) !== -1 ? ' checked' : '') + '><span>' + DIAS_CURTOS[n % 7] + '</span></label>';
      }).join('') + '</div></div>' +

      '<div class="linha-2" id="rt-mes-caixa"' + (freq === 'Mensal' ? '' : ' hidden') + '><div class="campo"><label for="rt-diames">Dia do mês</label><select id="rt-diames" data-nf-mudou="rt-diames">' +
      opDias.map(function (n) { return '<option value="' + n + '"' + (n === diaMes ? ' selected' : '') + '>Dia ' + n + '</option>'; }).join('') +
      especiais.map(function (n) { return '<option value="' + n + '"' + (n === diaMes ? ' selected' : '') + '>' + n + '</option>'; }).join('') + '</select></div>' +
      '<div class="campo" id="rt-naoutil-caixa"' + (diaMes === 'Primeiro dia útil' || diaMes === 'Último dia útil' ? ' hidden' : '') + '><label for="rt-naoutil">Se cair em fim de semana ou feriado</label><select id="rt-naoutil">' +
      ['Manter o dia', 'Próximo dia útil', 'Dia útil anterior'].map(function (n) { return '<option' + (n === naoUtil ? ' selected' : '') + '>' + n + '</option>'; }).join('') + '</select></div></div>' +

      '<div class="linha-2"><div class="campo"><label for="rt-modo">Quem fica responsável</label><select id="rt-modo" data-nf-mudou="rt-modo">' +
      [['Ninguém', 'Ninguém (cartão sem responsável)'], ['Pessoa fixa', 'Uma pessoa fixa'], ['Na vez', 'Quem estiver na vez (Escala da semana)']].map(function (o) {
        return '<option value="' + o[0] + '"' + (o[0] === modo ? ' selected' : '') + '>' + o[1] + '</option>';
      }).join('') + '</select></div>' +
      '<div class="campo" id="rt-resp-caixa"' + (modo === 'Pessoa fixa' ? '' : ' hidden') + '><label for="rt-resp">Pessoa</label><select id="rt-resp"><option value="">Escolher</option>' +
      pessoas.map(function (p) { return '<option' + (r && r.responsavel === p.nome ? ' selected' : '') + '>' + esc(p.nome) + '</option>'; }).join('') + '</select></div></div>' +
      '<p class="ajuda" id="rt-vez-ajuda"' + (modo === 'Na vez' ? '' : ' hidden') + '>“Na vez” funciona quando a lista é uma frente da Escala da semana do quadro. Se não for, o cartão nasce sem responsável.</p>' +

      '<div class="linha-2"><div class="campo"><label for="rt-prazo">Prazo, em dias depois da criação</label><input type="number" id="rt-prazo" min="0" max="365" step="1" value="' + esc(r && r.prazoDias !== null ? r.prazoDias : '') + '" placeholder="Sem prazo"><span class="ajuda">0 = vence no próprio dia.</span></div>' +
      '<div class="campo"><label for="rt-prio">Prioridade</label><select id="rt-prio">' + S.prioridades.map(function (p) { return '<option' + ((r ? r.prioridade : 'Média') === p ? ' selected' : '') + '>' + esc(p) + '</option>'; }).join('') + '</select></div></div>' +

      '<div class="campo" id="rt-etq-campo"' + (q.etiquetas.length ? '' : ' hidden') + '><span class="rotulo">Etiquetas</span><div class="etq-opcoes" id="rt-etq-caixa">' + htmlOpcoesEtiquetas(q, r ? r.etiquetas : []) + '</div></div>' +

      '<div class="campo"><label for="rt-desc">Descrição (vai em todo cartão)</label><textarea id="rt-desc" rows="3" maxlength="5000" placeholder="Passo a passo, onde fica a planilha, quem avisar…">' + esc(r ? r.descricao : '') + '</textarea></div>' +
      '<div class="campo"><label for="rt-link">Link (opcional)</label><input type="text" id="rt-link" maxlength="500" value="' + esc(r ? r.link : '') + '" placeholder="https://…"></div>' +
      '<div class="campo"><label for="rt-check">Checklist (uma tarefa por linha)</label><textarea id="rt-check" rows="3" maxlength="5000" placeholder="Baixar o relatório&#10;Atualizar a aba Resumo&#10;Avisar a diretoria">' + esc(r ? r.checklist.join('\n') : '') + '</textarea></div>' +

      '<details class="rt-periodo"' + (r && (r.inicio || r.fim) ? ' open' : '') + '><summary>Só durante um período (opcional)</summary><div class="linha-2">' +
      '<div class="campo"><label for="rt-inicio">A partir de</label><input type="date" id="rt-inicio" value="' + esc(r ? r.inicio : '') + '"></div>' +
      '<div class="campo"><label for="rt-fim">Até</label><input type="date" id="rt-fim" value="' + esc(r ? r.fim : '') + '"></div></div></details>' +
      (r ? '<label class="alternar"><input type="checkbox" id="rt-ativa"' + (r.ativa ? ' checked' : '') + '>Rotina ativa (desmarque para pausar)</label>' : '') +
      '</div>' +
      '<div class="modal-rodape"><div class="direita"><button type="button" class="btn sutil" data-acao="fechar-modal">Cancelar</button>' +
      '<button type="submit" class="btn primario">' + (r ? 'Salvar rotina' : 'Criar rotina') + '</button></div></div></form>';
    abrirModal(html, { largo: true, semFoco: false });
  }

  function htmlOpcoesListas(q, selecionada) {
    return q.listas.map(function (l, i) {
      return '<option value="' + esc(l.id) + '"' + ((selecionada ? l.id === selecionada : i === 0) ? ' selected' : '') + '>' + esc(l.nome) + '</option>';
    }).join('');
  }
  function htmlOpcoesEtiquetas(q, marcadas) {
    return q.etiquetas.map(function (e) {
      return '<label class="etq-op"><input type="checkbox" data-rt-etq value="' + esc(e.id) + '"' + (marcadas.indexOf(e.id) !== -1 ? ' checked' : '') + '>' + etiquetaHtml(e, true) + '</label>';
    }).join('');
  }

  function aoMudarCampoRotina(qual, t) {
    var R = S.rotinas;
    if (qual === 'rt-quadro') {
      var q = R.quadros.filter(function (x) { return x.id === t.value; })[0];
      if (!q) return;
      $('#rt-lista').innerHTML = htmlOpcoesListas(q, '');
      $('#rt-etq-caixa').innerHTML = htmlOpcoesEtiquetas(q, []);
      $('#rt-etq-campo').hidden = !q.etiquetas.length;
    }
    if (qual === 'rt-freq') {
      $('#rt-semana-caixa').hidden = t.value !== 'Semanal';
      $('#rt-mes-caixa').hidden = t.value !== 'Mensal';
    }
    if (qual === 'rt-diames') {
      $('#rt-naoutil-caixa').hidden = t.value === 'Primeiro dia útil' || t.value === 'Último dia útil';
    }
    if (qual === 'rt-modo') {
      $('#rt-resp-caixa').hidden = t.value !== 'Pessoa fixa';
      $('#rt-vez-ajuda').hidden = t.value !== 'Na vez';
    }
  }

  function enviarRotina(f) {
    var editando = !!f.getAttribute('data-id');
    var dados = {
      id: f.getAttribute('data-id') || '',
      nome: $('#rt-nome').value, quadroId: $('#rt-quadro').value, listaId: $('#rt-lista').value,
      frequencia: $('#rt-freq').value,
      diasSemana: $$('[data-rt-dia]', f).filter(function (c) { return c.checked; }).map(function (c) { return c.value; }),
      diaMes: $('#rt-diames').value, seNaoUtil: $('#rt-naoutil').value,
      responsavelModo: $('#rt-modo').value, responsavel: $('#rt-resp').value,
      prazoDias: $('#rt-prazo').value, prioridade: $('#rt-prio').value,
      etiquetas: $$('[data-rt-etq]', f).filter(function (c) { return c.checked; }).map(function (c) { return c.value; }),
      descricao: $('#rt-desc').value, link: $('#rt-link').value, checklist: $('#rt-check').value,
      inicio: $('#rt-inicio').value, fim: $('#rt-fim').value,
      ativa: editando ? $('#rt-ativa').checked : true
    };
    var botao = f.querySelector('button[type="submit"]');
    botao.disabled = true;
    api('salvarRotina', dados).then(function (r) {
      fecharModal();
      aplicarRotinas(r.dados);
      aviso(r.gerou ? 'Rotina salva. O cartão de hoje já foi criado.' : 'Rotina salva.');
      if (r.aviso) setTimeout(function () { aviso(r.aviso); }, 500);
    }).catch(function (e) { botao.disabled = false; aviso(msgErro(e), { erro: true }); });
  }

  function gerarRotinaHoje(id) {
    api('gerarRotinaAgora', id).then(function (r) {
      aplicarRotinas(r.dados);
      aviso('Cartão de hoje criado.', { acao: { rotulo: 'Abrir', fn: function () { abrirQuadro(r.quadroId, r.cartaoId); } } });
    }).catch(function (e) { aviso(msgErro(e), { erro: true }); });
  }

  function alternarRotinaTela(id, ativa) {
    api('alternarRotina', id, ativa).then(function (r) {
      aplicarRotinas(r.dados);
      aviso(ativa ? (r.gerou ? 'Rotina retomada. O cartão de hoje foi criado.' : 'Rotina retomada.') : 'Rotina pausada. Nenhum cartão novo até você retomar.');
    }).catch(function (e) { aviso(msgErro(e), { erro: true }); });
  }

  function mudarGatilho(ligar) {
    api(ligar ? 'ativarGatilhoRotinas' : 'desativarGatilhoRotinas').then(function (r) {
      aplicarRotinas(r.dados);
      aviso(ligar ? 'Criação diária ligada.' : 'Criação diária desligada.');
    }).catch(function (e) { aviso(msgErro(e), { erro: true }); });
  }

  /* ------------------------------------------------------------------
     Equipe: semana (home e presencial), banco de horas, férias e folgas
     ------------------------------------------------------------------ */
  function abrirEquipe(aba) {
    fecharGaveta();
    S.view = 'equipe';
    S.quadro = null;
    S.versao = '';
    S.equipe = { aba: aba || 'semana', semana: '', dados: null, carregando: false, banco: null, alvo: '', carregandoBanco: false, erroBanco: '', ausencias: null };
    render();
    carregarEquipeSemana('');
    if (S.equipe.aba === 'banco') carregarBanco('');
    if (S.equipe.aba === 'ausencias') carregarAusenciasEquipe();
  }

  function htmlEquipe() {
    return '<section class="pagina"><header class="inicio-cabeca"><div><h1>Equipe</h1>' +
      '<p class="sub">Quem está em home e quem está presencial em cada dia, férias e folgas, e o banco de horas de cada pessoa.</p></div></header>' +
      '<div class="abas-pagina" role="tablist" id="eq-abas"></div><div id="eq-corpo"></div></section>';
  }

  function renderEquipeAbas() {
    var E = S.equipe;
    var el = $('#eq-abas');
    if (!E || !el) return;
    var d = E.dados;
    var pend = S.resumoEquipe && S.usuario && S.usuario.perfil === 'ADM' ? S.resumoEquipe.pendentes : 0;
    var itens = [['semana', 'Semana'], ['banco', 'Banco de horas' + (pend ? '<span class="selo">' + pend + '</span>' : '')]];
    if (d && d.podeGerirAusencias) itens.push(['ausencias', 'Férias e folgas']);
    el.innerHTML = itens.map(function (a) {
      return '<button type="button" role="tab" aria-selected="' + (E.aba === a[0]) + '" data-acao="eq-aba" data-valor="' + a[0] + '">' + a[1] + '</button>';
    }).join('');
  }

  function renderEquipeCorpo() {
    var E = S.equipe;
    var el = $('#eq-corpo');
    if (!E || !el) return;
    renderEquipeAbas();
    if (E.aba === 'banco') el.innerHTML = htmlEquipeBanco();
    else if (E.aba === 'ausencias') el.innerHTML = htmlEquipeAusencias();
    else el.innerHTML = htmlEquipeSemana();
  }

  function carregarEquipeSemana(semana) {
    var E = S.equipe;
    if (!E) return;
    E.carregando = true;
    renderEquipeCorpo();
    api('obterEquipeSemana', semana || '').then(function (d) {
      if (S.equipe !== E) return;
      E.dados = d;
      E.semana = d.semana;
      E.carregando = false;
      renderEquipeCorpo();
    }).catch(function (e) {
      if (S.equipe !== E) return;
      E.carregando = false;
      aviso(msgErro(e), { erro: true });
      renderEquipeCorpo();
    });
  }

  function periodoSemana(seg) { return dataBr(seg) + ' a ' + dataBr(somaDias(seg, 4)); }

  function recontarEquipe(d) {
    d.dias.forEach(function (dia) {
      if (d.feriados[dia]) return;
      var c = { home: 0, fora: 0, presenciais: 0, total: d.pessoas.length };
      d.pessoas.forEach(function (p) {
        if (p.fora[dia]) c.fora++;
        else if (p.home.indexOf(dia) !== -1) c.home++;
        else c.presenciais++;
      });
      d.contagem[dia] = c;
    });
  }

  function htmlEquipeSemana() {
    var E = S.equipe;
    var d = E.dados;
    if (!d) return htmlCarregando('Montando a grade da semana');
    var ehEstaSemana = d.semana === semanaDe(d.hoje);
    var barra = '<div class="eq-barra"><div class="eq-barra-esq"><div class="segmentado" role="group" aria-label="Semana">' +
      '<button type="button" data-acao="eq-semana" data-valor="ant" aria-label="Semana anterior">‹ Anterior</button>' +
      '<button type="button" data-acao="eq-semana" data-valor="hoje" aria-pressed="' + ehEstaSemana + '">Esta semana</button>' +
      '<button type="button" data-acao="eq-semana" data-valor="prox" aria-label="Próxima semana">Próxima ›</button></div>' +
      '<span class="texto-suave">Segunda ' + dataBr(d.semana) + ' a sexta ' + dataBr(d.semanaFim) + '</span></div>' +
      (d.podeEditar ? '<button type="button" class="btn pequeno" data-acao="eq-copiar" title="Repete nesta semana os dias de home da semana anterior">Copiar semana anterior</button>' : '') + '</div>';

    var cab = '<th class="col-nome" scope="col">Pessoa</th><th scope="col">Home na semana</th>' + d.dias.map(function (dia) {
      var feriado = d.feriados[dia];
      var c = d.contagem[dia];
      var baixo = !feriado && d.minPresenciais && c.presenciais < d.minPresenciais;
      return '<th scope="col" class="dia' + (dia === d.hoje ? ' hoje' : '') + '"><span class="dia-nome">' + DIAS_CURTOS[diaDaSemana(dia)] + ' ' + dataBr(dia) + '</span>' +
        (feriado ? '<span class="dia-conta">Feriado</span>'
          : '<span class="dia-conta' + (baixo ? ' baixo' : '') + '">' + plural(c.presenciais, 'presencial', 'presenciais') + (baixo ? ' (mín. ' + d.minPresenciais + ')' : '') + '</span>' +
            '<span class="dia-conta">' + c.home + ' home' + (c.fora ? ' · ' + c.fora + ' fora' : '') + '</span>') + '</th>';
    }).join('');

    var linhas = d.pessoas.map(function (p) {
      var cota = d.podeEditar
        ? '<select data-nf-mudou="eq-cota" data-email="' + esc(p.email) + '" aria-label="Cota de home de ' + esc(p.nome) + '"><option value=""' + (p.cotaPropria ? '' : ' selected') + '>Padrão (' + d.cotaPadrao + ')</option>' +
          [0, 1, 2, 3, 4, 5].map(function (n) { return '<option value="' + n + '"' + (p.cotaPropria && p.cota === n ? ' selected' : '') + '>' + n + ' ' + (n === 1 ? 'dia' : 'dias') + '</option>'; }).join('') + '</select>'
        : '<span class="texto-suave">de ' + p.cota + '</span>';
      var estado = p.home.length > p.cota ? 'passou' : (p.home.length < p.cota ? 'falta' : '');
      var celulas = d.dias.map(function (dia) {
        if (d.feriados[dia]) return '<td><span class="cel feriado">Feriado</span></td>';
        if (p.fora[dia]) return '<td><span class="cel fora">' + esc(p.fora[dia]) + '</span></td>';
        var home = p.home.indexOf(dia) !== -1;
        var rotulo = home ? 'Home' : 'Presencial';
        if (!d.podeEditar) return '<td><span class="cel ' + (home ? 'home' : 'pres') + '">' + rotulo + '</span></td>';
        return '<td><button type="button" class="cel ' + (home ? 'home' : 'pres') + '" data-acao="eq-celula" data-email="' + esc(p.email) + '" data-dia="' + dia + '" data-tipo="' + (home ? 'Presencial' : 'Home') + '" ' +
          'aria-label="' + esc(p.nome) + ', ' + dataComDia(dia) + ': ' + rotulo + '. Clique para marcar ' + (home ? 'presencial' : 'home') + '">' + rotulo + '</button></td>';
      }).join('');
      return '<tr><th scope="row" class="col-nome"><span class="pessoa-cel">' + avatar(p.nome, true) + '<span>' + esc(p.nome) + (p.eu ? ' <span class="chip">você</span>' : '') + '</span></span></th>' +
        '<td><div class="cota"><span class="cota-n ' + estado + '" title="' + (estado === 'passou' ? 'Acima da cota' : (estado === 'falta' ? 'Abaixo da cota' : 'Na cota')) + '">' + p.home.length + '/' + p.cota + '</span>' + cota + '</div></td>' + celulas + '</tr>';
    }).join('');

    var tabela = d.pessoas.length
      ? '<div class="grade-eq-caixa' + (E.carregando ? ' carregando' : '') + '"><div class="rolagem-x"><table class="grade-eq"><thead><tr>' + cab + '</tr></thead><tbody>' + linhas + '</tbody></table></div></div>'
      : '<div class="vazio"><h2>Ninguém na equipe ainda</h2><p>Cadastre pessoas na Administração. Quem tem perfil Leitor não entra na grade.</p></div>';

    return barra + tabela +
      '<div class="legenda"><span><i class="l-home"></i>Home</span><span><i class="l-pres"></i>Presencial</span><span><i class="l-fora"></i>Férias, folga ou ausência</span><span><i class="l-fer"></i>Feriado</span></div>' +
      '<p class="ajuda eq-nota">' + (d.podeEditar ? 'Clique numa célula para alternar entre presencial e home. ' : '') +
      'Quem não tem marca vem presencial. A cota é quantos dias de home a pessoa tem por semana' + (d.minPresenciais ? '; o aviso “mín.” aparece quando há menos de ' + d.minPresenciais + ' pessoas presenciais no dia' : '') + '.</p>';
  }

  function semanaDe(iso) {
    var dow = diaDaSemana(iso);
    return somaDias(iso, dow === 0 ? -6 : 1 - dow);
  }

  function irParaSemana(qual) {
    var E = S.equipe;
    if (!E || !E.dados) return;
    var alvo = qual === 'ant' ? somaDias(E.dados.semana, -7) : (qual === 'prox' ? somaDias(E.dados.semana, 7) : '');
    carregarEquipeSemana(alvo);
  }

  function alternarCelula(el) {
    var E = S.equipe;
    var d = E && E.dados;
    if (!d) return;
    var email = el.getAttribute('data-email');
    var dia = el.getAttribute('data-dia');
    var virarHome = el.getAttribute('data-tipo') === 'Home';
    var p = d.pessoas.filter(function (x) { return x.email === email; })[0];
    if (!p || (p.home.indexOf(dia) !== -1) === virarHome) return;
    if (virarHome) p.home.push(dia);
    else p.home = p.home.filter(function (x) { return x !== dia; });
    recontarEquipe(d);
    renderEquipeCorpo();
    var foco = $('[data-acao="eq-celula"][data-email="' + email + '"][data-dia="' + dia + '"]');
    if (foco) foco.focus();
    escrever('definirPresenca', email, dia, virarHome ? 'Home' : 'Presencial').then(function (r) {
      setTimeout(function () {
        if (S.equipe !== E || pendentes || !E.dados || r.equipe.semana !== E.dados.semana) return;
        var ativo = document.activeElement && document.activeElement.getAttribute ? document.activeElement : null;
        var chave = ativo && ativo.getAttribute('data-email') ? [ativo.getAttribute('data-email'), ativo.getAttribute('data-dia')] : null;
        E.dados = r.equipe;
        renderEquipeCorpo();
        if (chave) { var f = $('[data-acao="eq-celula"][data-email="' + chave[0] + '"][data-dia="' + chave[1] + '"]'); if (f) f.focus(); }
      }, 0);
    }).catch(function (e) {
      aviso(msgErro(e), { erro: true });
      if (S.equipe === E) carregarEquipeSemana(E.dados ? E.dados.semana : '');
    });
  }

  function salvarCotaTela(sel) {
    var E = S.equipe;
    if (!E || !E.dados) return;
    sel.disabled = true;
    api('salvarCotaHome', sel.getAttribute('data-email'), sel.value, E.dados.semana).then(function (r) {
      if (S.equipe !== E) return;
      E.dados = r.equipe;
      renderEquipeCorpo();
    }).catch(function (e) {
      aviso(msgErro(e), { erro: true });
      if (S.equipe === E) renderEquipeCorpo();
    });
  }

  function copiarSemanaAnterior() {
    var E = S.equipe;
    if (!E || !E.dados) return;
    var destino = E.dados.semana;
    var origem = somaDias(destino, -7);
    confirmarAcao({
      titulo: 'Copiar a semana anterior?',
      texto: 'Os dias de home de ' + periodoSemana(origem) + ' serão repetidos em ' + periodoSemana(destino) + '. O que já está marcado nesta semana será substituído. Férias, folgas e feriados são respeitados.',
      confirmar: 'Copiar'
    }).then(function (ok) {
      if (!ok) return;
      api('copiarSemanaHome', origem, destino).then(function (r) {
        if (S.equipe !== E) return;
        E.dados = r.equipe;
        renderEquipeCorpo();
        aviso(plural(r.copiados, 'dia de home copiado', 'dias de home copiados') + (r.ignorados ? ' (' + plural(r.ignorados, 'ignorado', 'ignorados') + ' por ausência ou feriado).' : '.'));
      }).catch(function (e) { aviso(msgErro(e), { erro: true }); });
    });
  }

  /* ---------- Banco de horas ---------- */
  function carregarBanco(email) {
    var E = S.equipe;
    if (!E) return;
    E.carregandoBanco = true;
    E.erroBanco = '';
    renderEquipeCorpo();
    api('obterBancoHoras', email || '').then(function (b) {
      if (S.equipe !== E) return;
      E.banco = b;
      E.alvo = b.alvo.email;
      E.carregandoBanco = false;
      sincronizarResumoBanco(b);
      renderEquipeCorpo();
    }).catch(function (e) {
      if (S.equipe !== E) return;
      E.carregandoBanco = false;
      E.erroBanco = msgErro(e);
      renderEquipeCorpo();
    });
  }

  function sincronizarResumoBanco(b) {
    var r = S.resumoEquipe;
    if (!r) return;
    r.saldo = b.meuSaldo;
    if (b.ehAdm) r.pendentes = b.pedidos.filter(function (p) { return p.podeDecidir; }).length;
    var topo = $('.topo');
    if (topo) topo.outerHTML = htmlTopo();
    atualizarStatusInicial();
  }

  function htmlLancamento(l) {
    var valor = l.tipo === 'Débito' ? -l.minutos : l.minutos;
    var chipCls = l.status === 'Aprovado' ? 'chip-ok' : (l.status === 'Recusado' ? 'chip-neg' : 'chip-pend');
    var detalhe = 'Pedido de ' + esc(l.solicitadoPor) + (l.solicitadoEm ? ', ' + esc(dataHora(l.solicitadoEm)) : '');
    if (l.status !== 'Pendente' && l.decididoPor) detalhe += ' · ' + (l.status === 'Aprovado' ? 'aprovado' : 'recusado') + ' por ' + esc(l.decididoPor);
    if (l.resposta) detalhe += ' · “' + esc(l.resposta) + '”';
    return '<li class="lanc ' + l.status.toLowerCase() + '">' +
      '<span class="lanc-data">' + esc(dataComDia(l.data)) + '</span>' +
      '<span class="lanc-desc"><b>' + esc(l.descricao) + '</b><small>' + detalhe + '</small></span>' +
      '<span class="lanc-valor ' + (l.status === 'Aprovado' ? classeSaldo(valor) : 'zero') + '" title="' + esc(l.tipo) + '">' + fmtHoras(valor, true) + '</span>' +
      '<span class="lanc-status"><span class="chip ' + chipCls + '">' + esc(l.status) + '</span>' +
      (l.podeCancelar ? '<button type="button" class="btn sutil pequeno" data-acao="eq-cancelar" data-id="' + esc(l.id) + '" data-status="' + esc(l.status) + '">' + (l.status === 'Pendente' ? 'Cancelar' : 'Remover') + '</button>' : '') + '</span></li>';
  }

  function htmlEquipeBanco() {
    var E = S.equipe;
    if (E.erroBanco) return '<div class="vazio"><h2>Banco de horas indisponível</h2><p>' + esc(E.erroBanco) + '</p></div>';
    var b = E.banco;
    if (!b) return htmlCarregando('Buscando o banco de horas');
    var meu = b.alvo.email === b.meuEmail;
    var saldo = '<div class="saldo-cartao"><div><small>' + (meu ? 'Seu saldo' : 'Saldo de ' + esc(b.alvo.nome)) + '</small>' +
      '<div class="saldo-grande ' + classeSaldo(b.alvo.saldo) + '">' + fmtHoras(b.alvo.saldo, true) + '</div>' +
      '<small>' + (b.alvo.saldo < 0 ? 'Horas a compensar. ' : (b.alvo.saldo > 0 ? 'Horas a favor. ' : '')) + 'Só conta o que a coordenação aprovou.</small></div>' +
      '<button type="button" class="btn primario" data-acao="eq-lancar">' + I.mais + (b.ehAdm && !meu ? 'Lançar horas' : 'Pedir lançamento') + '</button></div>';
    var extrato = b.extrato.length ? '<ul class="extrato">' + b.extrato.map(htmlLancamento).join('') + '</ul>'
      : '<div class="vazio"><h2>Nenhum lançamento</h2><p>' + (meu ? 'Quando você pedir um crédito (trabalhou a mais) ou um débito (saiu antes ou compensou), ele aparece aqui.' : 'Esta pessoa ainda não tem lançamentos.') + '</p></div>';
    var titulo = '<h2 class="subtitulo">Extrato' + (meu ? '' : ' de ' + esc(b.alvo.nome)) + '</h2>';
    if (!b.ehAdm) {
      return '<div class="banco so-meu"><div>' + saldo + titulo + extrato + '<p class="ajuda eq-nota">O banco de horas é um controle interno da equipe. Ele não substitui o registro de ponto.</p></div></div>';
    }
    var pedidos = '';
    if (b.pedidos.length) {
      pedidos = '<section class="pedidos"><h2 class="subtitulo">Pedidos para responder <span class="conta">' + b.pedidos.length + '</span></h2>' + b.pedidos.map(function (p) {
        var valor = p.tipo === 'Débito' ? -p.minutos : p.minutos;
        return '<div class="pedido"><div class="pedido-txt"><b>' + avatar(p.pessoa, true) + ' ' + esc(p.pessoa) + '</b> pede <b>' + esc(p.tipo.toLowerCase()) + ' de ' + fmtHoras(Math.abs(valor)) + '</b> em ' + esc(dataComDia(p.data)) +
          '<small>' + esc(p.descricao) + (p.solicitadoPor !== p.pessoa ? ' · lançado por ' + esc(p.solicitadoPor) : '') + '</small></div>' +
          (p.podeDecidir
            ? '<div class="pedido-acoes"><button type="button" class="btn primario pequeno" data-acao="eq-aprovar" data-id="' + esc(p.id) + '">Aprovar</button>' +
              '<button type="button" class="btn pequeno" data-acao="eq-recusar" data-id="' + esc(p.id) + '">Recusar</button></div>'
            : '<span class="chip chip-pend">Outro ADM decide</span>') + '</div>';
      }).join('') + '</section>';
    }
    var lado = '<aside><h2 class="subtitulo">Saldos da equipe</h2><ul class="saldos">' + b.equipe.map(function (p) {
      return '<li><button type="button" data-acao="eq-extrato" data-email="' + esc(p.email) + '"' + (p.email === b.alvo.email ? ' aria-current="true"' : '') + '>' + avatar(p.nome, true) +
        '<span class="saldo-nome">' + esc(p.nome) + (p.email === b.meuEmail ? ' <span class="chip">você</span>' : '') + '</span>' +
        (p.pendentes ? '<span class="chip chip-pend" title="Pedidos pendentes">' + p.pendentes + '</span>' : '') +
        '<span class="saldo-valor ' + classeSaldo(p.saldo) + '">' + fmtHoras(p.saldo, true) + '</span></button></li>';
    }).join('') + '</ul></aside>';
    return '<div class="banco">' + lado + '<div>' + pedidos + saldo + titulo + extrato + '<p class="ajuda eq-nota">O banco de horas é um controle interno da equipe. Ele não substitui o registro de ponto.</p></div></div>';
  }

  function modalHoras() {
    var E = S.equipe;
    var b = E && E.banco;
    if (!b) { aviso('Ainda carregando o banco de horas. Tente de novo em um instante.'); return; }
    var adm = b.ehAdm;
    var meu = b.alvo.email === b.meuEmail;
    var html = '<form data-nf="horas">' +
      '<div class="modal-cabeca"><h2 id="modal-titulo">' + (adm && !meu ? 'Lançar horas' : 'Pedir lançamento de horas') + '</h2>' +
      '<p>' + (adm && !meu ? 'O lançamento já entra aprovado.' : 'O pedido fica pendente até a coordenação aprovar. O saldo só muda depois disso.') + '</p></div>' +
      '<div class="modal-corpo">' +
      (adm ? '<div class="campo"><label for="hr-pessoa">Pessoa</label><select id="hr-pessoa">' + b.equipe.map(function (p) { return '<option value="' + esc(p.email) + '"' + (p.email === b.alvo.email ? ' selected' : '') + '>' + esc(p.nome) + '</option>'; }).join('') + '</select></div>' : '') +
      '<div class="campo"><span class="rotulo">O que aconteceu</span><div class="opcoes-tipo">' +
      '<label class="opcao-radio"><input type="radio" name="hr-tipo" value="Crédito" checked><strong>Crédito</strong><small>Trabalhou a mais e quer guardar as horas.</small></label>' +
      '<label class="opcao-radio"><input type="radio" name="hr-tipo" value="Débito"><strong>Débito</strong><small>Saiu antes, faltou ou usou horas guardadas.</small></label></div></div>' +
      '<div class="linha-2"><div class="campo"><label for="hr-duracao">Duração</label><input type="text" id="hr-duracao" required maxlength="12" placeholder="2:30" autocomplete="off"><span class="ajuda">Pode digitar 2:30, 2h30, 1h15 ou 45min.</span></div>' +
      '<div class="campo"><label for="hr-data">Data</label><input type="date" id="hr-data" required value="' + hojeIso() + '"></div></div>' +
      '<div class="campo"><label for="hr-desc">Motivo</label><input type="text" id="hr-desc" required maxlength="300" placeholder="Ex.: fechamento do mês, saída para consulta"></div>' +
      '</div><div class="modal-rodape"><div class="direita"><button type="button" class="btn sutil" data-acao="fechar-modal">Cancelar</button>' +
      '<button type="submit" class="btn primario">' + (adm && !meu ? 'Lançar' : 'Enviar pedido') + '</button></div></div></form>';
    abrirModal(html, {});
  }

  function enviarHoras(f) {
    var E = S.equipe;
    var b = E.banco;
    var tipo = ($$('input[name="hr-tipo"]', f).filter(function (r) { return r.checked; })[0] || {}).value;
    var dados = { tipo: tipo, duracao: $('#hr-duracao').value, data: $('#hr-data').value, descricao: $('#hr-desc').value };
    var alvo = '';
    if (b.ehAdm) { alvo = $('#hr-pessoa').value; dados.email = alvo; }
    var botao = f.querySelector('button[type="submit"]');
    botao.disabled = true;
    api('solicitarHoras', dados).then(function (r) {
      fecharModal();
      aviso(r.direto ? 'Lançamento registrado.' : 'Pedido enviado. A coordenação vai responder.');
      if (S.equipe === E) carregarBanco(alvo);
    }).catch(function (e) { botao.disabled = false; aviso(msgErro(e), { erro: true }); });
  }

  function decidirPedido(id, aprovar, resposta) {
    var E = S.equipe;
    api('decidirHoras', id, aprovar, resposta || '').then(function () {
      aviso(aprovar ? 'Pedido aprovado.' : 'Pedido recusado.');
      if (S.equipe === E) carregarBanco(E.alvo);
    }).catch(function (e) { aviso(msgErro(e), { erro: true }); });
  }

  function cancelarLancamento(id, status) {
    var E = S.equipe;
    var fazer = function () {
      api('cancelarHoras', id).then(function () {
        aviso(status === 'Pendente' ? 'Pedido cancelado.' : 'Lançamento removido.');
        if (S.equipe === E) carregarBanco(E.alvo);
      }).catch(function (e) { aviso(msgErro(e), { erro: true }); });
    };
    if (status === 'Pendente') { fazer(); return; }
    confirmarAcao({ titulo: 'Remover este lançamento?', texto: 'Ele deixa de contar no saldo. O registro continua no histórico da planilha.', confirmar: 'Remover' }).then(function (ok) { if (ok) fazer(); });
  }

  /* ---------- Férias e folgas ---------- */
  function carregarAusenciasEquipe() {
    var E = S.equipe;
    if (!E) return;
    api('listarAusencias').then(function (lista) {
      if (S.equipe !== E) return;
      E.ausencias = lista;
      renderEquipeCorpo();
    }).catch(function (e) { aviso(msgErro(e), { erro: true }); });
  }

  function htmlEquipeAusencias() {
    var E = S.equipe;
    if (!E.ausencias) return htmlCarregando('Buscando férias e folgas');
    var pessoas = S.usuarios.filter(function (u) { return u.perfil !== 'Leitor'; });

  /* ------------------------------------------------------------------
     Arrastar e soltar (mouse e toque, sem biblioteca)
     ------------------------------------------------------------------ */
  var ARR = null;
  var ignorarCliqueAte = 0;

  function aoApertar(ev) {
    if (ev.pointerType === 'mouse' && ev.button !== 0) return;
    if (S.view !== 'quadro' || !S.quadro || !S.quadro.podeEditar || ARR) return;
    if (ev.target.closest('button, input, textarea, select, a, label, form')) return;
    var el = null;
    var tipo = null;
    var c = ev.target.closest('.cartao');
    if (c && c.closest('#listas')) {
      if (c.classList.contains('pendente')) return;
      el = c; tipo = 'cartao';
    } else {
      var cab = ev.target.closest('.lista-cabeca');
      if (cab && cab.closest('#listas')) { el = cab.closest('.lista'); tipo = 'lista'; }
    }
    if (!el) return;
    var st = { el: el, tipo: tipo, x0: ev.clientX, y0: ev.clientY, x: ev.clientX, y: ev.clientY, idPonteiro: ev.pointerId, ativo: false, toque: ev.pointerType !== 'mouse' };
    if (st.toque) {
      st.timer = setTimeout(function () { if (ARR === st) comecarArrasto(st); }, 280);
    }
    ARR = st;
    window.addEventListener('pointermove', aoMover, { passive: false });
    window.addEventListener('pointerup', aoSoltar);
    window.addEventListener('pointercancel', aoCancelar);
  }

  function limparOuvintes() {
    window.removeEventListener('pointermove', aoMover, { passive: false });
    window.removeEventListener('pointerup', aoSoltar);
    window.removeEventListener('pointercancel', aoCancelar);
  }

  function aoMover(ev) {
    var st = ARR;
    if (!st || ev.pointerId !== st.idPonteiro) return;
    st.x = ev.clientX;
    st.y = ev.clientY;
    if (!st.ativo) {
      var dist = Math.abs(st.x - st.x0) + Math.abs(st.y - st.y0);
      if (st.toque) {
        if (dist > 10) { clearTimeout(st.timer); limparOuvintes(); ARR = null; }
        return;
      }
      if (dist < 6) return;
      comecarArrasto(st);
    }
    ev.preventDefault();
    moverFantasma(st);
    posicionarLugar(st);
  }

  function comecarArrasto(st) {
    st.ativo = true;
    fecharMenu();
    var r = st.el.getBoundingClientRect();
    st.r0 = r;
    var f = st.el.cloneNode(true);
    f.classList.add('fantasma');
    f.removeAttribute('id');
    f.style.width = r.width + 'px';
    if (st.tipo === 'cartao') f.style.height = r.height + 'px';
    f.style.left = r.left + 'px';
    f.style.top = r.top + 'px';
    document.body.appendChild(f);
    st.fantasma = f;
    st.origemPai = st.el.parentNode;
    st.origemProx = st.el.nextSibling;
    st.el.classList.add('lugar');
    document.body.classList.add('arrastando');
    S.arrastando = true;
    moverFantasma(st);
    st.raf = requestAnimationFrame(function laco() { autoRolagem(st); if (ARR === st && st.ativo) st.raf = requestAnimationFrame(laco); });
  }

  function moverFantasma(st) {
    if (!st.fantasma) return;
    st.fantasma.style.transform = 'translate(' + (st.x - st.x0) + 'px,' + (st.y - st.y0) + 'px) rotate(' + (st.tipo === 'cartao' ? 2 : 1) + 'deg)';
  }

  function posicionarLugar(st) {
    if (st.tipo === 'cartao') {
      var sob = document.elementFromPoint(st.x, st.y);
      if (!sob) return;
      var cont = sob.closest('.lista-cartoes');
      if (!cont) {
        var l = sob.closest('.lista');
        if (l && !l.classList.contains('lugar')) cont = l.querySelector('.lista-cartoes');
      }
      if (!cont || !cont.closest('#listas')) return;
      var filhos = $$(':scope > .cartao', cont).filter(function (x) { return x !== st.el; });
      var antes = null;
      for (var i = 0; i < filhos.length; i++) {
        var r = filhos[i].getBoundingClientRect();
        if (st.y < r.top + r.height / 2) { antes = filhos[i]; break; }
      }
      if (antes) { if (st.el.parentNode !== cont || st.el.nextElementSibling !== antes) cont.insertBefore(st.el, antes); }
      else if (st.el.parentNode !== cont || st.el.nextElementSibling) cont.appendChild(st.el);
    } else {
      var contL = $('#listas');
      var listas = $$(':scope > .lista', contL).filter(function (x) { return x !== st.el; });
      var antesL = null;
      for (var j = 0; j < listas.length; j++) {
        var rl = listas[j].getBoundingClientRect();
        if (st.x < rl.left + rl.width / 2) { antesL = listas[j]; break; }
      }
      var fim = $('.lista-nova', contL);
      var alvo = antesL || fim;
      if (alvo) { if (st.el.nextElementSibling !== alvo) contL.insertBefore(st.el, alvo); }
      else if (st.el.nextElementSibling) contL.appendChild(st.el);
    }
  }

  function autoRolagem(st) {
    var mexeu = false;
    var cont = $('#listas');
    if (cont) {
      var r = cont.getBoundingClientRect();
      var m = 70;
      var v = 0;
      if (st.x < r.left + m) v = -Math.ceil((r.left + m - st.x) / 5);
      else if (st.x > r.right - m) v = Math.ceil((st.x - (r.right - m)) / 5);
      if (v) { var antes = cont.scrollLeft; cont.scrollLeft += v; mexeu = mexeu || cont.scrollLeft !== antes; }
    }
    if (st.tipo === 'cartao' && st.el.parentNode && st.el.parentNode.classList && st.el.parentNode.classList.contains('lista-cartoes')) {
      var lc = st.el.parentNode;
      var rc = lc.getBoundingClientRect();
      var mv = 0;
      if (st.y < rc.top + 40 && st.y > rc.top - 60) mv = -Math.ceil((rc.top + 40 - st.y) / 4);
      else if (st.y > rc.bottom - 40 && st.y < rc.bottom + 80) mv = Math.ceil((st.y - (rc.bottom - 40)) / 4);
      if (mv) { var a = lc.scrollTop; lc.scrollTop += mv; mexeu = mexeu || lc.scrollTop !== a; }
    }
    if (mexeu) posicionarLugar(st);
  }

  function aoSoltar(ev) {
    var st = ARR;
    if (!st || ev.pointerId !== st.idPonteiro) return;
    limparOuvintes();
    clearTimeout(st.timer);
    if (!st.ativo) { ARR = null; return; }
    terminarArrasto(st, false);
  }

  function aoCancelar(ev) {
    var st = ARR;
    if (!st || ev.pointerId !== st.idPonteiro) return;
    limparOuvintes();
    clearTimeout(st.timer);
    if (st.ativo) terminarArrasto(st, true); else ARR = null;
  }

  function terminarArrasto(st, cancelar) {
    cancelAnimationFrame(st.raf);
    if (st.fantasma) st.fantasma.remove();
    st.el.classList.remove('lugar');
    document.body.classList.remove('arrastando');
    ARR = null;
    S.arrastando = false;
    ignorarCliqueAte = Date.now() + 60;
    if (cancelar) {
      if (st.origemPai) st.origemPai.insertBefore(st.el, st.origemProx);
      return;
    }
    if (st.el.parentNode === st.origemPai && st.el.nextSibling === st.origemProx) return;
    if (st.tipo === 'cartao') soltarCartao(st); else soltarLista(st);
  }

  function ordemEntre(irmaos, proximoId) {
    var idx = proximoId ? irmaos.map(function (x) { return x.id; }).indexOf(proximoId) : -1;
    if (idx === -1) idx = irmaos.length;
    var ant = idx > 0 ? irmaos[idx - 1].ordem : null;
    var prox = idx < irmaos.length ? irmaos[idx].ordem : null;
    if (ant === null && prox === null) return 1000;
    if (ant === null) return prox - 1000;
    if (prox === null) return ant + 1000;
    return (ant + prox) / 2;
  }

  function soltarCartao(st) {
    var id = st.el.getAttribute('data-id');
    var listaId = st.el.parentNode.getAttribute('data-lista');
    var prox = st.el.nextElementSibling;
    var proximoId = prox ? prox.getAttribute('data-id') : null;
    var c = cartao(id);
    if (!c || !listaId) { renderListas(); return; }
    var listaAntes = c.listaId;
    var irmaos = cartoesDaLista(listaId).filter(function (x) { return x.id !== id; });
    c.listaId = listaId;
    c.ordem = ordemEntre(irmaos, proximoId);
    renderListas();
    if (listaAntes !== listaId) avisarLimite(listaId);
    if (S.cartaoAberto === id) { var gl = $('#g-lista'); if (gl) gl.value = listaId; }
    escrever('moverCartao', id, listaId, proximoId).then(function (r) {
      c.ordem = r.ordem;
      aplicarRenumerados(r);
      aplicarDistribuicao(c, r);
    }).catch(falhou);
  }

  function soltarLista(st) {
    var id = st.el.getAttribute('data-id');
    var prox = st.el.nextElementSibling;
    var proximoId = prox && prox.classList.contains('lista') ? prox.getAttribute('data-id') : null;
    var l = lista(id);
    if (!l) { renderListas(); return; }
    var irmas = S.quadro.listas.filter(function (x) { return x.id !== id; });
    l.ordem = ordemEntre(irmas, proximoId);
    S.quadro.listas.sort(function (a, b) { return a.ordem - b.ordem; });
    renderListas();
    escrever('moverLista', id, proximoId).then(function (r) {
      l.ordem = r.ordem;
      aplicarRenumerados(r);
      S.quadro.listas.sort(function (a, b) { return a.ordem - b.ordem; });
    }).catch(falhou);
  }
