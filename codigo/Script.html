  /* ---------- Salvar campos do cartão ---------- */
  function salvarCartao(id, campos, op) {
    op = op || {};
    var c = cartao(id);
    if (!c) return Promise.resolve();
    Object.keys(campos).forEach(function (k) { if (k !== 'extras') c[k] = campos[k]; });
    if (campos.extras) { c.extras = c.extras || {}; Object.keys(campos.extras).forEach(function (k) { c.extras[k] = campos.extras[k]; }); }
    if (campos.concluido !== undefined) c.concluidoEm = campos.concluido ? agoraIso() : '';
    renderListas();
    if (op.props && S.cartaoAberto === id) renderSecaoProps();
    return escrever('atualizarCartao', id, campos).then(function (r) {
      ['atualizadoEm', 'atualizadoPor', 'concluidoEm'].forEach(function (k) { c[k] = r.cartao[k]; });
      if (S.cartaoAberto === id) { renderPeGaveta(); if (campos.concluido !== undefined) renderSecaoProps(); }
      return r;
    }).catch(falhou);
  }

  function salvarTitulo(valor) {
    var c = cartao(S.cartaoAberto);
    if (!c || !S.quadro.podeEditar) return;
    var t = String(valor || '').replace(/\s+/g, ' ').trim();
    if (!t) { var el = $('#g-titulo'); if (el) el.value = c.titulo; return; }
    if (t === c.titulo) return;
    salvarCartao(c.id, { titulo: t });
  }
  function salvarDescricao(valor) {
    var c = cartao(S.cartaoAberto);
    if (!c || !S.quadro.podeEditar) return;
    if (valor === c.descricao) return;
    var dica = $('#g-desc-dica');
    if (dica) dica.textContent = 'Salvando…';
    var desc = $('#g-descricao');
    salvarCartao(c.id, { descricao: valor }).then(function () {
      if (desc) desc.removeAttribute('data-sujo');
      var d2 = $('#g-desc-dica');
      if (d2) d2.textContent = 'Descrição salva.';
    });
  }
  function salvarExtra(cab, valor) {
    var c = cartao(S.cartaoAberto);
    if (!c || !S.quadro.podeEditar) return;
    if (String((c.extras || {})[cab] || '') === valor) return;
    var x = {};
    x[cab] = valor;
    salvarCartao(c.id, { extras: x });
  }

  function moverPelaGaveta(novaLista) {
    var c = cartao(S.cartaoAberto);
    if (!c || c.listaId === novaLista) return;
    c.listaId = novaLista;
    c.ordem = maiorOrdem(novaLista) + 1000;
    renderListas();
    var g = $('.gaveta');
    if (g) g.style.setProperty('--espectro', corEspectro(indiceLista(novaLista)));
    avisarLimite(novaLista);
    escrever('moverCartao', c.id, novaLista, null).then(function (r) { c.ordem = r.ordem; aplicarRenumerados(r); aplicarDistribuicao(c, r); }).catch(falhou);
  }

  function aplicarRenumerados(r) {
    var ren = (r && r.renumerados) || {};
    Object.keys(ren).forEach(function (k) {
      var x = cartao(k) || lista(k);
      if (x) x.ordem = ren[k];
    });
  }

  function arquivarCartao(id) {
    var c = cartao(id);
    if (!c) return;
    var pos = S.quadro.cartoes.indexOf(c);
    S.quadro.cartoes.splice(pos, 1);
    if (S.cartaoAberto === id) { S.cartaoAberto = null; $('#gaveta-raiz').innerHTML = ''; }
    renderListas();
    escrever('arquivarCartao', id, true).then(function () {
      aviso('Cartão arquivado.', { acao: { rotulo: 'Desfazer', fn: function () {
        escrever('arquivarCartao', id, false).then(function (r) {
          var volta = r.cartao;
          volta.comentarios = c.comentarios;
          volta.checklist = c.checklist;
          S.quadro.cartoes.push(volta);
          renderListas();
        }).catch(falhou);
      } } });
    }).catch(function (e) { S.quadro.cartoes.push(c); renderListas(); falhou(e); });
  }

  var duplicando = false;
  function duplicarCartao(id) {
    var c = cartao(id);
    if (!c || duplicando) return;
    var quadroId = S.quadro.quadro.id;
    duplicando = true;
    escrever('duplicarCartao', id).then(function (r) {
      duplicando = false;
      if (!S.quadro || S.view !== 'quadro' || S.quadro.quadro.id !== quadroId) return;
      aplicarRenumerados(r);
      var nova = r.cartao;
      S.quadro.cartoes.push(nova);
      S.quadro.checklists[nova.id] = r.checklist || [];
      renderListas();
      avisarLimite(nova.listaId);
      aviso('Cartão duplicado.', { acao: { rotulo: 'Abrir cópia', fn: function () { abrirCartao(nova.id); } } });
    }).catch(function (e) { duplicando = false; falhou(e); });
  }

  /* ---------- Carrossel (rodízio dentro do cartão) ---------- */
  function renderSecaoCarrossel() {
    var el = $('#g-carrossel');
    var c = cartao(S.cartaoAberto);
    if (!el || !c) return;
    var ed = S.quadro.podeEditar;
    var d = S.detalhe;
    var itens = d && d.carrossel;
    var rascunho = { pessoa: ($('#car-pessoa') || {}).value || '', texto: ($('#car-texto') || {}).value || '', foco: document.activeElement && document.activeElement.id };
    if (!itens) {
      el.innerHTML = c.carrossel
        ? '<h3>Carrossel <span class="conta">' + plural(c.carrossel.total, 'pessoa', 'pessoas') + '</span></h3><p class="texto-suave">' + (d && d.erro ? 'Não foi possível carregar a fila.' : 'Carregando a fila…') + '</p>'
        : '';
      return;
    }
    if (!itens.length && !ed) { el.innerHTML = ''; return; }
    if (!itens.length && !S.carrosselAberto) {
      el.innerHTML = '<h3>Carrossel</h3><p class="ajuda">Rodízio de pessoas dentro do cartão, bom para revezar ligações. Quem atende marca <b>Atendi</b> e vai para o fim da fila; o primeiro da fila é a pessoa da vez.</p>' +
        '<button type="button" class="btn" data-acao="carrossel-iniciar">' + I.carrossel + 'Transformar em carrossel</button>';
      return;
    }
    var html = '<h3>Carrossel <span class="conta">' + plural(itens.length, 'pessoa', 'pessoas') + '</span></h3>';
    if (itens.length) {
      html += '<p class="vez-agora">Na vez agora ' + avatar(itens[0].pessoa, true) + '<b>' + esc(itens[0].pessoa) + '</b>' + (itens[0].texto ? '<span class="texto-suave">' + esc(itens[0].texto) + '</span>' : '') + '</p>';
      html += '<ol class="car-lista">' + itens.map(function (i, n) {
        var pend = !!i.pendente;
        var info = i.atendimentos ? plural(i.atendimentos, 'atendimento', 'atendimentos') + (i.ultimoEm ? ' · último ' + esc(dataHora(i.ultimoEm)) : '') : 'Ainda não atendeu';
        return '<li class="car-item' + (n === 0 ? ' na-vez' : '') + '" data-car="' + esc(i.id) + '">' +
          '<label class="car-atendi" title="Marque quando atender: a pessoa vai para o fim da fila"><input type="checkbox" data-acao="carrossel-atendi" data-id="' + esc(i.id) + '"' + (ed && !pend ? '' : ' disabled') + ' aria-label="Atendi: ' + esc(i.pessoa) + '"><span>Atendi</span></label>' +
          '<span class="car-pos">' + (n + 1) + 'º</span>' +
          '<span class="car-corpo"><span class="car-nome"><b>' + esc(i.pessoa) + '</b>' + (n === 0 ? '<span class="chip chip-vez">Na vez</span>' : '') + '</span>' +
          (i.texto ? '<span class="car-texto">' + esc(i.texto) + '</span>' : '') + '<small>' + info + '</small></span>' +
          (ed && !pend ? '<span class="car-acoes">' + (n > 0 ? '<button type="button" class="icone-btn" data-acao="carrossel-na-vez" data-id="' + esc(i.id) + '" aria-label="Colocar ' + esc(i.pessoa) + ' na vez" title="Colocar na vez">' + I.seta + '</button>' : '') +
            '<button type="button" class="icone-btn" data-acao="carrossel-editar" data-id="' + esc(i.id) + '" aria-label="Editar ' + esc(i.pessoa) + '" title="Editar">' + I.lapis + '</button>' +
            '<button type="button" class="icone-btn" data-acao="carrossel-remover" data-id="' + esc(i.id) + '" aria-label="Tirar ' + esc(i.pessoa) + ' do carrossel" title="Tirar do carrossel">' + I.lixo + '</button></span>' : '') +
          '</li>';
      }).join('') + '</ol>';
    }
    if (ed) {
      var jaNaFila = itens.map(function (i) { return norm(i.pessoa); });
      html += '<form class="form-carrossel" data-form="carrossel-novo"><input type="text" id="car-pessoa" list="car-sugestoes" placeholder="Nome" maxlength="80" autocomplete="off" aria-label="Nome de quem entra no carrossel">' +
        '<datalist id="car-sugestoes">' + S.usuarios.filter(function (u) { return jaNaFila.indexOf(norm(u.nome)) === -1; }).map(function (u) { return '<option value="' + esc(u.nome) + '"></option>'; }).join('') + '</datalist>' +
        '<input type="text" id="car-texto" placeholder="Texto (ex.: ramal, observação)" maxlength="300" aria-label="Texto da pessoa">' +
        '<button type="submit" class="btn">Adicionar</button></form>' +
        '<button type="button" class="btn sutil pequeno" data-acao="carrossel-equipe">' + I.equipe + 'Adicionar toda a equipe do quadro</button>';
    }
    el.innerHTML = html;
    // Quem está digitando o próximo nome não pode perder o texto quando a resposta do servidor redesenha a seção.
    var campoP = $('#car-pessoa'), campoT = $('#car-texto');
    if (campoP && rascunho.pessoa) campoP.value = rascunho.pessoa;
    if (campoT && rascunho.texto) campoT.value = rascunho.texto;
    if (rascunho.foco === 'car-pessoa' || rascunho.foco === 'car-texto') {
      var f = $('#' + rascunho.foco);
      if (f) { f.focus(); try { var n = f.value.length; f.setSelectionRange(n, n); } catch (err) { /* ok */ } }
    }
  }

  function aplicarCarrossel(id, r) {
    var c = cartao(id);
    if (c) c.carrossel = r.resumo || null;
    if (S.cartaoAberto === id && S.detalhe) { S.detalhe.carrossel = r.itens; renderSecaoCarrossel(); }
    renderListas();
  }
  /* A resposta do servidor só vale quando não há mais nada na fila de gravação (evita a tela pular para trás). */
  function sincronizarCarrossel(id, r) {
    setTimeout(function () { if (S.quadro && !pendentes) aplicarCarrossel(id, r); }, 0);
  }
  function falhouCarrossel(id) {
    return function (e) {
      falhou(e);
      if (S.cartaoAberto === id) carregarDetalhe(id);
    };
  }

  function carrosselAtendi(itemId) {
    var id = S.cartaoAberto;
    var itens = S.detalhe && S.detalhe.carrossel;
    var c = cartao(id);
    if (!id || !itens || !c) return;
    var i = itens.map(function (x) { return x.id; }).indexOf(itemId);
    if (i === -1) return;
    var p = itens[i];
    itens.splice(i, 1);
    p.atendimentos = (p.atendimentos || 0) + 1;
    itens.push(p);
    c.carrossel = { total: itens.length, vez: itens[0].pessoa };
    renderSecaoCarrossel();
    renderListas();
    escrever('passarVezCarrossel', itemId).then(function (r) {
      sincronizarCarrossel(id, r);
      aviso(p.pessoa + ' foi para o fim da fila.' + (r.resumo && itens.length > 1 ? ' Na vez: ' + r.resumo.vez + '.' : ''), { acao: { rotulo: 'Desfazer', fn: function () {
        escrever('reordenarCarrossel', id, r.antes, itemId).then(function (r2) { sincronizarCarrossel(id, r2); }).catch(falhouCarrossel(id));
      } } });
    }).catch(falhouCarrossel(id));
  }

  function carrosselAdicionar(pessoa, texto) {
    var id = S.cartaoAberto;
    var itens = S.detalhe && S.detalhe.carrossel;
    var c = cartao(id);
    pessoa = String(pessoa || '').trim();
    texto = String(texto || '').trim();
    var campo = $('#car-pessoa');
    if (!id || !itens || !c || !pessoa) { if (campo) campo.focus(); return; }
    if (itens.some(function (i) { return norm(i.pessoa) === norm(pessoa); })) { aviso(pessoa + ' já está neste carrossel.', { erro: true }); if (campo) campo.focus(); return; }
    var tmp = { id: 'tmp-' + Date.now(), pessoa: pessoa, texto: texto, ordem: 1e12, atendimentos: 0, ultimoEm: '', ultimoPor: '', pendente: true };
    itens.push(tmp);
    c.carrossel = { total: itens.length, vez: itens[0].pessoa };
    if ($('#car-pessoa')) $('#car-pessoa').value = '';
    if ($('#car-texto')) $('#car-texto').value = '';
    renderSecaoCarrossel();
    renderListas();
    escrever('adicionarParticipante', id, pessoa, texto).then(function (r) {
      sincronizarCarrossel(id, r);
    }).catch(function (e) {
      var atual = S.detalhe && S.detalhe.carrossel;
      if (atual && S.cartaoAberto === id) { S.detalhe.carrossel = atual.filter(function (i) { return i !== tmp; }); }
      c.carrossel = S.detalhe && S.detalhe.carrossel && S.detalhe.carrossel.length ? { total: S.detalhe.carrossel.length, vez: S.detalhe.carrossel[0].pessoa } : null;
      if (S.cartaoAberto === id) renderSecaoCarrossel();
      renderListas();
      falhou(e);
    });
  }

  function carrosselEquipe() {
    var id = S.cartaoAberto;
    if (!id) return;
    escrever('adicionarEquipeCarrossel', id).then(function (r) {
      aplicarCarrossel(id, r);
      aviso(plural(r.adicionados, 'pessoa entrou', 'pessoas entraram') + ' no carrossel.');
    }).catch(function (e) { aviso(msgErro(e), { erro: true }); });
  }

  function carrosselNaVez(itemId) {
    var id = S.cartaoAberto;
    escrever('colocarNaVezCarrossel', itemId).then(function (r) { aplicarCarrossel(id, r); }).catch(falhouCarrossel(id));
  }

  function carrosselRemover(itemId) {
    var id = S.cartaoAberto;
    var itens = (S.detalhe && S.detalhe.carrossel) || [];
    var p = itens.filter(function (x) { return x.id === itemId; })[0];
    if (!p) return;
    confirmarAcao({ titulo: 'Tirar ' + p.pessoa + ' do carrossel?', texto: 'A pessoa sai da fila. O histórico do cartão continua guardado.', confirmar: 'Tirar' }).then(function (ok) {
      if (!ok) return;
      escrever('removerParticipante', itemId).then(function (r) { aplicarCarrossel(id, r); }).catch(falhouCarrossel(id));
    });
  }

  function carrosselEditar(itemId) {
    var id = S.cartaoAberto;
    var p = ((S.detalhe && S.detalhe.carrossel) || []).filter(function (x) { return x.id === itemId; })[0];
    if (!p) return;
    var m = abrirModal('<form data-form="pedir"><div class="modal-cabeca"><h2 id="modal-titulo">Editar participante</h2></div>' +
      '<div class="modal-corpo"><div class="campo"><label for="cp-nome">Nome</label><input id="cp-nome" type="text" value="' + esc(p.pessoa) + '" maxlength="80" autofocus></div>' +
      '<div class="campo"><label for="cp-texto">Texto</label><input id="cp-texto" type="text" value="' + esc(p.texto) + '" maxlength="300"><span class="ajuda">Aparece ao lado do nome, por exemplo o ramal ou um aviso.</span></div></div>' +
      '<div class="modal-rodape"><div class="direita"><button type="button" class="btn sutil" data-acao="fechar-modal">Cancelar</button><button type="submit" class="btn primario">Salvar</button></div></div></form>');
    m.querySelector('form').addEventListener('submit', function (ev) {
      ev.preventDefault();
      var dados = { pessoa: $('#cp-nome').value.trim(), texto: $('#cp-texto').value.trim() };
      if (!dados.pessoa) { $('#cp-nome').focus(); return; }
      var b = m.querySelector('button[type="submit"]');
      b.disabled = true;
      escrever('atualizarParticipante', itemId, dados).then(function (r) { fecharModal(); aplicarCarrossel(id, r); })
        .catch(function (e) { b.disabled = false; aviso(msgErro(e), { erro: true }); });
    });
  }

  /* ---------- Listas de rodízio: rotatividade semanal e recorrente ---------- */
  function htmlListaRodizio(l, i) {
    var Q = S.quadro;
    var ed = Q.podeEditar;
    var rot = l.tipo === 'Rotativa';
    var itens = ((rot ? Q.rotativas : Q.recorrentes) || {})[l.id] || [];
    var nome = S.editandoLista === l.id
      ? '<input class="lista-nome-input" id="lista-nome-' + esc(l.id) + '" data-lista-nome="' + esc(l.id) + '" value="' + esc(l.nome) + '" maxlength="80" aria-label="Nome da lista">'
      : (ed
        ? '<h2 class="lista-nome editavel-nome" role="button" tabindex="0" data-acao="renomear-lista" data-id="' + esc(l.id) + '" title="Clique para renomear, arraste para mover">' + esc(l.nome) + '</h2>'
        : '<h2 class="lista-nome">' + esc(l.nome) + '</h2>');
    return '<section class="lista lista-rodizio ' + (rot ? 'lista-rotativa' : 'lista-recorrente') + '" data-id="' + esc(l.id) + '" style="--espectro:' + corEspectro(i) + '" aria-label="Lista ' + esc(l.nome) + '">' +
      '<header class="lista-cabeca">' + nome + '<span class="lista-conta" title="' + (rot ? 'Tarefas' : 'Pessoas na fila') + '">' + itens.length + '</span>' +
      (ed ? '<button type="button" class="icone-btn" data-acao="menu-lista" data-id="' + esc(l.id) + '" aria-label="Opções da lista ' + esc(l.nome) + '">' + I.pontos + '</button>' : '') +
      '</header><p class="lista-tipo">' + (rot ? I.rotina + 'Rotatividade semanal' : I.carrossel + 'Lista recorrente') + '</p>' +
      (rot ? htmlCorpoRotativa(l, itens) : htmlCorpoRecorrente(l, itens)) + '</section>';
  }

  /* --- Rotatividade semanal --- */
  function semanaRot(listaId) { return (S.rotSemana && S.rotSemana[listaId]) || 'atual'; }

  function htmlCorpoRotativa(l, tarefas) {
    var ed = S.quadro.podeEditar;
    var sem = semanaRot(l.id);
    var seg = semanaDe(hojeIso());
    var ini = sem === 'proxima' ? somaDias(seg, 7) : seg;
    var topo = '<div class="rot-topo"><div class="segmentado" role="group" aria-label="Semana">' +
      '<button type="button" data-acao="rot-semana" data-lista="' + esc(l.id) + '" data-valor="atual" aria-pressed="' + (sem === 'atual') + '">Esta semana</button>' +
      '<button type="button" data-acao="rot-semana" data-lista="' + esc(l.id) + '" data-valor="proxima" aria-pressed="' + (sem === 'proxima') + '">Próxima</button></div>' +
      '<span class="texto-suave">' + dataBr(ini) + ' a ' + dataBr(somaDias(ini, 4)) + '</span></div>';
    var linhas = tarefas.map(function (t) {
      var w = t[sem];
      var outra = sem === 'atual' ? t.proxima : t.atual;
      var nomes = t.pessoas.slice();
      S.usuarios.forEach(function (u) { if (nomes.map(norm).indexOf(norm(u.nome)) === -1) nomes.push(u.nome); });
      if (w.pessoa && nomes.map(norm).indexOf(norm(w.pessoa)) === -1) nomes.push(w.pessoa);
      var resp = ed
        ? '<select class="rot-select' + (w.trocado ? ' trocado' : '') + '" data-rot-troca="' + esc(t.id) + '" data-semana="' + sem + '" aria-label="Quem cuida de ' + esc(t.tarefa) + '">' +
          nomes.map(function (n, k) { return (k === t.pessoas.length && k < nomes.length ? '<option disabled>──────────</option>' : '') + '<option value="' + esc(n) + '"' + (norm(n) === norm(w.pessoa) ? ' selected' : '') + '>' + esc(n) + '</option>'; }).join('') + '</select>'
        : '<b>' + esc(w.pessoa || 'Ninguém') + '</b>';
      return '<div class="rot-item" data-tarefa="' + esc(t.id) + '">' +
        '<div class="rot-linha1"><b class="rot-nome">' + esc(t.tarefa) + '</b><span class="chip" title="Repete todo dia útil">Diária</span>' +
        (ed ? '<span class="rot-acoes"><button type="button" class="icone-btn" data-acao="rot-editar" data-lista="' + esc(l.id) + '" data-id="' + esc(t.id) + '" aria-label="Editar ' + esc(t.tarefa) + '" title="Editar tarefa">' + I.lapis + '</button>' +
          '<button type="button" class="icone-btn" data-acao="rot-remover" data-id="' + esc(t.id) + '" aria-label="Remover ' + esc(t.tarefa) + '" title="Remover tarefa">' + I.lixo + '</button></span>' : '') + '</div>' +
        (t.texto ? '<p class="rot-texto">' + esc(t.texto) + '</p>' : '') +
        '<div class="rot-resp">' + avatar(w.pessoa || '?', true) + resp + '</div>' +
        '<p class="rot-meta">' + (w.trocado ? 'Trocado nesta semana (o rodízio indica ' + esc(w.doRodizio) + '). ' + (ed ? '<button type="button" class="link-texto" data-acao="rot-voltar" data-id="' + esc(t.id) + '" data-semana="' + sem + '">Voltar ao rodízio</button>' : '') : '') +
        (t.modo === 'Fixo' ? 'Nome fixo.' : (sem === 'atual' ? 'Próxima semana: ' : 'Esta semana: ') + '<b>' + esc(outra.pessoa || '—') + '</b>') + '</p></div>';
    }).join('');
    return '<div class="rot-corpo">' + topo + (linhas || '<p class="lista-vazia-dica">Nenhuma tarefa ainda.</p>') + '</div>' +
      (ed ? '<div class="lista-pe"><button type="button" class="lista-adicionar" data-acao="rot-nova" data-lista="' + esc(l.id) + '">' + I.mais + 'Adicionar tarefa</button></div>' : '');
  }

  function rotTarefa(listaId, id) {
    return (((S.quadro.rotativas || {})[listaId]) || []).filter(function (t) { return t.id === id; })[0] || null;
  }
  function listaDaTarefa(id) {
    var k = Object.keys(S.quadro.rotativas || {});
    for (var i = 0; i < k.length; i++) if (S.quadro.rotativas[k[i]].some(function (t) { return t.id === id; })) return k[i];
    return '';
  }
  function sincronizarRot(listaId, r) {
    setTimeout(function () { if (S.quadro && !pendentes) { S.quadro.rotativas[listaId] = r.tarefas; renderListas(); } }, 0);
  }

  function trocarRotativa(id, sem, nome) {
    var lid = listaDaTarefa(id);
    var t = lid ? rotTarefa(lid, id) : null;
    if (!t) return;
    var w = t[sem];
    var antes = { pessoa: w.pessoa, trocado: w.trocado };
    w.pessoa = nome || w.doRodizio;
    w.trocado = !!nome && norm(nome) !== norm(w.doRodizio);
    renderListas();
    escrever('trocarResponsavelRotativa', id, sem, nome).then(function (r) { sincronizarRot(lid, r); })
      .catch(function (e) { w.pessoa = antes.pessoa; w.trocado = antes.trocado; renderListas(); falhou(e); });
  }

  function removerTarefaRot(id) {
    var lid = listaDaTarefa(id);
    var t = lid ? rotTarefa(lid, id) : null;
    if (!t) return;
    confirmarAcao({ titulo: 'Remover a tarefa "' + t.tarefa + '"?', texto: 'Ela sai da lista. O histórico fica guardado.', confirmar: 'Remover' }).then(function (ok) {
      if (!ok) return;
      escrever('removerTarefaRotativa', id).then(function (r) { S.quadro.rotativas[lid] = r.tarefas; renderListas(); }).catch(falhou);
    });
  }

  function modalTarefaRot(listaId, tarefaId) {
    var t = tarefaId ? rotTarefa(listaId, tarefaId) : null;
    var pessoas = t ? t.pessoas.slice() : [];
    var inicio = t ? t.atual.pessoa : '';
    var m = abrirModal('<form data-form="pedir"><div class="modal-cabeca"><h2 id="modal-titulo">' + (t ? 'Editar tarefa' : 'Nova tarefa') + '</h2>' +
      '<p>A tarefa se repete todo dia útil. Escolha quem cuida dela e se o nome gira a cada semana.</p></div>' +
      '<div class="modal-corpo">' +
      '<div class="campo"><label for="tr-nome">Tarefa</label><input id="tr-nome" type="text" maxlength="120" value="' + esc(t ? t.tarefa : '') + '" placeholder="Ex.: Abrir a fila às 8h" autofocus></div>' +
      '<div class="campo"><label for="tr-texto">Observação (opcional)</label><input id="tr-texto" type="text" maxlength="300" value="' + esc(t ? t.texto : '') + '"></div>' +
      '<div class="campo"><span class="rotulo">Como o nome muda</span>' +
      '<label class="opcao-radio"><input type="radio" name="tr-modo" value="Girar"' + (!t || t.modo !== 'Fixo' ? ' checked' : '') + '><strong>Girar toda semana</strong><small>Na segunda, a tarefa passa para a próxima pessoa da ordem.</small></label>' +
      '<label class="opcao-radio"><input type="radio" name="tr-modo" value="Fixo"' + (t && t.modo === 'Fixo' ? ' checked' : '') + '><strong>Manter o mesmo nome</strong><small>A pessoa escolhida cuida da tarefa toda semana.</small></label></div>' +
      '<div class="campo"><span class="rotulo">Pessoas, na ordem do rodízio</span><div id="tr-pessoas"></div>' +
      '<div class="form-carrossel"><select id="tr-add" aria-label="Escolher pessoa"></select><button type="button" class="btn" data-tr="add">Adicionar</button></div>' +
      '<div class="form-carrossel"><input type="text" id="tr-livre" maxlength="80" placeholder="Ou digite outro nome" aria-label="Outro nome"><button type="button" class="btn" data-tr="livre">Adicionar</button></div></div>' +
      '<div class="campo"><label for="tr-inicio">Quem cuida desta semana</label><select id="tr-inicio"></select></div>' +
      '</div><div class="modal-rodape"><div class="direita"><button type="button" class="btn sutil" data-acao="fechar-modal">Cancelar</button><button type="submit" class="btn primario">Salvar</button></div></div></form>');
    function desenhar() {
      $('#tr-pessoas').innerHTML = pessoas.length ? '<ol class="car-lista">' + pessoas.map(function (n, k) {
        return '<li class="car-item"><span class="car-pos">' + (k + 1) + 'º</span>' + avatar(n, true) + '<span class="car-corpo"><b>' + esc(n) + '</b></span><span class="car-acoes">' +
          '<button type="button" class="icone-btn" data-tr="subir" data-i="' + k + '" aria-label="Subir ' + esc(n) + '"' + (k === 0 ? ' disabled' : '') + '>' + I.seta + '</button>' +
          '<button type="button" class="icone-btn descer" data-tr="descer" data-i="' + k + '" aria-label="Descer ' + esc(n) + '"' + (k === pessoas.length - 1 ? ' disabled' : '') + '>' + I.seta + '</button>' +
          '<button type="button" class="icone-btn" data-tr="tirar" data-i="' + k + '" aria-label="Tirar ' + esc(n) + '">' + I.lixo + '</button></span></li>';
      }).join('') + '</ol>' : '<p class="texto-suave">Ninguém ainda.</p>';
      $('#tr-add').innerHTML = '<option value="">Escolher pessoa…</option>' + S.usuarios.filter(function (u) { return pessoas.map(norm).indexOf(norm(u.nome)) === -1; })
        .map(function (u) { return '<option value="' + esc(u.nome) + '">' + esc(u.nome) + '</option>'; }).join('');
      if (pessoas.map(norm).indexOf(norm(inicio)) === -1) inicio = pessoas[0] || '';
      $('#tr-inicio').innerHTML = pessoas.map(function (n) { return '<option value="' + esc(n) + '"' + (norm(n) === norm(inicio) ? ' selected' : '') + '>' + esc(n) + '</option>'; }).join('');
    }
    function incluir(nome) {
      nome = String(nome || '').replace(/[;,=]/g, ' ').replace(/\s+/g, ' ').trim();
      if (!nome) return;
      if (pessoas.map(norm).indexOf(norm(nome)) !== -1) { aviso(nome + ' já está na tarefa.', { erro: true }); return; }
      pessoas.push(nome);
      desenhar();
    }
    desenhar();
    m.addEventListener('change', function (ev) { if (ev.target.id === 'tr-inicio') inicio = ev.target.value; });
    m.addEventListener('click', function (ev) {
      var b = ev.target.closest('[data-tr]');
      if (!b) return;
      var acao = b.getAttribute('data-tr');
      var k = parseInt(b.getAttribute('data-i'), 10);
      if (acao === 'add') { incluir($('#tr-add').value); }
      else if (acao === 'livre') { incluir($('#tr-livre').value); $('#tr-livre').value = ''; }
      else if (acao === 'tirar') { pessoas.splice(k, 1); desenhar(); }
      else if (acao === 'subir' && k > 0) { pessoas.splice(k - 1, 0, pessoas.splice(k, 1)[0]); desenhar(); }
      else if (acao === 'descer' && k < pessoas.length - 1) { pessoas.splice(k + 1, 0, pessoas.splice(k, 1)[0]); desenhar(); }
    });
    m.addEventListener('keydown', function (ev) { if (ev.key === 'Enter' && ev.target.id === 'tr-livre') { ev.preventDefault(); incluir(ev.target.value); ev.target.value = ''; } });
    m.querySelector('form').addEventListener('submit', function (ev) {
      ev.preventDefault();
      var dados = { id: tarefaId || '', tarefa: $('#tr-nome').value.trim(), texto: $('#tr-texto').value.trim(), pessoas: pessoas, inicio: $('#tr-inicio').value,
        modo: (m.querySelector('input[name="tr-modo"]:checked') || {}).value || 'Girar' };
      if (!dados.tarefa) { $('#tr-nome').focus(); return; }
      if (!pessoas.length) { aviso('Escolha pelo menos uma pessoa para a tarefa.', { erro: true }); return; }
      var b = m.querySelector('button[type="submit"]');
      b.disabled = true;
      escrever('salvarTarefaRotativa', listaId, dados).then(function (r) { fecharModal(); S.quadro.rotativas[listaId] = r.tarefas; renderListas(); })
        .catch(function (e) { b.disabled = false; aviso(msgErro(e), { erro: true }); });
    });
  }

  /* --- Lista recorrente --- */
  function filaRec(listaId) { return ((S.quadro.recorrentes = S.quadro.recorrentes || {})[listaId] = S.quadro.recorrentes[listaId] || []); }
  function sincronizarRec(listaId, r) {
    setTimeout(function () { if (S.quadro && !pendentes) { S.quadro.recorrentes[listaId] = r.itens; renderListas(); } }, 0);
  }
  S.rascunhoRec = S.rascunhoRec || {};

  function htmlCorpoRecorrente(l, itens) {
    var ed = S.quadro.podeEditar;
    var lid = esc(l.id);
    var jaNaFila = itens.map(function (i) { return norm(i.pessoa); });
    var lista = itens.length
      ? '<p class="vez-agora">Na vez agora ' + avatar(itens[0].pessoa, true) + '<b>' + esc(itens[0].pessoa) + '</b>' + (itens[0].texto ? '<span class="texto-suave">' + esc(itens[0].texto) + '</span>' : '') + '</p>' +
        '<ol class="car-lista">' + itens.map(function (i, n) {
          var pend = !!i.pendente;
          var info = i.atendimentos ? plural(i.atendimentos, 'atendimento', 'atendimentos') : 'Ainda não atendeu';
          return '<li class="car-item' + (n === 0 ? ' na-vez' : '') + '">' +
            '<label class="car-atendi" title="Marque quando atender: a pessoa vai para o fim da fila"><input type="checkbox" data-acao="rec-atendi" data-lista="' + lid + '" data-id="' + esc(i.id) + '"' + (ed && !pend ? '' : ' disabled') + ' aria-label="Atendi: ' + esc(i.pessoa) + '"><span>Atendi</span></label>' +
            '<span class="car-pos">' + (n + 1) + 'º</span>' +
            '<span class="car-corpo"><span class="car-nome"><b>' + esc(i.pessoa) + '</b>' + (n === 0 ? '<span class="chip chip-vez">Na vez</span>' : '') + '</span>' +
            (i.texto ? '<span class="car-texto">' + esc(i.texto) + '</span>' : '') + '<small>' + info + '</small></span>' +
            (ed && !pend ? '<span class="car-acoes">' + (n > 0 ? '<button type="button" class="icone-btn" data-acao="rec-na-vez" data-lista="' + lid + '" data-id="' + esc(i.id) + '" aria-label="Colocar ' + esc(i.pessoa) + ' na vez" title="Colocar na vez">' + I.seta + '</button>' : '') +
              '<button type="button" class="icone-btn" data-acao="rec-editar" data-lista="' + lid + '" data-id="' + esc(i.id) + '" aria-label="Editar ' + esc(i.pessoa) + '" title="Editar">' + I.lapis + '</button>' +
              '<button type="button" class="icone-btn" data-acao="rec-remover" data-lista="' + lid + '" data-id="' + esc(i.id) + '" aria-label="Tirar ' + esc(i.pessoa) + ' da lista" title="Tirar da lista">' + I.lixo + '</button></span>' : '') +
            '</li>';
        }).join('') + '</ol>'
      : '<p class="lista-vazia-dica">Ninguém na fila ainda.</p>';
    var form = ed
      ? '<form class="form-carrossel" data-form="rec-novo" data-lista="' + lid + '"><input type="text" id="rec-pessoa-' + lid + '" data-rec-rascunho="pessoa:' + lid + '" list="rec-sug-' + lid + '" placeholder="Nome" maxlength="80" autocomplete="off" value="' + esc(S.rascunhoRec['pessoa:' + l.id] || '') + '" aria-label="Nome de quem entra na fila">' +
        '<datalist id="rec-sug-' + lid + '">' + S.usuarios.filter(function (u) { return jaNaFila.indexOf(norm(u.nome)) === -1; }).map(function (u) { return '<option value="' + esc(u.nome) + '"></option>'; }).join('') + '</datalist>' +
        '<input type="text" id="rec-texto-' + lid + '" data-rec-rascunho="texto:' + lid + '" placeholder="Texto (ex.: ramal)" maxlength="300" value="' + esc(S.rascunhoRec['texto:' + l.id] || '') + '" aria-label="Texto da pessoa">' +
        '<button type="submit" class="btn">Adicionar</button></form>' +
        '<button type="button" class="btn sutil pequeno" data-acao="rec-equipe" data-lista="' + lid + '">' + I.equipe + 'Adicionar toda a equipe do quadro</button>'
      : '';
    return '<div class="rec-corpo">' + lista + '</div>' + (form ? '<div class="lista-pe rec-pe">' + form + '</div>' : '');
  }

  function recAtendi(listaId, itemId) {
    var itens = filaRec(listaId);
    var i = itens.map(function (x) { return x.id; }).indexOf(itemId);
    if (i === -1) return;
    var p = itens.splice(i, 1)[0];
    p.atendimentos = (p.atendimentos || 0) + 1;
    itens.push(p);
    renderListas();
    escrever('passarVezLista', itemId).then(function (r) {
      sincronizarRec(listaId, r);
      aviso(p.pessoa + ' foi para o fim da fila.' + (r.itens.length > 1 ? ' Na vez: ' + r.itens[0].pessoa + '.' : ''), { acao: { rotulo: 'Desfazer', fn: function () {
        escrever('reordenarLista', listaId, r.antes, itemId).then(function (r2) { sincronizarRec(listaId, r2); }).catch(falhou);
      } } });
    }).catch(falhou);
  }

  function recAdicionar(listaId, pessoa, texto) {
    pessoa = String(pessoa || '').trim();
    texto = String(texto || '').trim();
    var itens = filaRec(listaId);
    var campo = $('#rec-pessoa-' + listaId);
    if (!pessoa) { if (campo) campo.focus(); return; }
    if (itens.some(function (i) { return norm(i.pessoa) === norm(pessoa); })) { aviso(pessoa + ' já está nesta lista.', { erro: true }); if (campo) campo.focus(); return; }
    var tmp = { id: 'tmp-' + Date.now(), pessoa: pessoa, texto: texto, ordem: 1e12, atendimentos: 0, pendente: true };
    itens.push(tmp);
    S.rascunhoRec['pessoa:' + listaId] = '';
    S.rascunhoRec['texto:' + listaId] = '';
    renderListas();
    var depois = $('#rec-pessoa-' + listaId);
    if (depois) depois.focus();
    escrever('adicionarPessoaLista', listaId, pessoa, texto).then(function (r) { sincronizarRec(listaId, r); })
      .catch(function (e) { S.quadro.recorrentes[listaId] = filaRec(listaId).filter(function (i) { return i !== tmp; }); renderListas(); falhou(e); });
  }

  function recEquipe(listaId) {
    escrever('adicionarEquipeLista', listaId).then(function (r) {
      S.quadro.recorrentes[listaId] = r.itens; renderListas();

  /* ---------- Checklist ---------- */
  function contarChecklist(cartaoId) {
    var c = cartao(cartaoId);
    if (!c) return;
    var itens = S.quadro.checklists[cartaoId] || [];
    c.checklist = { feitos: itens.filter(function (i) { return i.feito; }).length, total: itens.length };
  }
  function itemPorId(id) {
    var c = S.quadro.checklists[S.cartaoAberto] || [];
    return c.filter(function (i) { return i.id === id; })[0] || null;
  }
  function adicionarItem(texto) {
    var id = S.cartaoAberto;
    texto = String(texto || '').trim();
    if (!texto || !id) return;
    var tmp = { id: 'tmp-' + Date.now(), cartaoId: id, texto: texto, feito: false, ordem: 1e12, pendente: true };
    (S.quadro.checklists[id] = S.quadro.checklists[id] || []).push(tmp);
    S.rascunho.item = '';
    contarChecklist(id);
    renderSecaoChecklist();
    renderListas();
    var inp = $('#g-item-novo');
    if (inp) inp.focus();
    escrever('adicionarItemChecklist', id, texto).then(function (r) {
      Object.keys(r.item).forEach(function (k) { tmp[k] = r.item[k]; });
      tmp.pendente = false;
      if (S.cartaoAberto === id && !S.editandoItem) {
        var foco = document.activeElement && document.activeElement.id;
        var valor = $('#g-item-novo') ? $('#g-item-novo').value : '';
        S.rascunho.item = valor;
        renderSecaoChecklist();
        if (foco === 'g-item-novo') { var i2 = $('#g-item-novo'); if (i2) i2.focus(); }
      }
    }).catch(function (e) {
      S.quadro.checklists[id] = (S.quadro.checklists[id] || []).filter(function (i) { return i !== tmp; });
      contarChecklist(id);
      if (S.cartaoAberto === id) renderSecaoChecklist();
      falhou(e);
    });
  }
  function marcarItem(itemId, feito) {
    var it = itemPorId(itemId);
    if (!it || it.pendente) { renderSecaoChecklist(); return; }
    it.feito = feito;
    contarChecklist(S.cartaoAberto);
    renderSecaoChecklist();
    renderListas();
    escrever('atualizarItemChecklist', itemId, { feito: feito }).catch(falhou);
  }
  function removerItem(itemId) {
    var id = S.cartaoAberto;
    var it = itemPorId(itemId);
    if (!it || it.pendente) return;
    S.quadro.checklists[id] = S.quadro.checklists[id].filter(function (i) { return i !== it; });
    contarChecklist(id);
    renderSecaoChecklist();
    renderListas();
    escrever('removerItemChecklist', itemId).catch(falhou);
  }
  function salvarTextoItem(itemId, texto) {
    var it = itemPorId(itemId);
    S.editandoItem = null;
    texto = String(texto || '').trim();
    if (!it || !texto || texto === it.texto) { renderSecaoChecklist(); return; }
    it.texto = texto;
    renderSecaoChecklist();
    escrever('atualizarItemChecklist', itemId, { texto: texto }).catch(falhou);
  }

  /* ---------- Comentários ---------- */
  function comentar(texto) {
    var id = S.cartaoAberto;
    texto = String(texto || '').trim();
    if (!texto || !id) return;
    var botao = $('[data-form="comentar"] button[type="submit"]');
    if (botao) botao.disabled = true;
    escrever('adicionarComentario', id, texto).then(function (r) {
      var c = cartao(id);
      if (c) c.comentarios = (c.comentarios || 0) + 1;
      renderListas();
      if (S.cartaoAberto !== id) return;
      S.rascunho.comentario = '';
      if (S.detalhe) S.detalhe.comentarios.unshift(r.comentario);
      renderSecaoComentarios();
    }).catch(function (e) {
      if (botao) botao.disabled = false;
      falhou(e);
    });
  }
  function removerComentario(comId) {
    var id = S.cartaoAberto;
    escrever('removerComentario', comId).then(function () {
      var c = cartao(id);
      if (c) c.comentarios = Math.max(0, (c.comentarios || 1) - 1);
      renderListas();
      if (S.cartaoAberto === id && S.detalhe) {
        S.detalhe.comentarios = S.detalhe.comentarios.filter(function (m) { return m.id !== comId; });
        renderSecaoComentarios();
      }
    }).catch(falhou);
  }

      }).join('') + '</div></div>' +
      '<div class="campo"><span class="rotulo">Quem vê este quadro</span>' +

      '</div>' +

  function modalEtiquetas() {
    var Q = S.quadro;
    function linha(e) {
      var id = e ? e.id : 'nova';
      var cor = e ? e.cor : CORES_ETIQUETA[0];
      return '<div class="linha-etiqueta" data-etq="' + esc(id) + '">' +
        '<div class="form-linha"><input type="text" maxlength="40" value="' + esc(e ? e.nome : '') + '" placeholder="' + (e ? 'Sem nome' : 'Nome da nova etiqueta') + '" aria-label="Nome da etiqueta" data-etq-nome>' +
        (e ? '<button type="button" class="btn sutil pequeno" data-acao="arquivar-etiqueta" data-id="' + esc(id) + '">Arquivar</button>' : '<button type="button" class="btn pequeno" data-acao="criar-etiqueta">Criar</button>') + '</div>' +
        '<div class="cores miudas" role="radiogroup" aria-label="Cor">' + CORES_ETIQUETA.map(function (c) {
          return '<label class="cor-op"><input type="radio" name="cor-' + esc(id) + '" value="' + c + '"' + (c.toUpperCase() === String(cor).toUpperCase() ? ' checked' : '') + '><span style="--c:' + c + '"></span><span class="so-leitor">' + c + '</span></label>';
        }).join('') + '</div></div>';
    }
    var html = '<div class="modal-cabeca"><h2 id="modal-titulo">Etiquetas do quadro</h2><p>Mudanças aqui valem para todos os cartões que usam a etiqueta.</p></div>' +
      '<div class="modal-corpo" id="etq-corpo">' + Q.etiquetas.map(linha).join('') + linha(null) + '</div>' +
      '<div class="modal-rodape"><div class="direita"><button type="button" class="btn primario" data-acao="fechar-modal">Pronto</button></div></div>';
    var m = abrirModal(html, { aoFechar: function () { renderListas(); if (S.cartaoAberto) renderSecaoProps(); } });
    function salvarLinha(el) {
      var id = el.getAttribute('data-etq');
      if (id === 'nova') return;
      var e = etiquetaPorId(id);
      if (!e) return;
      var nome = el.querySelector('[data-etq-nome]').value.trim();
      var cor = (el.querySelector('input[type="radio"]:checked') || {}).value || e.cor;
      if (nome === e.nome && cor === e.cor) return;
      e.nome = nome; e.cor = cor;
      escrever('salvarEtiqueta', Q.quadro.id, { id: id, nome: nome, cor: cor }).catch(falhou);
    }
    m.addEventListener('change', function (ev) {
      var el = ev.target.closest('.linha-etiqueta');
      if (el) salvarLinha(el);
    });
    m.addEventListener('keydown', function (ev) {
      if (ev.key === 'Enter' && ev.target.matches('[data-etq-nome]')) {
        ev.preventDefault();
        var el = ev.target.closest('.linha-etiqueta');
        if (el.getAttribute('data-etq') === 'nova') criarEtiqueta(); else ev.target.blur();
      }
    });
    function criarEtiqueta() {
      var el = m.querySelector('[data-etq="nova"]');
      var nome = el.querySelector('[data-etq-nome]').value.trim();
      var cor = (el.querySelector('input[type="radio"]:checked') || {}).value || CORES_ETIQUETA[0];
      escrever('salvarEtiqueta', Q.quadro.id, { nome: nome, cor: cor }).then(function (r) {
        Q.etiquetas.push(r.etiqueta);
        el.insertAdjacentHTML('beforebegin', linha(r.etiqueta));
        el.querySelector('[data-etq-nome]').value = '';
        el.querySelector('[data-etq-nome]').focus();
      }).catch(falhou);
    }
    m.addEventListener('click', function (ev) {
      var b = ev.target.closest('[data-acao]');
      if (!b) return;
      if (b.getAttribute('data-acao') === 'criar-etiqueta') { ev.stopPropagation(); criarEtiqueta(); }
      if (b.getAttribute('data-acao') === 'arquivar-etiqueta') {
        ev.stopPropagation();
        var id = b.getAttribute('data-id');
        Q.etiquetas = Q.etiquetas.filter(function (e) { return e.id !== id; });
        b.closest('.linha-etiqueta').remove();
        escrever('arquivarEtiqueta', id).catch(falhou);
      }
    });
  }

      if (ev.target.id === 'mv-quadro') $('#mv-lista').innerHTML = opcoesListas(ev.target.value);
    });

        fecharModal();

  /* ------------------------------------------------------------------
     Atalhos de teclado
     ------------------------------------------------------------------ */
  var ATALHOS = [
    ['/', 'Buscar cartões'],
    ['N', 'Novo cartão na lista do cartão selecionado (ou na primeira lista)'],
    ['M', 'Ligar ou desligar "Só os meus"'],

  function modalAtalhos() {
    abrirModal('<div class="modal-cabeca"><h2 id="modal-titulo">Atalhos do teclado</h2><p>Funcionam no quadro quando você não está digitando num campo.</p></div>' +
      '<div class="modal-corpo"><dl class="atalhos">' + ATALHOS.map(function (a) {
        return '<dt>' + a[0].split(' ').map(function (k) { return '<kbd>' + esc(k) + '</kbd>'; }).join('') + '</dt><dd>' + esc(a[1]) + '</dd>';
      }).join('') + '</dl></div>' +
      '<div class="modal-rodape"><div class="direita"><button type="button" class="btn primario" data-acao="fechar-modal" autofocus>Entendi</button></div></div>');
  }

  function cartaoEmFoco() {
    var a = document.activeElement;
    return (a && a.classList && a.classList.contains('cartao') && a.closest('#listas')) ? a : null;
  }

  function navegarCartoes(tecla) {
    var listas = $$('#listas > .lista');
    var atual = cartaoEmFoco();
    var alvo = null;
    if (!atual) {
      alvo = $('#listas .cartao');
    } else {
      var listaEl = atual.closest('.lista');
      var cartoesLista = $$('.cartao', listaEl);
      var i = cartoesLista.indexOf(atual);
      var li = listas.indexOf(listaEl);
      if (tecla === 'ArrowDown') alvo = cartoesLista[i + 1] || null;
      else if (tecla === 'ArrowUp') alvo = cartoesLista[i - 1] || null;
      else {
        var passo = tecla === 'ArrowRight' ? 1 : -1;
        for (var j = li + passo; j >= 0 && j < listas.length && !alvo; j += passo) {
          var cs = $$('.cartao', listas[j]);
          if (cs.length) alvo = cs[Math.min(i, cs.length - 1)];
        }
      }
    }
    if (alvo) {
      alvo.focus();
      try { alvo.scrollIntoView({ block: 'nearest', inline: 'nearest' }); } catch (err) { /* ok */ }
    }
  }

  /** Devolve true quando a tecla virou atalho (aí o navegador não faz mais nada com ela). */
  function atalho(ev) {
    if (ev.ctrlKey || ev.metaKey || ev.altKey) return false;
    if (modalAtual || menuAberto || ARR) return false;
    var t = ev.target;
    if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.tagName === 'SELECT' || t.isContentEditable)) return false;
    var k = ev.key;
    if (k === '?') { modalAtalhos(); return true; }
    if (S.view !== 'quadro' || !S.quadro || S.cartaoAberto) return false;
    if (k === '/') {
      var busca = $('#filtro-texto');
      if (busca) { busca.focus(); busca.select(); }
      return true;
    }
    if (k === 'm' || k === 'M') {
      S.filtros.meus = !S.filtros.meus;
      var cb = $('#filtro-meus');
      if (cb) cb.checked = S.filtros.meus;
      atualizarBotaoFiltros();
      renderListas();
      aviso(S.filtros.meus ? 'Mostrando só os seus cartões.' : 'Mostrando todos os cartões.');
      return true;
    }
    if ((k === 'n' || k === 'N') && S.quadro.podeEditar && S.quadro.listas.filter(listaNormal).length) {
      var foco = cartaoEmFoco();
      S.novoEm = foco ? foco.closest('.lista').getAttribute('data-id') : S.quadro.listas.filter(listaNormal)[0].id;
      S.rascunhoNovo = '';
      S.criandoLista = false;
      renderListas();
      var ta = $('#novo-cartao-texto');
      if (ta) {
        ta.focus();
        try { ta.scrollIntoView({ block: 'nearest', inline: 'nearest' }); } catch (err) { /* ok */ }
      }
      return true;
    }
    if (k === 'ArrowDown' || k === 'ArrowUp' || k === 'ArrowLeft' || k === 'ArrowRight') { navegarCartoes(k); return true; }
    return false;
  }

              e.frentes.map(function (o) { return '<option value="' + esc(o.id) + '"' + (o.id === f.id ? ' selected' : '') + '>' + esc(o.nome) + '</option>'; }).join('') + '</select></label>' : '');
          var botaoVez = !podeVez ? '' :
